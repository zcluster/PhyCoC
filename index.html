n_i h, without a general wave-phase mechanism explaining why nonintegral orbits are excluded.","period":"1913–1923.","limitation":"Quantization rules depended on chosen coordinates, failed for many-electron atoms, and did not supply a general dynamics of transitions or stationary states.","outcome":"Superseded as fundamental atomic mechanics; retained through semiclassical action quantization and phase-integral methods."},{"id":"R-RADIATION-DUALITY-WITHOUT-MATTER-RECIPROCITY","label":"RADIATION DUALITY WITHOUT MATTER RECIPROCITY","what":"An asymmetric quantum picture in which electromagnetic radiation can exhibit both interference and localized quanta, but massive particles remain exclusively corpuscular and receive no reciprocal frequency or wavelength relation.","period":"1905–1923.","limitation":"It leaves the similarity between the relativistic relations for photons and material particles unused and does not explain atomic action quantization.","outcome":"Superseded as a domain restriction; radiation and matter are both represented by quantum states, though their masses and statistics differ."}],"assets":[{"id":"A-PLANCK-EINSTEIN","label":"radiation quanta obey E=h\\nu=\\hbar\\omega","detail":"radiation quanta obey E=h\\nu=\\hbar\\omega."},{"id":"A-PHOTON-MOMENTUM","label":"Einstein and Compton associate radiation momentum with wavelength","detail":"Einstein and Compton associate radiation momentum with wavelength."},{"id":"A-SPECIAL-RELATIVITY","label":"energy and momentum form a four-vector","detail":"energy and momentum form a four-vector."},{"id":"A-BOHR-SOMMERFELD","label":"atomic stability and spectra require integer quantum conditions","detail":"atomic stability and spectra require integer quantum conditions."},{"id":"A-WAVE-PHASE","label":"interference depends on phase differences and wavelength","detail":"interference depends on phase differences and wavelength."},{"id":"A-BRAGG-DIFFRACTION","label":"crystals provide calibrated periodic structures for wavelength measurement","detail":"crystals provide calibrated periodic structures for wavelength measurement."}],"timeSlices":[{"id":"TS-CLASSICAL-SEPARATION","period":"nineteenth century","label":"Matter is particulate; light and fields are wave-like","detail":"Matter is particulate; light and fields are wave-like — Particle and wave ontologies are assigned to different domains"},{"id":"TS-RADIATION-QUANTA","period":"1900–1923","label":"Planck, Einstein and Compton show discrete radiation exchange","detail":"Planck, Einstein and Compton show discrete radiation exchange — Light exhibits wave propagation and quantum momentum"},{"id":"TS-OLD-QUANTUM-ORBITS","period":"1913–1923","label":"Bohr–Sommerfeld rules select discrete atomic motions without a general dynamics","detail":"Bohr–Sommerfeld rules select discrete atomic motions without a general dynamics — Integer action conditions work but remain partly imposed"},{"id":"TS-DE-BROGLIE","period":"1923–1924","label":"Seek a relativistically coherent reciprocity between matter and radiation","detail":"Seek a relativistically coherent reciprocity between matter and radiation — Every free material quantum receives a phase wave with \\lambda=h/p"},{"id":"TS-ELECTRON-DIFFRACTION","period":"1927","label":"Test whether electron beams possess the predicted wavelength","detail":"Test whether electron beams possess the predicted wavelength — Crystal diffraction validates matter-wave kinematics"},{"id":"TS-WAVE-MECHANICS","period":"1926 onward","label":"Convert matter-wave phase into a general dynamical theory","detail":"Convert matter-wave phase into a general dynamical theory — Schrödinger states, Born probabilities, and later quantum fields supersede a literal classical-wave picture"}],"patterns":[{"id":"P-01","detail":"Relativity, radiation quanta, atomic quantization, and wave phase are unified"},{"id":"P-02","detail":"Bohr's integer orbit conditions become consequences of phase closure"},{"id":"P-03","detail":"“Why are only some orbits allowed?” becomes “Which matter-wave phases satisfy the boundary condition?”"},{"id":"P-04","detail":"A wavelength and phase are assigned to entities previously treated as particles only"},{"id":"P-05","detail":"Classical momentum, optical interference, and old action quantization survive in a broader framework"},{"id":"P-06","detail":"\\lambda=h/p predicts diffraction angles from independently measured voltage and lattice spacing"}],"explicitEdges":[{"source":"A-PLANCK-EINSTEIN","relation":"is-reciprocally-extended-by","target":"D-DE-BROGLIE-MATTER-WAVES-1924"},{"source":"A-SPECIAL-RELATIVITY","relation":"constrains","target":"MATTER-WAVE-FOUR-PHASE"},{"source":"A-BOHR-SOMMERFELD","relation":"is-reframed-by","target":"PHASE-CLOSURE"},{"source":"D-DE-BROGLIE-MATTER-WAVES-1924","relation":"predicts","target":"ELECTRON-DIFFRACTION"},{"source":"DAVISSON-GERMER-1927","relation":"validates","target":"DE-BROGLIE-WAVELENGTH"},{"source":"G-P-THOMSON-1927","relation":"independently-validates","target":"ELECTRON-DIFFRACTION"},{"source":"D-DE-BROGLIE-MATTER-WAVES-1924","relation":"contributes-to","target":"SCHRODINGER-WAVE-MECHANICS"},{"source":"CLASSICAL-TRAJECTORY","relation":"emerges-when","target":"WAVELENGTH-AND-COHERENCE-ARE-UNRESOLVED"},{"source":"D-DE-BROGLIE-MATTER-WAVES-1924","relation":"instantiates","target":"P-03"}],"sourceCount":6,"wordCount":2823},{"file":"fundamental_physics_discoveries/27_quantum_statistics_and_exclusion.md","id":"D-QUANTUM-STATISTICS-1924-1926","title":"Quantum Statistics and the Exclusion Principle","date":"1924–1926","year":1926.9,"era":"Quantum revolution","category":"Quantum & radiation","domain":"Indistinguishable quantum particles and many-body structure","contributors":"Satyendra Nath Bose, Albert Einstein, Wolfgang Pauli, Enrico Fermi, Paul Dirac","status":"Bosonic and fermionic statistics are fundamental consequences of quantum state symmetry and spin–statistics in relativistic QFT","mainline":false,"claim":"Quantum particles of the same species are indistinguishable in a stronger sense than classical identical objects. Symmetric bosonic states allow common occupation; antisymmetric fermionic states enforce Pauli exclusion. This distinction explains matter's structure and collective quantum phases.","pathways":[{"id":"R-MAXWELL-BOLTZMANN-ALL-PARTICLES","label":"MAXWELL BOLTZMANN ALL PARTICLES","what":"A universal classical counting model that treats identical particles as individually labelable, statistically independent occupants of states governed by the Maxwell–Boltzmann distribution.","period":"1860s–1870s.","limitation":"Fails black-body radiation, electron structure, and low-temperature gases.","outcome":"Retained when occupation is low."},{"id":"R-BOSE-STATISTICS-FOR-ALL-MATTER","label":"BOSE STATISTICS FOR ALL MATTER","what":"A universal symmetric-state rule allowing every particle species unrestricted multiple occupation of a one-particle state.","period":"1924.","limitation":"","outcome":"Atomic shells and matter stability require fermionic antisymmetry for half-integer-spin particles."},{"id":"R-PAULI-RULE-WITHOUT-STATE-ANTISYMMETRY","label":"PAULI RULE WITHOUT STATE ANTISYMMETRY","what":"Exclusion imposed as an independent occupancy prohibition without a general many-fermion antisymmetric state structure.","period":"1925.","limitation":"","outcome":"Retained phenomenology, explained and generalized by Fermi statistics and spin–statistics."},{"id":"R-CLASSICAL-ROTATING-SPIN","label":"CLASSICAL ROTATING SPIN","what":"A literal model of electron spin as the surface rotation of an extended charged sphere.","period":"1925–1926.","limitation":"","outcome":"Rejected; intrinsic quantum angular momentum retained."}],"assets":[{"id":"A-PLANCK-SPECTRUM","label":"photon counting problem","detail":"photon counting problem."},{"id":"A-PERIODIC-TABLE","label":"electron-shell regularities","detail":"electron-shell regularities."},{"id":"A-SPIN","label":"intrinsic angular momentum","detail":"intrinsic angular momentum."},{"id":"A-INDISTINGUISHABILITY","label":"label exchange has no new observable state","detail":"label exchange has no new observable state."}],"timeSlices":[{"id":"TS-PLANCK-COUNTING","period":"1900 onward","label":"Radiation modes counted unusually","detail":"Radiation modes counted unusually — Classical distinguishability fails"},{"id":"TS-BOSE","period":"1924","label":"Photon statistics derived without labeling quanta","detail":"Photon statistics derived without labeling quanta — New counting rule"},{"id":"TS-EINSTEIN","period":"1924–1925","label":"Applied to material particles","detail":"Applied to material particles — Condensation predicted"},{"id":"TS-PAULI","period":"1925","label":"Exclusion principle for electrons","detail":"Exclusion principle for electrons — Periodic table explained structurally"},{"id":"TS-FERMI-DIRAC","period":"1926","label":"Fermion distribution derived","detail":"Fermion distribution derived — Degenerate matter theory"},{"id":"TS-SPIN-STATISTICS","period":"1930s–1940s","label":"Relativistic field theory connects spin and symmetry","detail":"Relativistic field theory connects spin and symmetry — Fundamental classification"}],"patterns":[{"id":"P-01","detail":"Spectra, chemistry, radiation, and matter stability unified"},{"id":"P-02","detail":"Exchange symmetry generates occupation rules"},{"id":"P-03","detail":"Particle counting reframed without individual labels"},{"id":"P-04","detail":"Indistinguishability and antisymmetric states accepted"},{"id":"P-05","detail":"Maxwell–Boltzmann statistics retained as dilute limit"},{"id":"P-06","detail":"Heat capacities, spectra, and degeneracy provide tests"}],"explicitEdges":[{"source":"A-PLANCK-SPECTRUM","relation":"motivates","target":"D-BOSE-STATISTICS"},{"source":"D-BOSE-STATISTICS","relation":"generalized-by","target":"D-EINSTEIN-MATERIAL-BOSONS"},{"source":"A-PERIODIC-TABLE","relation":"constrains","target":"D-PAULI-EXCLUSION"},{"source":"ANTISYMMETRY","relation":"implies","target":"EXCLUSION"},{"source":"SYMMETRY","relation":"permits","target":"MULTIPLE-BOSON-OCCUPATION"},{"source":"D-QUANTUM-STATISTICS-1924-1926","relation":"retains-limit","target":"R-MAXWELL-BOLTZMANN-ALL-PARTICLES"},{"source":"D-QUANTUM-STATISTICS-1924-1926","relation":"instantiates","target":"P-01"}],"sourceCount":3,"wordCount":1679},{"file":"fundamental_physics_discoveries/47_quantum_field_theory.md","id":"D-QFT-FIELD-QUANTIZATION-1927","title":"Quantum Field Theory and Field Quantization","date":"1927 Dirac radiation-field quantization","year":1927.17,"era":"Quantum revolution","category":"Cosmos & spacetime","domain":"Relativistic quantum fields, particle creation and annihilation, and many-body quantum theory","contributors":"Dirac, Born, Heisenberg, Jordan, Pauli, Fermi and many later developers","status":"Foundational framework of the Standard Model and condensed-matter many-body theory; specific QFTs are domain-bounded and quantum gravity remains incomplete","mainline":true,"claim":"Quantum field theory promotes fields—or their modes—to quantum operators and treats particles as quantized excitations. Dirac's 1927 radiation theory supplied a decisive first working synthesis: emission and absorption became changes of occupation number rather than unexplained jumps between fixed-particle wavefunctions. Subsequent relativistic matter fields, antiparticles, renormalization, gauge theory, and effective-field-theory ideas transformed this beginning into the modern framework. QFT is not one unique model and Yang–Mills theory is not synonymous with it; Yang–Mills is a 1954 class of non-Abelian gauge field theories within QFT.","pathways":[{"id":"R-FIXED-PARTICLE-RELATIVISTIC-QUANTUM-MECHANICS","label":"FIXED PARTICLE RELATIVISTIC QUANTUM MECHANICS","what":"A program that assigns a relativistic wave equation to a fixed number of particles and interprets its wavefunction as an ordinary probability amplitude, without field operators that create or annihilate quanta.","period":"1925–1926.","limitation":"Relativity allows conversion between energy and rest mass, while negative-frequency solutions and pair processes resist a fixed-number probability interpretation.","outcome":"Retained as a controlled low-energy or one-particle approximation, superseded as a universal foundation."},{"id":"R-QUANTIZED-MATTER-CLASSICAL-RADIATION","label":"QUANTIZED MATTER CLASSICAL RADIATION","what":"A semiclassical hybrid in which atoms obey quantum mechanics but the electromagnetic field remains a prescribed classical wave, so matter changes state without photon creation or quantum vacuum fluctuations.","period":"1900–1926.","limitation":"It does not naturally generate spontaneous emission, photon statistics, vacuum corrections, or recoil from individual emission events.","outcome":"Retained as the semiclassical and coherent-state limit, not a complete radiation theory."},{"id":"R-OSCILLATOR-QUANTA-WITHOUT-FIELD-OPERATORS","label":"OSCILLATOR QUANTA WITHOUT FIELD OPERATORS","what":"A model that assigns discrete energies E_n=nh\\nu to radiation oscillators or counts light quanta statistically but does not construct operator-valued fields with explicit creation, annihilation, and matter-coupling dynamics.","period":"1900–1926.","limitation":"It leaves the wave structure, interference, spontaneous emission, and multiparticle amplitudes only partially unified.","outcome":"Absorbed into QFT as the occupation-number interpretation of quantized modes."}],"assets":[{"id":"A-CLASSICAL-FIELDS","label":"Maxwell and other wave fields with infinitely many modes","detail":"Maxwell and other wave fields with infinitely many modes."},{"id":"A-HARMONIC-OSCILLATORS","label":"each free-field Fourier mode behaves like an oscillator","detail":"each free-field Fourier mode behaves like an oscillator."},{"id":"A-MATRIX-MECHANICS","label":"noncommuting operators and transition amplitudes","detail":"noncommuting operators and transition amplitudes."},{"id":"A-LIGHT-QUANTA","label":"discrete radiation energy and momentum","detail":"discrete radiation energy and momentum."},{"id":"A-BOSE-STATISTICS","label":"arbitrary occupation of identical bosonic modes","detail":"arbitrary occupation of identical bosonic modes."},{"id":"A-SPECIAL-RELATIVITY","label":"energy–mass conversion and Lorentz covariance","detail":"energy–mass conversion and Lorentz covariance."}],"timeSlices":[{"id":"TS-CLASSICAL-FIELDS","period":"nineteenth century","label":"Electromagnetic and continuum fields carry energy and momentum","detail":"Electromagnetic and continuum fields carry energy and momentum — Fields become autonomous dynamical entities"},{"id":"TS-QUANTUM-RADIATION","period":"1900–1926","label":"Light shows quantum exchange while wave equations remain indispensable","detail":"Light shows quantum exchange while wave equations remain indispensable — Oscillator modes and occupation numbers suggest field quantization"},{"id":"TS-DIRAC-QFT","period":"1927","label":"Explain emission, absorption, and spontaneous radiation in quantum mechanics","detail":"Explain emission, absorption, and spontaneous radiation in quantum mechanics — Creation and annihilation operators quantize radiation modes"},{"id":"TS-RELATIVISTIC-MATTER","period":"1928–1930s","label":"Relativity permits negative-frequency solutions and variable particle number","detail":"Relativity permits negative-frequency solutions and variable particle number — Electron/positron and meson fields replace fixed-particle interpretation"},{"id":"TS-RENORMALIZED-QFT","period":"1940s onward","label":"Interactions generate ultraviolet divergences","detail":"Interactions generate ultraviolet divergences — Renormalization and later Wilsonian scale analysis define predictive theories"}],"patterns":[{"id":"P-01","detail":"Wave fields, particles, quantum transitions, and relativity enter one framework"},{"id":"P-02","detail":"Spectral and transition regularities become amplitudes generated by field operators"},{"id":"P-03","detail":"“Is radiation a wave or particle?” becomes “Which field state and observable are being probed?”"},{"id":"P-04","detail":"Operator-valued fields, vacuum states, and variable particle number are admitted"},{"id":"P-05","detail":"Classical waves and fixed-particle quantum mechanics survive as controlled limits"},{"id":"P-06","detail":"Lagrangians generate quantitative decay rates, scattering cross sections, and radiative shifts"}],"explicitEdges":[{"source":"A-CLASSICAL-FIELDS","relation":"provides-modes-for","target":"D-QFT-FIELD-QUANTIZATION-1927"},{"source":"A-HARMONIC-OSCILLATORS","relation":"is-quantized-by","target":"CREATION-ANNIHILATION-ALGEBRA"},{"source":"A-LIGHT-QUANTA","relation":"motivates","target":"D-QFT-FIELD-QUANTIZATION-1927"},{"source":"D-QFT-FIELD-QUANTIZATION-1927","relation":"explains","target":"SPONTANEOUS-EMISSION"},{"source":"FIELD-OPERATOR","relation":"creates-excitations-called","target":"PARTICLES"},{"source":"FIXED-PARTICLE-QM","relation":"approximates","target":"LOW-ENERGY-QFT-SECTOR"},{"source":"D-QFT-FIELD-QUANTIZATION-1927","relation":"enables","target":"YANG-MILLS-QFT"},{"source":"D-QFT-FIELD-QUANTIZATION-1927","relation":"instantiates","target":"P-04"}],"sourceCount":4,"wordCount":2198},{"file":"fundamental_physics_discoveries/26_quantum_mechanics.md","id":"D-QUANTUM-MECHANICS-1925-1927","title":"Quantum Mechanics","date":"1925–1927","year":1927.8,"era":"Quantum revolution","category":"Quantum & radiation","domain":"Microscopic states, observables, and probabilities","contributors":"Heisenberg, Schrödinger, Born, Dirac, Jordan, Pauli, de Broglie, Bohr and many others","status":"Foundational nonrelativistic quantum framework; relativistic quantum field theory extends it","mainline":true,"claim":"Quantum mechanics replaced classical phase-space trajectories with states in Hilbert space, noncommuting observables, unitary evolution, and probabilistic measurement outcomes. Matrix and wave formulations were shown to be equivalent representations.","pathways":[{"id":"R-BOHR-SOMMERFELD","label":"BOHR SOMMERFELD","what":"The old quantum theory that preserves classical orbits and phase-space motion but imposes discrete action-integral conditions to select allowed trajectories and energies.","period":"1913–1924.","limitation":"Multi-electron atoms and transition intensities.","outcome":"Quantization conditions replaced by operators and boundary-value problems."},{"id":"R-CLASSICAL-DEFINITE-TRAJECTORIES","label":"CLASSICAL DEFINITE TRAJECTORIES","what":"A classical state model in which every particle possesses one exact position and momentum at each time and follows a unique continuous trajectory determined by local equations of motion.","period":"seventeenth century–1924.","limitation":"Interference, discrete spectra, and uncertainty cannot generally be represented by simultaneous exact x,p.","outcome":"Classical trajectories retained in semiclassical and decohered limits."},{"id":"R-MATRIX-MECHANICS-AS-UNIQUE-ONTOLOGY","label":"MATRIX MECHANICS AS UNIQUE ONTOLOGY","what":"The view that Heisenberg's noncommuting transition matrices are not merely a representation but the uniquely fundamental formulation, with wave mechanics a rival theory.","period":"1925.","limitation":"","outcome":"Schrödinger/Dirac equivalence showed representation unity; matrix structure retained."},{"id":"R-LITERAL-THREE-DIMENSIONAL-MATTER-WAVE","label":"LITERAL THREE DIMENSIONAL MATTER WAVE","what":"The interpretation of every many-particle wavefunction as an ordinary material wave propagating only in physical three-dimensional space.","period":"1923–1926.","limitation":"","outcome":"Configuration-space structure and Born probabilities make the simple reading incomplete."}],"assets":[{"id":"A-PLANCK-EINSTEIN","label":"energy quanta","detail":"energy quanta."},{"id":"A-ATOMIC-SPECTRA","label":"discrete frequencies","detail":"discrete frequencies."},{"id":"A-DE-BROGLIE","label":"\\lambda=h/p","detail":"\\lambda=h/p."},{"id":"A-HAMILTONIAN-MECHANICS","label":"energy as generator of time evolution","detail":"energy as generator of time evolution."},{"id":"A-LINEAR-ALGEBRA","label":"eigenvalues and transformations","detail":"eigenvalues and transformations."}],"timeSlices":[{"id":"TS-OLD-QUANTUM","period":"1900–1924","label":"Quanta explain selected spectra","detail":"Quanta explain selected spectra — Ad hoc orbit rules proliferate"},{"id":"TS-MATTER-WAVES","period":"1924","label":"de Broglie assigns wavelength to matter","detail":"de Broglie assigns wavelength to matter — Wave dynamics sought"},{"id":"TS-MATRIX","period":"1925","label":"Heisenberg uses observable transitions","detail":"Heisenberg uses observable transitions — Noncommuting algebra enters"},{"id":"TS-WAVE","period":"1926","label":"Schrödinger equation developed","detail":"Schrödinger equation developed — Bound-state spectra derived"},{"id":"TS-BORN","period":"1926","label":"\\(","detail":"\\( — \\psi — ^2\\) interpreted probabilistically — Deterministic amplitude, stochastic outcomes"},{"id":"TS-FORMALIZATION","period":"1927 onward","label":"Uncertainty, transformations, Hilbert space","detail":"Uncertainty, transformations, Hilbert space — General framework consolidates"}],"patterns":[{"id":"P-01","detail":"Waves, particles, spectra, and probability unified"},{"id":"P-02","detail":"Hamiltonians generate spectra and time evolution"},{"id":"P-03","detail":"Trajectory prediction reframed as amplitude prediction"},{"id":"P-04","detail":"Superposition and noncommuting observables accepted"},{"id":"P-05","detail":"Classical mechanics retained as a limit"},{"id":"P-06","detail":"Spectral values and interference probabilities test the theory"}],"explicitEdges":[{"source":"A-DE-BROGLIE","relation":"contributes-to","target":"D-WAVE-MECHANICS"},{"source":"A-ATOMIC-SPECTRA","relation":"constrains","target":"D-QUANTUM-MECHANICS-1925-1927"},{"source":"D-MATRIX-MECHANICS","relation":"equivalent-to","target":"D-WAVE-MECHANICS"},{"source":"BORN-RULE","relation":"maps","target":"QUANTUM-STATE"},{"source":"BORN-RULE","relation":"maps-to","target":"OUTCOME-PROBABILITIES"},{"source":"NONCOMMUTATION","relation":"implies","target":"UNCERTAINTY-RELATION"},{"source":"D-QUANTUM-MECHANICS-1925-1927","relation":"supersedes","target":"R-BOHR-SOMMERFELD"},{"source":"D-QUANTUM-MECHANICS-1925-1927","relation":"retains-limit","target":"CLASSICAL-MECHANICS"},{"source":"D-QUANTUM-MECHANICS-1925-1927","relation":"instantiates","target":"P-03"}],"sourceCount":3,"wordCount":1684},{"file":"fundamental_physics_discoveries/25_expanding_universe.md","id":"D-COSMIC-EXPANSION-1922-1929","title":"Expanding Universe","date":"1922–1929 (Friedmann/Lemaître through Hubble)","year":1929,"era":"Quantum revolution","category":"Cosmos & spacetime","domain":"Relativistic cosmology","contributors":"Alexander Friedmann, Georges Lemaître, Vesto Slipher, Edwin Hubble, Milton Humason and others","status":"Cosmic expansion is established; credit cannot be reduced to a single law or observer","mainline":false,"claim":"Relativistic solutions and galaxy redshift–distance data established that cosmic scale changes with time. Slipher measured many redshifts; Friedmann and Lemaître developed expanding solutions; Lemaître connected theory and data; Hubble and Humason strengthened the empirical relation.","pathways":[{"id":"R-STATIC-UNIVERSE","label":"STATIC UNIVERSE","what":"A cosmological model in which the universe's large-scale geometry, matter distribution, and characteristic distances are constant in time rather than governed by an evolving scale factor.","period":"1917 (Einstein static model).","limitation":"Relativistic static solutions are non-generic and redshift–distance patterns indicate dynamics.","outcome":"Superseded globally; bound systems remain approximately static."},{"id":"R-DE-SITTER-STATIC-REDSHIFT","label":"DE SITTER STATIC REDSHIFT","what":"The interpretation that cosmological redshifts arise from static-coordinate properties of de Sitter spacetime rather than an evolving matter-filled scale factor.","period":"1917.","limitation":"","outcome":"Historically important but insufficient for the full distance, matter, evolution, and CMB evidence."}],"assets":[{"id":"A-GR","label":"dynamical spacetime equations","detail":"dynamical spacetime equations."},{"id":"A-GALAXY-REDSHIFTS","label":"Slipher's spectroscopy","detail":"Slipher's spectroscopy."},{"id":"A-DISTANCE-LADDER","label":"Cepheids and luminosity calibration","detail":"Cepheids and luminosity calibration."},{"id":"A-HOMOGENEITY","label":"large-scale symmetry assumption","detail":"large-scale symmetry assumption."}],"timeSlices":[{"id":"TS-STATIC-COSMOS","period":"Pre-1917","label":"Large-scale universe assumed static","detail":"Large-scale universe assumed static — General relativity permits dynamics"},{"id":"TS-EINSTEIN-STATIC","period":"1917","label":"\\Lambda used for static model","detail":"\\Lambda used for static model — Stability and evidence problematic"},{"id":"TS-SLIPHER","period":"1910s–1920s","label":"Spiral-nebula redshifts measured","detail":"Spiral-nebula redshifts measured — Many large recessional velocities"},{"id":"TS-FRIEDMANN","period":"1922–1924","label":"Dynamical scale-factor solutions","detail":"Dynamical scale-factor solutions — Expansion theoretically allowed"},{"id":"TS-LEMAITRE","period":"1927","label":"Theory connected to redshift-distance data","detail":"Theory connected to redshift-distance data — Expansion rate estimated"},{"id":"TS-HUBBLE-HUMASON","period":"1929 onward","label":"Distances and redshifts correlated","detail":"Distances and redshifts correlated — Expansion becomes empirical program"}],"patterns":[{"id":"P-01","detail":"Relativity, spectroscopy, and distance measurement unified"},{"id":"P-02","detail":"Scale-factor dynamics generates redshift histories"},{"id":"P-03","detail":"Galaxy recession reframed as metric expansion"},{"id":"P-04","detail":"A dynamical universe accepted"},{"id":"P-05","detail":"Local Doppler intuition retained only at low redshift"},{"id":"P-06","detail":"Redshift–distance relation makes cosmology testable"}],"explicitEdges":[{"source":"A-GR","relation":"permits","target":"D-FRIEDMANN-SOLUTIONS"},{"source":"A-GALAXY-REDSHIFTS","relation":"contributes-to","target":"D-COSMIC-EXPANSION-1922-1929"},{"source":"A-DISTANCE-LADDER","relation":"enables","target":"REDSHIFT-DISTANCE-RELATION"},{"source":"D-LEMAITRE-1927","relation":"connects","target":"D-FRIEDMANN-SOLUTIONS"},{"source":"D-LEMAITRE-1927","relation":"connects","target":"REDSHIFT-DISTANCE-RELATION"},{"source":"REDSHIFT-DISTANCE-RELATION","relation":"supersedes","target":"R-STATIC-UNIVERSE"},{"source":"V-CMB","relation":"supports","target":"HOT-EXPANDING-UNIVERSE"},{"source":"D-COSMIC-EXPANSION-1922-1929","relation":"instantiates","target":"P-01"}],"sourceCount":3,"wordCount":1557},{"file":"fundamental_physics_discoveries/29_neutron.md","id":"D-CHADWICK-NEUTRON-1932","title":"The Neutron","date":"February 1932","year":1932.15,"era":"Quantum revolution","category":"Nuclear & particles","domain":"Nuclear constitution","contributors":"James Chadwick, building on experiments by Bothe, Becker, Irène Joliot-Curie and Frédéric Joliot-Curie","status":"The neutron is a composite neutral baryon made primarily of udd valence quarks plus sea quarks and gluons","mainline":false,"claim":"Chadwick interpreted penetrating radiation from beryllium bombarded by alpha particles as massive neutral particles. Collision kinematics showed that a photon interpretation required implausibly high energies, while a neutral particle with mass near the proton fit recoil data.","pathways":[{"id":"R-HIGH-ENERGY-GAMMA","label":"HIGH ENERGY GAMMA","what":"The hypothesis that the neutral penetrating radiation emitted from alpha-bombarded beryllium consists of exceptionally energetic gamma-ray photons rather than massive neutral particles.","period":"January–February 1932.","limitation":"Compton recoil of protons and nitrogen required inconsistent photon energies.","outcome":"Replaced by massive neutral projectile."},{"id":"R-PROTON-ELECTRON-NUCLEUS","label":"PROTON ELECTRON NUCLEUS","what":"A pre-neutron nuclear model in which a nucleus contains enough protons to account for its mass number plus confined electrons that reduce the net charge to the observed atomic number.","period":"1911–early 1932.","limitation":"Nuclear electron confinement conflicts with quantum scales; spin and statistics fail.","outcome":"Replaced by proton–neutron nuclei."},{"id":"R-NEUTRAL-PROTON-ELECTRON-BOUND-NEUTRON","label":"NEUTRAL PROTON ELECTRON BOUND NEUTRON","what":"A model of the neutron itself as a very tightly bound proton–electron composite rather than a new nucleon.","period":"1920.","limitation":"","outcome":"Spin, magnetic moment, confinement energy, and beta-decay theory reject it; neutron's quark compositeness is different."}],"assets":[{"id":"A-ALPHA-SOURCE","label":"initiates beryllium reaction","detail":"initiates beryllium reaction."},{"id":"A-PARAFFIN","label":"hydrogen-rich recoil target","detail":"hydrogen-rich recoil target."},{"id":"A-COLLISION-KINEMATICS","label":"infers projectile mass","detail":"infers projectile mass."},{"id":"A-IONIZATION-CHAMBER","label":"measures recoil energy","detail":"measures recoil energy."}],"timeSlices":[{"id":"TS-PROTON-ELECTRON-NUCLEUS","period":"1920s","label":"Nuclei modeled from protons and nuclear electrons","detail":"Nuclei modeled from protons and nuclear electrons — Spin/statistics and confinement problems"},{"id":"TS-BERYLLIUM-RADIATION","period":"1930","label":"Penetrating neutral radiation observed","detail":"Penetrating neutral radiation observed — Initially called gamma radiation"},{"id":"TS-PARAFFIN-RECOILS","period":"1932","label":"Radiation ejects energetic protons","detail":"Radiation ejects energetic protons — Photon energy requirements problematic"},{"id":"TS-CHADWICK","period":"1932","label":"Elastic-collision analysis","detail":"Elastic-collision analysis — Neutron inferred"},{"id":"TS-NUCLEAR-MODELS","period":"1932 onward","label":"Proton–neutron nucleus adopted","detail":"Proton–neutron nucleus adopted — Isotopes and beta decay clarified"},{"id":"TS-QUARK","period":"1960s onward","label":"Nucleon substructure revealed","detail":"Nucleon substructure revealed — Neutron becomes composite"}],"patterns":[{"id":"P-01","detail":"Recoil kinematics and nuclear composition unified"},{"id":"P-02","detail":"Collision equations infer invisible projectile mass"},{"id":"P-03","detail":"“Penetrating gamma ray” reframed as neutral matter"},{"id":"P-04","detail":"Massive uncharged particle accepted"},{"id":"P-05","detail":"Proton nucleus retained with new partner"},{"id":"P-06","detail":"Multiple target recoil energies discriminate hypotheses"}],"explicitEdges":[{"source":"A-ALPHA-SOURCE","relation":"produces","target":"BERYLLIUM-RADIATION"},{"source":"R-HIGH-ENERGY-GAMMA","relation":"attempts-to-explain","target":"BERYLLIUM-RADIATION"},{"source":"A-PARAFFIN","relation":"reveals","target":"PROTON-RECOIL"},{"source":"A-COLLISION-KINEMATICS","relation":"infers","target":"NEUTRON-MASS"},{"source":"D-CHADWICK-NEUTRON-1932","relation":"supersedes","target":"R-HIGH-ENERGY-GAMMA"},{"source":"D-CHADWICK-NEUTRON-1932","relation":"supersedes","target":"R-PROTON-ELECTRON-NUCLEUS"},{"source":"D-QCD","relation":"reframes","target":"NEUTRON-AS-COMPOSITE"},{"source":"D-CHADWICK-NEUTRON-1932","relation":"instantiates","target":"P-02"}],"sourceCount":3,"wordCount":1605},{"file":"fundamental_physics_discoveries/28_relativistic_quantum_theory_and_antimatter.md","id":"D-DIRAC-ANTIMATTER-1928-1932","title":"Relativistic Quantum Theory and Antimatter","date":"1928 theory; 1932 positron discovery","year":1932.7,"era":"Quantum revolution","category":"Cosmos & spacetime","domain":"Relativistic spin-\\tfrac12 particles and antiparticles","contributors":"Paul Dirac and Carl Anderson","status":"Dirac field theory is a core component of quantum electrodynamics and the Standard Model","mainline":false,"claim":"Dirac constructed a quantum equation linear in time and space derivatives that was compatible with special relativity and described electron spin. Its negative-energy solutions led, through developing interpretation, to the prediction of an electron antiparticle, observed by Anderson as the positron.","pathways":[{"id":"R-NONRELATIVISTIC-ELECTRON-ONLY","label":"NONRELATIVISTIC ELECTRON ONLY","what":"A fixed-particle quantum model that describes a single electron with the nonrelativistic Schrödinger equation and contains neither relativistic spinor structure nor particle creation and antiparticles.","period":"1925–1926.","limitation":"Omits Lorentz covariance, antiparticles, and intrinsic spin structure.","outcome":"Retained as low-energy limit."},{"id":"R-LITERAL-DIRAC-SEA","label":"LITERAL DIRAC SEA","what":"The hole-theory ontology in which every negative-energy electron state in the vacuum is physically occupied and a missing electron in that infinite sea appears as a positron.","period":"1930.","limitation":"Infinite sea bookkeeping and generalization difficulties.","outcome":"Replaced by quantum-field creation and annihilation operators."},{"id":"R-KLEIN-GORDON-SINGLE-PARTICLE-PROBABILITY","label":"KLEIN GORDON SINGLE PARTICLE PROBABILITY","what":"The interpretation of a Klein–Gordon wavefunction as a one-particle probability amplitude with its conserved time component treated as a positive density.","period":"1926.","limitation":"","outcome":"Density is not positive definite; equation retained for quantum scalar fields."},{"id":"R-SQUARE-ROOT-RELATIVISTIC-SCHRODINGER","label":"SQUARE ROOT RELATIVISTIC SCHRODINGER","what":"A fixed-particle equation using H=\\sqrt{p^2c^2+m^2c^4} directly as the quantum Hamiltonian.","period":"1926–1927.","limitation":"","outcome":"Limited by nonlocality and absent creation/antiparticles; nonrelativistic limit retained."}],"assets":[{"id":"A-SPECIAL-RELATIVITY","label":"E^2=p^2c^2+m^2c^4","detail":"E^2=p^2c^2+m^2c^4."},{"id":"A-QUANTUM-MECHANICS","label":"operator dynamics","detail":"operator dynamics."},{"id":"A-PAULI-MATRICES","label":"spin algebra","detail":"spin algebra."},{"id":"A-CLOUD-CHAMBER","label":"charged-particle tracks","detail":"charged-particle tracks."},{"id":"A-MAGNETIC-CURVATURE","label":"sign and momentum inference","detail":"sign and momentum inference."}],"timeSlices":[{"id":"TS-SCHRODINGER","period":"1926","label":"Nonrelativistic quantum dynamics successful","detail":"Nonrelativistic quantum dynamics successful — Not Lorentz covariant"},{"id":"TS-KLEIN-GORDON","period":"1926","label":"Relativistic scalar equation","detail":"Relativistic scalar equation — Probability and electron-spin issues"},{"id":"TS-DIRAC","period":"1928","label":"First-order relativistic spinor equation","detail":"First-order relativistic spinor equation — Spin and magnetic moment emerge"},{"id":"TS-HOLE-THEORY","period":"1930–1931","label":"Negative energies interpreted","detail":"Negative energies interpreted — Antiparticle predicted"},{"id":"TS-ANDERSON","period":"1932","label":"Positive electron track observed","detail":"Positive electron track observed — Positron established"},{"id":"TS-QFT","period":"1930s onward","label":"Fields quantized; creation/annihilation natural","detail":"Fields quantized; creation/annihilation natural — Hole ontology no longer fundamental"}],"patterns":[{"id":"P-01","detail":"Quantum mechanics, relativity, and spin unified"},{"id":"P-02","detail":"Equation structure generates antiparticle solutions"},{"id":"P-03","detail":"Negative energies reframed as new particle sector"},{"id":"P-04","detail":"Antimatter accepted"},{"id":"P-05","detail":"Schrödinger/Pauli theory retained as low-energy limit"},{"id":"P-06","detail":"Cloud-chamber curvature and annihilation test charge and mass"}],"explicitEdges":[{"source":"A-SPECIAL-RELATIVITY","relation":"constrains","target":"D-DIRAC-EQUATION"},{"source":"A-QUANTUM-MECHANICS","relation":"contributes-to","target":"D-DIRAC-EQUATION"},{"source":"D-DIRAC-EQUATION","relation":"generates","target":"NEGATIVE-ENERGY-SOLUTIONS"},{"source":"NEGATIVE-ENERGY-SOLUTIONS","relation":"reframed-as","target":"POSITRON"},{"source":"A-CLOUD-CHAMBER","relation":"detects","target":"D-ANDERSON-POSITRON"},{"source":"D-ANDERSON-POSITRON","relation":"validates","target":"ANTIMATTER-PREDICTION"},{"source":"D-QFT","relation":"supersedes","target":"R-LITERAL-DIRAC-SEA"},{"source":"D-DIRAC-ANTIMATTER-1928-1932","relation":"instantiates","target":"P-02"}],"sourceCount":4,"wordCount":1709},{"file":"fundamental_physics_discoveries/48_quantum_entanglement.md","id":"D-ENTANGLEMENT-1935","title":"Quantum Entanglement and Nonseparability","date":"1935 EPR paper and Schrödinger's entanglement analysis","year":1935.8,"era":"Quantum revolution","category":"Quantum & radiation","domain":"Composite quantum systems, correlations, quantum foundations, and quantum information","contributors":"Einstein, Podolsky, Rosen, Schrödinger; later developed by Bell, Bohm, Clauser, Aspect, Zeilinger and many others","status":"Entangled states and their operational consequences are experimentally established; interpretations of quantum states and nonlocality remain contested","mainline":false,"claim":"An entangled state of a composite quantum system cannot be represented as a product of states belonging separately to its parts. The whole has a well-defined quantum state while the subsystems may possess only mixed reduced states, and measurements can display correlations unavailable to separable preparations. The 1935 EPR argument exposed this nonseparability while attempting to show incompleteness; Schrödinger identified it as the characteristic feature of quantum mechanics. Entanglement alone neither permits controllable faster-than-light signaling nor settles the ontology of the quantum state.","pathways":[{"id":"R-SEPARABLE-COMPOSITE-STATE","label":"SEPARABLE COMPOSITE STATE","what":"The assumption that after two systems separate, their complete joint physical state can always be written as a product |\\psi_A\\rangle\\otimes|\\psi_B\\rangle, or as an ordinary probabilistic mixture of such products, so all correlations arise from locally possessed states and shared classical randomness.","period":"classical statistical tradition through 1934.","limitation":"Generic quantum interactions produce pure joint states with no pure state assignable to either subsystem.","outcome":"Retained as the definition of unentangled states, rejected as a universal composition principle."},{"id":"R-WAVEFUNCTION-AS-COMPLETE-LOCAL-PROPERTIES","label":"WAVEFUNCTION AS COMPLETE LOCAL PROPERTIES","what":"A reading in which the joint wavefunction is complete while each separated subsystem simultaneously possesses its own complete pure-state wavefunction and all correlations can be understood through those local pure properties.","period":"1926–1934.","limitation":"An entangled pure state gives mixed reduced density operators, and alternative measurements on one side generate different conditional ensembles for the same remote marginal state.","outcome":"Superseded for entangled composites; completeness and ontology remain interpretation-dependent."},{"id":"R-EPR-LOCAL-COMPLETE-QM","label":"EPR LOCAL COMPLETE QM","what":"The conjunction used to sharpen the EPR dilemma: the quantum wavefunction is a complete description, and a measurement performed on one spatially separated system cannot affect the physical reality of the other.","period":"March–May 1935 before Schrödinger's explicit entanglement formulation.","limitation":"EPR argued that the conjunction forces incompatible “elements of reality” not simultaneously represented by the wavefunction.","outcome":"The conjunction is not accepted as a straightforward resolution; its components survive in distinct interpretations and causal analyses."}],"assets":[{"id":"A-TENSOR-PRODUCT","label":"mathematical composition of quantum state spaces","detail":"mathematical composition of quantum state spaces."},{"id":"A-SUPERPOSITION","label":"coherent addition of alternative joint amplitudes","detail":"coherent addition of alternative joint amplitudes."},{"id":"A-INCOMPATIBLE-OBSERVABLES","label":"noncommuting measurements and uncertainty","detail":"noncommuting measurements and uncertainty."},{"id":"A-EPR-CORRELATIONS","label":"perfect cross-system prediction used to test completeness","detail":"perfect cross-system prediction used to test completeness."},{"id":"A-DENSITY-OPERATOR","label":"state representation for mixtures and subsystems","detail":"state representation for mixtures and subsystems."},{"id":"A-RELATIVISTIC-CAUSALITY","label":"constraint against controllable superluminal communication","detail":"constraint against controllable superluminal communication."}],"timeSlices":[{"id":"TS-COMPOSITE-QM","period":"1926–1932","label":"Tensor-product wavefunctions describe interacting systems","detail":"Tensor-product wavefunctions describe interacting systems — Nonfactorizable states appear in atomic and spin calculations"},{"id":"TS-EPR","period":"May 1935","label":"Perfect correlations confront locality and completeness","detail":"Perfect correlations confront locality and completeness — Composite states become a foundational dilemma"},{"id":"TS-SCHRODINGER","period":"1935–1936","label":"Analyze what interaction does to subsystem states","detail":"Analyze what interaction does to subsystem states — “Entanglement” and steering are articulated"},{"id":"TS-BELL","period":"1964–1982","label":"Separate philosophical claims from testable correlation bounds","detail":"Separate philosophical claims from testable correlation bounds — Bell inequalities and experiments constrain local-causal models"},{"id":"TS-QUANTUM-INFORMATION","period":"1980s onward","label":"Treat correlations as operational resources","detail":"Treat correlations as operational resources — Teleportation, cryptography, computation, and entanglement measures develop"}],"patterns":[{"id":"P-01","detail":"Composite-system probability, quantum state structure, and causal questions are unified"},{"id":"P-02","detail":"Perfect correlations become consequences of a nonfactorizable joint state"},{"id":"P-03","detail":"“What properties does each particle carry?” becomes “What joint and reduced states are defined?”"},{"id":"P-04","detail":"Holistic quantum information without autonomous pure subsystem states is tolerated"},{"id":"P-05","detail":"Product states and classical correlations remain the separable subset"},{"id":"P-06","detail":"Entanglement witnesses, tomography, Bell inequalities, and operational tasks quantify the structure"}],"explicitEdges":[{"source":"A-TENSOR-PRODUCT","relation":"enables","target":"D-ENTANGLEMENT-1935"},{"source":"A-EPR-CORRELATIONS","relation":"exposes","target":"NONSEPARABILITY"},{"source":"D-ENTANGLEMENT-1935","relation":"implies","target":"MIXED-REDUCED-STATE"},{"source":"SCHMIDT-RANK-GREATER-THAN-ONE","relation":"classifies","target":"PURE-STATE-ENTANGLEMENT"},{"source":"LOCAL-TRACE-PRESERVING-OPERATION","relation":"preserves","target":"REMOTE-MARGINAL"},{"source":"D-ENTANGLEMENT-1935","relation":"precedes","target":"BELL-THEOREM-1964"},{"source":"D-ENTANGLEMENT-1935","relation":"enables","target":"QUANTUM-TELEPORTATION"},{"source":"D-ENTANGLEMENT-1935","relation":"instantiates","target":"P-03"}],"sourceCount":4,"wordCount":2207},{"file":"fundamental_physics_discoveries/49_landau_phase_transitions_and_symmetry_breaking.md","id":"D-LANDAU-ORDER-PARAMETER-1937","title":"Landau Theory of Phase Transitions and Spontaneous Symmetry Breaking","date":"1937 Landau phase-transition theory","year":1937.5,"era":"Quantum revolution","category":"Matter & emergence","domain":"Equilibrium phase transitions, collective order, symmetry breaking, and critical phenomena","contributors":"Lev Landau; later extended by Ginzburg, mean-field practitioners, Kadanoff, Wilson, Fisher and others","status":"Foundational phenomenological framework; reliable away from strong fluctuation regimes and as the mean-field limit, but not a universal classification of all phases","mainline":false,"claim":"Landau represented a phase by an order parameter and constructed a free-energy expansion constrained by symmetry. A symmetric law can have asymmetric equilibrium minima, making spontaneous symmetry breaking a general mechanism for collective order. The framework predicts qualitative phase structure and mean-field scaling without deriving every microscopic detail. Wilsonian renormalization later corrected its treatment of fluctuations near many critical points, while topological order and other non-Landau phases show that symmetry-breaking order parameters are not universal.","pathways":[{"id":"R-EHRENFEST-DERIVATIVE-ORDER-CLASSIFICATION","label":"EHRENFEST DERIVATIVE ORDER CLASSIFICATION","what":"A thermodynamic classification that labels a transition by the lowest derivative of free energy that is discontinuous, such as latent heat for a first-order transition or a discontinuity in heat capacity for a second-order transition.","period":"1933–1936.","limitation":"It does not identify the new ordered variable, explain symmetry change, or naturally classify transitions with divergences and nonanalytic scaling.","outcome":"Superseded as the main explanatory taxonomy, retained as limited thermodynamic terminology."},{"id":"R-WEISS-MOLECULAR-FIELD-AS-LITERAL-FIELD","label":"WEISS MOLECULAR FIELD AS LITERAL FIELD","what":"A ferromagnetic model in which each magnetic moment experiences an internal “molecular field” proportional to the bulk magnetization, H_{\\mathrm{eff}}=H+\\lambda M, sometimes read as a literal additional local field rather than a mean-field representation of interactions.","period":"1907–1936.","limitation":"The literal field lacked a microscopic basis before exchange theory, and neglected fluctuations give inaccurate critical behavior in many systems.","outcome":"Absorbed as a mean-field realization, not a universal microscopic ontology."},{"id":"R-MICROSCOPIC-MODEL-FOR-EACH-TRANSITION","label":"MICROSCOPIC MODEL FOR EACH TRANSITION","what":"A research strategy requiring a detailed atomistic model and separate solution for every material before any phase-transition law or classification can be asserted.","period":"1900s–1936.","limitation":"Very different systems display similar phase diagrams and scaling forms, while exact many-body solutions are rare.","outcome":"Rejected as a prerequisite for all progress; retained as the route to coefficients, mechanisms, and exceptions."}],"assets":[{"id":"A-FREE-ENERGY","label":"equilibrium minimizes an appropriate thermodynamic potential","detail":"equilibrium minimizes an appropriate thermodynamic potential."},{"id":"A-SYMMETRY-GROUP","label":"high-temperature phases possess transformation invariances","detail":"high-temperature phases possess transformation invariances."},{"id":"A-MAGNETIZATION","label":"a collective variable distinguishing magnetic order","detail":"a collective variable distinguishing magnetic order."},{"id":"A-WEISS-MEAN-FIELD","label":"self-consistent spontaneous order","detail":"self-consistent spontaneous order."},{"id":"A-ISING-MODEL","label":"microscopic example of cooperative ordering","detail":"microscopic example of cooperative ordering."},{"id":"A-ANALYTIC-EXPANSION","label":"local series approximation near a transition","detail":"local series approximation near a transition."}],"timeSlices":[{"id":"TS-THERMODYNAMIC-PHASES","period":"nineteenth century","label":"Classify melting, boiling, magnetism, and critical points macroscopically","detail":"Classify melting, boiling, magnetism, and critical points macroscopically — Singular thermodynamic behavior becomes measurable"},{"id":"TS-MICROSCOPIC-MODELS","period":"1900s–1930s","label":"Ising, Weiss, and lattice models explain selected collective phenomena","detail":"Ising, Weiss, and lattice models explain selected collective phenomena — Cooperative order is tied to many-body interactions"},{"id":"TS-LANDAU","period":"1937","label":"Find a theory applicable across different continuous transitions","detail":"Find a theory applicable across different continuous transitions — Symmetry and an order parameter organize free energy"},{"id":"TS-GINZBURG-LANDAU","period":"1950","label":"Permit spatially varying superconducting order and electromagnetic coupling","detail":"Permit spatially varying superconducting order and electromagnetic coupling — Correlation length, interfaces, and vortices enter"},{"id":"TS-RG-CRITICALITY","period":"1960s–1970s","label":"Mean-field exponents fail near low-dimensional critical points","detail":"Mean-field exponents fail near low-dimensional critical points — Fluctuations and scale flow determine universality"}],"patterns":[{"id":"P-01","detail":"Magnetism, fluids, structural order, and later superconductivity share one symmetry framework"},{"id":"P-02","detail":"Thermodynamic anomalies become generated by minima of an order-parameter free energy"},{"id":"P-03","detail":"“Which microscopic detail causes this transition?” becomes “Which order parameter and symmetry distinguish phases?”"},{"id":"P-04","detail":"Emergent collective variables and asymmetric states of symmetric laws are admitted"},{"id":"P-05","detail":"Weiss self-consistency and thermodynamic derivatives survive inside a broader effective theory"},{"id":"P-06","detail":"Coefficients, response functions, phase boundaries, and critical exponents make the theory testable"}],"explicitEdges":[{"source":"A-FREE-ENERGY","relation":"is-expanded-by","target":"D-LANDAU-ORDER-PARAMETER-1937"},{"source":"A-SYMMETRY-GROUP","relation":"constrains","target":"ALLOWED-LANDAU-TERMS"},{"source":"ORDER-PARAMETER","relation":"distinguishes","target":"PHASES"},{"source":"SYMMETRIC-FREE-ENERGY","relation":"can-have","target":"ASYMMETRIC-MINIMUM"},{"source":"D-LANDAU-ORDER-PARAMETER-1937","relation":"subsumes","target":"R-WEISS-MOLECULAR-FIELD-AS-LITERAL-FIELD"},{"source":"FLUCTUATIONS","relation":"limit","target":"MEAN-FIELD-EXPONENTS"},{"source":"D-LANDAU-ORDER-PARAMETER-1937","relation":"precedes","target":"WILSONIAN-RG"},{"source":"D-LANDAU-ORDER-PARAMETER-1937","relation":"instantiates","target":"P-01"}],"sourceCount":4,"wordCount":2064},{"file":"fundamental_physics_discoveries/30_nuclear_interactions_and_beta_decay.md","id":"D-NUCLEAR-WEAK-1932-1938","title":"Nuclear Interactions and Beta Decay","date":"1932–1938 synthesis","year":1938,"era":"Quantum revolution","category":"Nuclear & particles","domain":"Nuclear binding and weak radioactive decay","contributors":"Heisenberg, Majorana, Wigner, Fermi, Yukawa and many experimentalists","status":"Nuclear force is an emergent low-energy QCD interaction; beta decay is governed by the electroweak interaction","mainline":false,"claim":"The proton–neutron nucleus required a short-range strong binding interaction, while beta decay required a distinct weak process that changes particle identity and emits a neutrino. Early exchange-force and Fermi theories separated two mechanisms previously grouped as “nuclear.”","pathways":[{"id":"R-NUCLEAR-ELECTRONS","label":"NUCLEAR ELECTRONS","what":"The model that beta electrons already exist as bound constituents inside the nucleus and are merely expelled during radioactive decay.","period":"1910s–1932.","limitation":"Cannot account consistently for spin, statistics, and confinement.","outcome":"Beta electrons are created in decay, not pre-stored in nuclei."},{"id":"R-ELECTROMAGNETIC-BINDING-ONLY","label":"ELECTROMAGNETIC BINDING ONLY","what":"The hypothesis that known electric and magnetic forces alone bind protons and other charged constituents into stable nuclei, with no distinct short-range nuclear interaction.","period":"pre-1932.","limitation":"Positively charged protons repel; nuclear range and strength differ.","outcome":"Replaced by strong-interaction models."},{"id":"R-MICROSCOPIC-ENERGY-NONCONSERVATION","label":"MICROSCOPIC ENERGY NONCONSERVATION","what":"The proposal that individual beta decays need not conserve energy, with conservation holding only statistically.","period":"1930.","limitation":"","outcome":"Neutrino kinematics and later detection restored event-by-event conservation."},{"id":"R-ELEMENTARY-YUKAWA-MESON-AS-FUNDAMENTAL-FORCE","label":"ELEMENTARY YUKAWA MESON AS FUNDAMENTAL FORCE","what":"A theory in which one elementary massive meson is the fundamental carrier of the complete nuclear force.","period":"1935.","limitation":"","outcome":"Pion exchange retained at long range; nucleons/pions are composite and QCD is fundamental."}],"assets":[{"id":"A-NEUTRON","label":"proton–neutron composition","detail":"proton–neutron composition."},{"id":"A-CONTINUOUS-BETA-SPECTRUM","label":"apparent missing energy","detail":"apparent missing energy."},{"id":"A-PAULI-NEUTRINO","label":"neutral light particle hypothesis","detail":"neutral light particle hypothesis."},{"id":"A-RANGE-FORCE","label":"binding over femtometer distances","detail":"binding over femtometer distances."}],"timeSlices":[{"id":"TS-NEUTRON","period":"1932","label":"Proton–neutron nucleus established","detail":"Proton–neutron nucleus established — Binding mechanism sought"},{"id":"TS-EXCHANGE","period":"1932–1933","label":"Quantum exchange models proposed","detail":"Quantum exchange models proposed — Nuclear force distinct from electromagnetism"},{"id":"TS-FERMI","period":"1933–1934","label":"Four-fermion beta theory","detail":"Four-fermion beta theory — Neutrino and continuous spectrum explained"},{"id":"TS-YUKAWA","period":"1935","label":"Massive mediator predicts finite range","detail":"Massive mediator predicts finite range — Meson search begins"},{"id":"TS-PION","period":"1947 onward","label":"Pion identified; nuclear force modeled","detail":"Pion identified; nuclear force modeled — Strong interaction deepens"},{"id":"TS-QCD-ELECTROWEAK","period":"1960s onward","label":"Separate gauge theories established","detail":"Separate gauge theories established — Early models become effective limits"}],"patterns":[{"id":"P-01","detail":"Decay spectra, conservation, and new particles unified"},{"id":"P-02","detail":"Mediator mass generates force range"},{"id":"P-03","detail":"Missing energy reframed as undetected-particle energy"},{"id":"P-04","detail":"Particle creation and exchange mechanisms accepted"},{"id":"P-05","detail":"Conservation laws retained by expanding ontology"},{"id":"P-06","detail":"Spectra, lifetimes, and ranges test models"}],"explicitEdges":[{"source":"A-NEUTRON","relation":"enables","target":"PROTON-NEUTRON-NUCLEUS"},{"source":"R-ELECTROMAGNETIC-BINDING-ONLY","relation":"fails-to-bind","target":"PROTON-NEUTRON-NUCLEUS"},{"source":"A-CONTINUOUS-BETA-SPECTRUM","relation":"motivates","target":"A-PAULI-NEUTRINO"},{"source":"A-PAULI-NEUTRINO","relation":"contributes-to","target":"D-FERMI-BETA"},{"source":"D-FERMI-BETA","relation":"explains","target":"CONTINUOUS-BETA-SPECTRUM"},{"source":"FORCE-RANGE","relation":"constrains","target":"YUKAWA-MEDIATOR-MASS"},{"source":"D-ELECTROWEAK","relation":"supersedes-at-high-energy","target":"D-FERMI-BETA"},{"source":"D-NUCLEAR-WEAK-1932-1938","relation":"instantiates","target":"P-05"}],"sourceCount":3,"wordCount":1702},{"file":"fundamental_physics_discoveries/31_nuclear_fission_and_chain_reactions.md","id":"D-FISSION-1938-1942","title":"Nuclear Fission and Chain Reactions","date":"1938 fission; 1942 controlled chain reaction","year":1942.9,"era":"Quantum revolution","category":"Nuclear & particles","domain":"Nuclear transformation and neutron multiplication","contributors":"Otto Hahn, Fritz Strassmann, Lise Meitner, Otto Frisch, Leó Szilárd, Enrico Fermi and many others","status":"Established nuclear process; reactor and weapon applications are downstream, not the focus of this graph","mainline":false,"claim":"Neutron-bombarded heavy nuclei can split into medium-mass fragments, releasing energy and additional neutrons. Meitner and Frisch interpreted the chemical evidence through nuclear deformation and mass–energy conversion; multiplication made a self-sustaining chain reaction physically possible.","pathways":[{"id":"R-SMALL-NUCLEAR-REARRANGEMENT","label":"SMALL NUCLEAR REARRANGEMENT","what":"The interpretation that neutron irradiation of uranium produces only neutron capture and nearby changes in atomic number through beta or alpha decay, not division into two medium-mass nuclei.","period":"1934–1938.","limitation":"","outcome":"Replaced by large-scale nuclear division."},{"id":"R-RADIUM-LIKE-URANIUM-PRODUCT","label":"RADIUM LIKE URANIUM PRODUCT","what":"The interpretation that uranium irradiation produced a heavy radium-like neighbor through modest decay rather than a medium-mass fragment.","period":"1938.","limitation":"","outcome":"Chemical identification of barium rejected it."},{"id":"R-CHAIN-REACTION-IMPOSSIBLE","label":"CHAIN REACTION IMPOSSIBLE","what":"The claim that neutron leakage and non-fission capture always prevent successive fission generations from multiplying.","period":"1939–1942 pre-criticality concern.","limitation":"","outcome":"True for subcritical systems but rejected generally by critical assemblies and Chicago Pile-1."}],"assets":[{"id":"A-NEUTRON","label":"neutral projectile enters heavy nucleus","detail":"neutral projectile enters heavy nucleus."},{"id":"A-RADIOCHEMISTRY","label":"identifies decay products","detail":"identifies decay products."},{"id":"A-LIQUID-DROP","label":"collective nuclear deformation analogy","detail":"collective nuclear deformation analogy."},{"id":"A-MASS-DEFECT","label":"binding energy via E=mc^2","detail":"binding energy via E=mc^2."},{"id":"A-MULTIPLICATION","label":"neutron population dynamics","detail":"neutron population dynamics."}],"timeSlices":[{"id":"TS-NEUTRON-BOMBARDMENT","period":"1934–1938","label":"Heavy elements irradiated","detail":"Heavy elements irradiated — Products misclassified as transuranics"},{"id":"TS-CHEMICAL-BARIUM","period":"Dec. 1938","label":"Hahn and Strassmann identify barium-like product","detail":"Hahn and Strassmann identify barium-like product — Small-change model fails"},{"id":"TS-MEITNER-FRISCH","period":"1938–1939","label":"Nucleus splits; energy estimated","detail":"Nucleus splits; energy estimated — “Fission” named"},{"id":"TS-NEUTRON-MULTIPLICATION","period":"1939","label":"Secondary neutrons measured","detail":"Secondary neutrons measured — Chain reaction inferred"},{"id":"TS-CRITICALITY","period":"1942","label":"Controlled self-sustaining reaction achieved","detail":"Controlled self-sustaining reaction achieved — Reactor physics established"}],"patterns":[{"id":"P-01","detail":"Chemistry, nuclear models, and mass–energy linked"},{"id":"P-02","detail":"Multiplication law generates critical behavior"},{"id":"P-03","detail":"“Which nearby element?” reframed as nuclear splitting"},{"id":"P-04","detail":"Macroscopic nuclear deformation and chain branching accepted"},{"id":"P-05","detail":"Conservation laws and binding energy retained"},{"id":"P-06","detail":"Product identification and neutron counts discriminate models"}],"explicitEdges":[{"source":"A-NEUTRON","relation":"induces","target":"HEAVY-NUCLEUS-REACTION"},{"source":"A-RADIOCHEMISTRY","relation":"identifies","target":"BARIUM-PRODUCT"},{"source":"BARIUM-PRODUCT","relation":"refutes","target":"R-SMALL-NUCLEAR-REARRANGEMENT"},{"source":"A-LIQUID-DROP","relation":"enables","target":"D-FISSION-INTERPRETATION"},{"source":"A-MASS-DEFECT","relation":"explains","target":"FISSION-ENERGY"},{"source":"FISSION","relation":"emits","target":"SECONDARY-NEUTRONS"},{"source":"SECONDARY-NEUTRONS","relation":"enable","target":"CHAIN-REACTION"},{"source":"D-FISSION-1938-1942","relation":"instantiates","target":"P-03"}],"sourceCount":3,"wordCount":1679},{"file":"fundamental_physics_discoveries/32_quantum_electrodynamics.md","id":"D-QED-1940S","title":"Quantum Electrodynamics","date":"1947–1949 renormalized QED","year":1949.9,"era":"Postwar synthesis","category":"Quantum & radiation","domain":"Quantum theory of charged particles and electromagnetic fields","contributors":"Tomonaga, Schwinger, Feynman, Dyson and many precursors and experimentalists","status":"Exceptionally precise quantum field theory; electromagnetic sector of the Standard Model","mainline":true,"claim":"QED combines quantum mechanics, special relativity, and electromagnetic gauge symmetry. Renormalization turns divergent intermediate expressions into finite relations among measured quantities, enabling predictions of unprecedented precision.","pathways":[{"id":"R-UNRENORMALIZED-POINT-PARTICLE-PERTURBATION","label":"UNRENORMALIZED POINT PARTICLE PERTURBATION","what":"A direct perturbative quantum-field calculation using point electrons and photons in which bare masses and charges are inserted without a systematic regulator, counterterm, and renormalization-condition framework.","period":"late 1920s–1940s.","limitation":"Loop integrals diverge without a consistent parameter relation.","outcome":"Replaced by renormalized field theory."},{"id":"R-CLASSICAL-RADIATION-ONLY","label":"CLASSICAL RADIATION ONLY","what":"A hybrid model in which charged matter may be quantized but the electromagnetic field remains a continuous classical wave with no photon creation, annihilation, or vacuum fluctuations.","period":"nineteenth century–1920s.","limitation":"Cannot explain spontaneous emission, vacuum corrections, or discrete scattering.","outcome":"Retained for coherent large-scale fields."},{"id":"R-HOLE-THEORY-QED","label":"HOLE THEORY QED","what":"Early QED built around a physically filled Dirac sea whose holes represent positrons.","period":"1930s.","limitation":"","outcome":"Superseded by Fock-space field operators."},{"id":"R-LITERAL-UV-CUTOFF-ELECTRON-SIZE","label":"LITERAL UV CUTOFF ELECTRON SIZE","what":"The attempt to cure divergences by imposing an arbitrary maximum momentum interpreted as a literal unresolved electron size.","period":"1930s–1940s.","limitation":"","outcome":"Regulator dependence remains without renormalization; cutoffs retained in effective theories."},{"id":"R-AD-HOC-INFINITY-SUBTRACTION","label":"AD HOC INFINITY SUBTRACTION","what":"Removing each divergent expression independently without a finite parameter set, symmetry constraints, and common renormalization conditions.","period":"1930s–1947.","limitation":"","outcome":"Superseded by systematic renormalization."}],"assets":[{"id":"A-DIRAC-FIELD","label":"relativistic electron/positron","detail":"relativistic electron/positron."},{"id":"A-MAXWELL-GAUGE","label":"electromagnetic field symmetry","detail":"electromagnetic field symmetry."},{"id":"A-PERTURBATION","label":"expansion in small coupling","detail":"expansion in small coupling."},{"id":"A-LAMB-SHIFT","label":"precision spectral anomaly","detail":"precision spectral anomaly."},{"id":"A-G-2","label":"magnetic-moment correction","detail":"magnetic-moment correction."}],"timeSlices":[{"id":"TS-EARLY-QED","period":"1927–1930s","label":"Quantized radiation and Dirac electrons","detail":"Quantized radiation and Dirac electrons — Infinities and self-energy appear"},{"id":"TS-EXPERIMENTAL-ANOMALIES","period":"1940s","label":"Lamb shift and electron magnetic moment measured","detail":"Lamb shift and electron magnetic moment measured — Corrections demand consistent theory"},{"id":"TS-RENORMALIZED-QED","period":"1940s","label":"Covariant and canonical methods developed","detail":"Covariant and canonical methods developed — Finite observable predictions"},{"id":"TS-DYSON","period":"1949","label":"Formulations shown equivalent","detail":"Formulations shown equivalent — Diagrammatic perturbation organized"},{"id":"TS-GAUGE-THEORY","period":"1950s onward","label":"QED becomes prototype","detail":"QED becomes prototype — Standard Model gauge theories follow"}],"patterns":[{"id":"P-01","detail":"Relativity, quantum particles, and fields unified"},{"id":"P-02","detail":"Gauge Lagrangian generates interaction amplitudes"},{"id":"P-03","detail":"Divergences reframed through scale-dependent parameters"},{"id":"P-04","detail":"Quantum fields and vacuum corrections accepted"},{"id":"P-05","detail":"Dirac and Maxwell theories retained as limits"},{"id":"P-06","detail":"Precision spectroscopy and g-2 dominate validation"}],"explicitEdges":[{"source":"A-DIRAC-FIELD","relation":"contributes-to","target":"D-QED-1940S"},{"source":"A-MAXWELL-GAUGE","relation":"contributes-to","target":"D-QED-1940S"},{"source":"A-LAMB-SHIFT","relation":"challenges","target":"EARLY-QED"},{"source":"RENORMALIZATION","relation":"repairs","target":"EARLY-QED"},{"source":"QED-LAGRANGIAN","relation":"generates","target":"SCATTERING-AMPLITUDES"},{"source":"QED-LOOPS","relation":"explain","target":"A-G-2"},{"source":"D-QED-1940S","relation":"prototype-for","target":"STANDARD-MODEL-GAUGE-THEORY"},{"source":"D-QED-1940S","relation":"instantiates","target":"P-06"}],"sourceCount":4,"wordCount":1935},{"file":"fundamental_physics_discoveries/50_yang_mills_gauge_theory.md","id":"D-YANG-MILLS-1954","title":"Yang–Mills Non-Abelian Gauge Theory","date":"October 1954 publication","year":1954.75,"era":"Postwar synthesis","category":"Nuclear & particles","domain":"Non-Abelian gauge fields, particle interactions, geometry, and the foundations of the Standard Model","contributors":"Chen Ning Yang and Robert Mills; with important antecedents from Weyl, Pauli, Klein and the theory of isospin","status":"Foundational gauge-theory architecture; experimentally successful through electroweak theory and QCD, while pure Yang–Mills mass-gap existence remains mathematically unresolved","mainline":true,"claim":"Yang and Mills generalized local gauge invariance from commuting U(1) phase transformations to a non-Abelian internal symmetry. Making the orientation of isospin independently selectable at each spacetime point requires a multiplet of connection fields. Because the group generators do not commute, the gauge fields interact with themselves. The 1954 model did not correctly identify the observed nuclear force and initially faced a mass problem, but its mathematical mechanism became the core architecture of electroweak theory and quantum chromodynamics.","pathways":[{"id":"R-GLOBAL-ISOSPIN-ONLY","label":"GLOBAL ISOSPIN ONLY","what":"A model in which proton and neutron form an internal doublet that can be rotated by the same SU(2) transformation everywhere, but the rotation cannot vary independently from point to point and no compensating gauge connection is introduced.","period":"1932–1953.","limitation":"It classifies states but does not generate a force field from the symmetry principle.","outcome":"Retained as an approximate global symmetry and as the constant-transformation subgroup of the gauge theory."},{"id":"R-ABELIAN-GAUGE-COPY","label":"ABELIAN GAUGE COPY","what":"The attempt to generalize electromagnetism by assigning several independent commuting U(1)-like vector fields to internal charges, without matrix-valued connections or gauge-boson self-coupling.","period":"1929–1953.","limitation":"Commuting fields do not implement a genuinely rotating non-Abelian internal basis and miss the nonlinear term demanded by noncommuting generators.","outcome":"Retained for Abelian sectors, superseded as a model of non-Abelian internal symmetry."},{"id":"R-YUKAWA-MESON-FUNDAMENTAL-FORCE","label":"YUKAWA MESON FUNDAMENTAL FORCE","what":"A theory in which the fundamental nuclear force is produced by exchange of a massive scalar or pseudoscalar meson with potential V(r)\\propto-e^{-mr}/r, rather than by a locally gauged internal symmetry.","period":"1935–1953.","limitation":"A simple elementary-meson theory did not organize the growing hadron spectrum or the short-distance dynamics later attributed to quarks and gluons.","outcome":"Superseded as the fundamental strong theory; retained as low-energy nuclear effective physics."},{"id":"R-MASSIVE-NONABELIAN-VECTOR-BY-HAND","label":"MASSIVE NONABELIAN VECTOR BY HAND","what":"A prospective non-Abelian vector theory in which a Proca mass term \\tfrac12m^2A_\\mu^aA^{a\\mu} is inserted directly so the force has finite range, without a compensating scalar mechanism or hidden gauge-invariant formulation.","period":"1936–1953 antecedent vector-meson reasoning.","limitation":"The mass term is not invariant under the local non-Abelian transformation and spoils the gauge constraints needed for a well-behaved interacting theory.","outcome":"Direct fundamental mass insertion is superseded in the Standard Model; massive vector effective theories remain useful below a cutoff."}],"assets":[{"id":"A-U1-GAUGE","label":"electromagnetic phase gauge invariance and the vector potential","detail":"electromagnetic phase gauge invariance and the vector potential."},{"id":"A-ISOSPIN","label":"proton–neutron internal doublet and approximate strong symmetry","detail":"proton–neutron internal doublet and approximate strong symmetry."},{"id":"A-LIE-ALGEBRA","label":"noncommuting generators and structure constants","detail":"noncommuting generators and structure constants."},{"id":"A-NOETHER","label":"symmetry currents and local-symmetry identities","detail":"symmetry currents and local-symmetry identities."},{"id":"A-CONNECTION-GEOMETRY","label":"parallel comparison of internal states at neighboring points","detail":"parallel comparison of internal states at neighboring points."},{"id":"A-QUANTUM-FIELD-THEORY","label":"operator fields and interaction amplitudes","detail":"operator fields and interaction amplitudes."}],"timeSlices":[{"id":"TS-U1-GAUGE","period":"1918–1929","label":"Connect phase invariance with electromagnetism","detail":"Connect phase invariance with electromagnetism — Weyl's revised phase gauge principle yields an Abelian connection"},{"id":"TS-ISOSPIN","period":"1932–1950s","label":"Proton and neutron behave as two states under strong interactions","detail":"Proton and neutron behave as two states under strong interactions — Internal SU(2)-like rotations organize nuclear symmetry"},{"id":"TS-YANG-MILLS","period":"1953–1954","label":"Make internal orientation locally variable","detail":"Make internal orientation locally variable — Non-Abelian connection and curvature are constructed"},{"id":"TS-MASS-OBJECTION","period":"1954–1960s","label":"Gauge invariance implies massless vector fields, apparently absent for nuclear forces","detail":"Gauge invariance implies massless vector fields, apparently absent for nuclear forces — Theory remains formal architecture awaiting new mechanisms"},{"id":"TS-STANDARD-MODEL","period":"1960s–1970s","label":"Combine gauge symmetry, mass generation, and renormalizability","detail":"Combine gauge symmetry, mass generation, and renormalizability — Electroweak and color gauge theories validate the framework"}],"patterns":[{"id":"P-01","detail":"Internal symmetry, geometry, and force fields are unified"},{"id":"P-02","detail":"Isospin regularities become a local mechanism generating interaction terms"},{"id":"P-03","detail":"“Which force law fits?” becomes “Which local symmetry and representation require the connection?”"},{"id":"P-04","detail":"Matrix-valued self-interacting gauge fields are accepted"},{"id":"P-05","detail":"Maxwell gauge theory and global isospin survive as limits or substructures"},{"id":"P-06","detail":"A compact Lagrangian fixes vertices, identities, running, and scattering predictions"}],"explicitEdges":[{"source":"A-U1-GAUGE","relation":"inspires","target":"D-YANG-MILLS-1954"},{"source":"A-ISOSPIN","relation":"is-localized-by","target":"D-YANG-MILLS-1954"},{"source":"NONCOMMUTING-GENERATORS","relation":"require","target":"NONLINEAR-FIELD-STRENGTH"},{"source":"D-YANG-MILLS-1954","relation":"generates","target":"GAUGE-BOSON-SELF-INTERACTION"},{"source":"D-YANG-MILLS-1954","relation":"underlies","target":"ELECTROWEAK-THEORY"},{"source":"D-YANG-MILLS-1954","relation":"underlies","target":"QCD"},{"source":"HIGGS-MECHANISM","relation":"repairs-mass-problem-of","target":"MASSLESS-ELECTROWEAK-YANG-MILLS"},{"source":"D-YANG-MILLS-1954","relation":"instantiates","target":"P-01"}],"sourceCount":4,"wordCount":2243},{"file":"fundamental_physics_discoveries/33_parity_violation.md","id":"D-PARITY-VIOLATION-1956-1957","title":"Parity Violation","date":"1956 proposal; January 1957 experimental report","year":1957.08,"era":"Postwar synthesis","category":"Nuclear & particles","domain":"Weak interaction and discrete symmetries","contributors":"Tsung-Dao Lee, Chen-Ning Yang, Chien-Shiung Wu and collaborators; complementary pion–muon experiments","status":"Weak interactions maximally violate parity in charged currents; CP is also violated, while CPT remains foundational in local relativistic QFT","mainline":false,"claim":"Lee and Yang recognized that parity conservation had not been adequately tested in weak interactions. Wu's polarized cobalt-60 experiment found electrons emitted preferentially opposite the nuclear spin, demonstrating that mirror-reflected weak processes are not equivalent.","pathways":[{"id":"R-UNIVERSAL-PARITY","label":"UNIVERSAL PARITY","what":"The symmetry hypothesis that every fundamental interaction assigns identical probabilities to a process and its spatially mirror-reflected process.","period":"nineteenth century–1956.","limitation":"It was assumed rather than tested in weak decay.","outcome":"Rejected for weak interactions."},{"id":"R-THETA-TAU-DISTINCT-PARTICLES","label":"THETA TAU DISTINCT PARTICLES","what":"The hypothesis that the two- and three-pion decay modes came from different parent particles with opposite parity despite matching mass and lifetime.","period":"1953–1956.","limitation":"","outcome":"Replaced by one kaon species with parity-violating weak decays."},{"id":"R-WU-DETECTOR-ASYMMETRY","label":"WU DETECTOR ASYMMETRY","what":"The null explanation that the cobalt electron imbalance was caused by detector geometry or apparatus bias.","period":"late 1956–January 1957 pre-acceptance null hypothesis.","limitation":"","outcome":"Polarization reversal, warming controls, and independent experiments reject it."}],"assets":[{"id":"A-POLARIZED-CO60","label":"oriented nuclear spin","detail":"oriented nuclear spin."},{"id":"A-LOW-TEMPERATURE","label":"maintains polarization","detail":"maintains polarization."},{"id":"A-BETA-DETECTOR","label":"measures angular emission","detail":"measures angular emission."},{"id":"A-PARITY-OPERATOR","label":"maps \\mathbf{x}\\to-\\mathbf{x}","detail":"maps \\mathbf{x}\\to-\\mathbf{x}."},{"id":"A-SYMMETRY-AUDIT","label":"distinguishes tested from assumed invariance","detail":"distinguishes tested from assumed invariance."}],"timeSlices":[{"id":"TS-PARITY-ASSUMED","period":"Pre-1956","label":"Left–right symmetry treated as universal","detail":"Left–right symmetry treated as universal — Strong and electromagnetic evidence generalized"},{"id":"TS-THETA-TAU","period":"Early 1950s","label":"Same-mass particles appear to decay to states of opposite parity","detail":"Same-mass particles appear to decay to states of opposite parity — Puzzle intensifies"},{"id":"TS-LEE-YANG","period":"1956","label":"Review finds weak parity untested","detail":"Review finds weak parity untested — Experiments proposed"},{"id":"TS-WU","period":"1956–1957","label":"Polarized cobalt beta decay measured","detail":"Polarized cobalt beta decay measured — Asymmetry observed"},{"id":"TS-V-A","period":"1957 onward","label":"Chiral weak interaction formulated","detail":"Chiral weak interaction formulated — Left-handed structure established"}],"patterns":[{"id":"P-01","detail":"Nuclear decay and spatial symmetry linked"},{"id":"P-02","detail":"Symmetry transformation generates a null prediction"},{"id":"P-03","detail":"“Puzzle of two particles” reframed as an untested symmetry"},{"id":"P-04","detail":"Fundamental left–right asymmetry accepted"},{"id":"P-05","detail":"Parity retained in strong and electromagnetic sectors"},{"id":"P-06","detail":"Reversal-controlled angular asymmetry provided decisive test"}],"explicitEdges":[{"source":"THETA-TAU-PUZZLE","relation":"motivates","target":"A-SYMMETRY-AUDIT"},{"source":"A-SYMMETRY-AUDIT","relation":"reveals-untested","target":"R-UNIVERSAL-PARITY"},{"source":"D-LEE-YANG","relation":"proposes-test","target":"A-POLARIZED-CO60"},{"source":"A-POLARIZED-CO60","relation":"enables","target":"D-WU-EXPERIMENT"},{"source":"D-WU-EXPERIMENT","relation":"refutes","target":"R-UNIVERSAL-PARITY"},{"source":"D-PARITY-VIOLATION-1956-1957","relation":"contributes-to","target":"V-A-THEORY"},{"source":"V-A-THEORY","relation":"contributes-to","target":"D-ELECTROWEAK"},{"source":"D-PARITY-VIOLATION-1956-1957","relation":"instantiates","target":"P-06"}],"sourceCount":3,"wordCount":1833},{"file":"fundamental_physics_discoveries/51_bcs_theory_of_superconductivity.md","id":"D-BCS-1957","title":"BCS Theory of Superconductivity","date":"December 1957 full BCS theory","year":1957.9,"era":"Postwar synthesis","category":"Matter & emergence","domain":"Quantum many-body physics, superconductivity, emergent quasiparticles, and broken-symmetry phases","contributors":"John Bardeen, Leon Cooper and J. Robert Schrieffer; with crucial antecedents from Onnes, Meissner, London, Ginzburg, Landau, Fröhlich, Maxwell, Reynolds and many experimentalists","status":"Microscopic foundation for conventional superconductors and a broad pairing framework; the pairing glue and state symmetry in unconventional superconductors can differ from the original phonon-mediated model","mainline":false,"claim":"BCS theory explains conventional superconductivity as a collective quantum state of overlapping Cooper pairs formed by an effective attraction near the Fermi surface. An arbitrarily weak attraction destabilizes the normal Fermi sea under ideal conditions, producing a coherent paired ground state, an excitation gap, flux-related phase rigidity, and characteristic thermodynamic behavior. Its fundamental contribution is not merely a material application: it established a reusable mechanism of emergence in which interactions reorganize a macroscopic number of fermions into new quasiparticles and an ordered phase.","pathways":[{"id":"R-PERFECT-CONDUCTOR-ONLY","label":"PERFECT CONDUCTOR ONLY","what":"The view that a superconductor is simply an ordinary conductor with resistivity exactly equal to zero, so magnetic flux present before cooling should remain frozen according to ideal classical conductivity.","period":"1911–1933.","limitation":"The Meissner effect shows that equilibrium superconductors expel magnetic field on entering the phase, which is stronger than infinite conductivity.","outcome":"Superseded as a complete definition; zero resistance remains a central consequence."},{"id":"R-CLASSICAL-ELECTRON-ORDERING","label":"CLASSICAL ELECTRON ORDERING","what":"A family of proposals in which electrons form a classical ordered arrangement, current filament, rigid lattice, or other essentially single-particle configuration that suppresses collisions without a coherent fermionic pair state.","period":"1911–1940s.","limitation":"It did not quantitatively explain the energy gap, isotope effect, heat-capacity jump, coherence factors, or Meissner response.","outcome":"Rejected as a microscopic account."},{"id":"R-LONDON-PHENOMENOLOGY-AS-MICROSCOPIC-THEORY","label":"LONDON PHENOMENOLOGY AS MICROSCOPIC THEORY","what":"The London equations relate supercurrent and electromagnetic fields through a penetration depth, successfully encoding perfect diamagnetism but without specifying the microscopic many-electron state that produces the stiffness.","period":"1935–1956.","limitation":"The equations do not derive the gap, T_c, isotope effect, quasiparticles, or temperature dependence from electron interactions.","outcome":"Retained as an e
