:root {

* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
}
button, input, select { font: inherit; color: inherit; }
button, select, input {
  border: 1px solid var(--border);
  background: var(--panel-solid);
  border-radius: 10px;
}
button { cursor: pointer; padding: 9px 12px; }
button:hover { background: var(--accent-soft); }
button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible {

.app { width: 100%; height: 100%; position: relative; }
.topbar {

  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 14px;
  background: linear-gradient(to bottom, var(--panel-solid), color-mix(in srgb, var(--panel-solid), transparent 12%));
  border-bottom: 1px solid var(--border);
}
.brand { min-width: 260px; margin-right: auto; }
.brand h1 { font-size: 17px; line-height: 1.2; margin: 0 0 3px; font-weight: 650; }
.brand p { font-size: 12px; color: var(--muted); margin: 0; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.search { width: min(280px, 34vw); padding: 9px 11px; }
select { padding: 9px 30px 9px 10px; }
.icon-button { min-width: 40px; padding: 9px; }
.toggle { display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px; white-space: nowrap; }
.toggle input { accent-color: var(--accent); }
.stage { position: absolute; inset: 66px 0 0; overflow: hidden; }
#graph { width: 100%; height: 100%; display: block; touch-action: none; }
.legend, .hint, .details {
  position: absolute; z-index: 4; background: var(--panel);
  border: 1px solid var(--border); box-shadow: var(--shadow); backdrop-filter: blur(12px);
}
.legend { left: 14px; bottom: 14px; border-radius: 14px; padding: 11px 13px; max-width: min(620px, calc(100% - 28px)); }
.legend-title { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 7px; }
.legend-items { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12px; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.swatch { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.swatch.mainline { width: 15px; height: 15px; background: transparent; border: 3px solid var(--mainline-outline); }
.hint { left: 14px; top: 14px; border-radius: 10px; padding: 7px 10px; font-size: 12px; color: var(--muted); }
.details {
  right: 14px; top: 14px; width: min(370px, calc(100% - 28px)); max-height: calc(100% - 28px);
  border-radius: 16px; overflow: auto; padding: 16px;
  transform: translateX(calc(100% + 30px)); transition: transform .2s ease;
}
.details.open { transform: translateX(0); }
.details-close { float: right; padding: 5px 8px; margin-left: 8px; }
.eyebrow { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 7px; }
.details h2 { font-size: 19px; line-height: 1.25; margin: 0 0 8px; }
.meta { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
.details p { font-size: 13px; line-height: 1.55; margin: 10px 0; }
.detail-section { border-top: 1px solid var(--border); padding-top: 11px; margin-top: 11px; }
.detail-section h3 { font-size: 12px; margin: 0 0 7px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--border); border-radius: 999px; padding: 4px 7px; font-size: 11px; }
.source-link { display: inline-block; text-decoration: none; color: var(--accent); font-size: 13px; margin-top: 7px; }
.empty { color: var(--muted); }
.stats { font-variant-numeric: tabular-nums; }
.mobile-details-button { display: none; }
@media (max-width: 920px) {
  .topbar { align-items: flex-start; }
  .brand { min-width: 100%; }
  .stage { top: 112px; }
  .controls { width: 100%; }
  .search { flex: 1; width: 120px; }
  .legend { max-width: calc(100% - 28px); }
}
@media (max-width: 620px) {
  .topbar { padding: 8px; gap: 6px; }
  .brand { display: none; }
  .stage { top: 152px; }
  .controls { gap: 6px; }
  .search { min-width: calc(100% - 96px); }
  select { max-width: calc(50% - 4px); flex: 1; }
  .toggle span { display: none; }
  .legend { display: none; }
  .details { right: 8px; top: 8px; max-height: calc(100% - 16px); }
}
</style>

limitation":"","outcome":"Ellipses superseded circles as physical orbital paths."},{"id":"R-KEPLER-POLYHEDRAL","label":"KEPLER POLYHEDRAL","what":"Kepler's early spacing model in which the six known planetary spheres are separated by the five nested Platonic solids, making geometry determine the number and relative sizes of planetary orbits.","period":"1596 (Mysterium Cosmographicum).","limitation":"Improved observations did not support the proposed spacing scheme.","outcome":"Abandoned as quantitative astronomy."},{"id":"R-KEPLER-OVAL-INTERMEDIATE","label":"KEPLER OVAL INTERMEDIATE","what":"Kepler's provisional noncircular “oval” construction for Mars, introduced while he searched for a path that matched Tycho's observations better than compound circles.","period":"c. 1601–1605.","limitation":"It improved the conceptual search but did not reproduce the complete longitude–distance relation as accurately as an ellipse.","outcome":"Abandoned as an orbital law; retained as a documented intermediate model in the discovery process."}],"assets":[{"id":"A-COPERNICAN-ORDER","label":"Sun-centered planetary ordering","detail":"Sun-centered planetary ordering."},{"id":"A-TYCHO-MARS","label":"precise observations of Mars","detail":"precise observations of Mars."},{"id":"A-CONIC-GEOMETRY","label":"ellipse properties and geometrical methods","detail":"ellipse properties and geometrical methods."},{"id":"A-PHYSICAL-ASTRONOMY","label":"willingness to seek a causal solar role","detail":"willingness to seek a causal solar role."},{"id":"A-ERROR-TRUST","label":"treating small residuals as evidence against a model","detail":"treating small residuals as evidence against a model."}],"timeSlices":[{"id":"TS-CIRCULAR-ASTRONOMY","period":"Antiquity–16th century","label":"Compound uniform circles dominated mathematical astronomy","detail":"Compound uniform circles dominated mathematical astronomy — Persistent residuals, especially for Mars"},{"id":"TS-TYCHO-DATA","period":"Late 16th century","label":"High-precision naked-eye observations accumulated","detail":"High-precision naked-eye observations accumulated — Models faced tighter empirical constraints"},{"id":"TS-MARS-PROBLEM","period":"c. 1600–1609","label":"Circular constructions missed Mars by about eight arcminutes","detail":"Circular constructions missed Mars by about eight arcminutes — Kepler treated the discrepancy as theory-relevant"},{"id":"TS-FIRST-SECOND-LAWS","period":"1609","label":"Ellipse and area law published","detail":"Ellipse and area law published — Nonuniform orbital speed quantified"},{"id":"TS-THIRD-LAW","period":"1619","label":"Planetary periods linked across the system","detail":"Planetary periods linked across the system — One scaling relation spans different planets"},{"id":"TS-NEWTON","period":"1687 onward","label":"Force laws generate orbital regularities","detail":"Force laws generate orbital regularities — Keplerian laws embedded in dynamics"}],"patterns":[{"id":"P-01","detail":"All known planets linked by a common period–size relation"},{"id":"P-02","detail":"Observational patterns became constraints later generated by dynamics"},{"id":"P-03","detail":"“Which circles fit?” reframed as “Which path does the data require?”"},{"id":"P-04","detail":"Elliptical, nonuniform celestial motion accepted"},{"id":"P-05","detail":"Copernican ordering and precision observations retained"},{"id":"P-06","detail":"Eight-arcminute residual treated as decisive evidence"}],"explicitEdges":[{"source":"A-COPERNICAN-ORDER","relation":"contributes-to","target":"D-KEPLER-LAWS-1609-1619"},{"source":"A-TYCHO-MARS","relation":"tests","target":"R-PERFECT-CIRCLES"},{"source":"R-PERFECT-CIRCLES","relation":"superseded-by","target":"L-KEPLER-1"},{"source":"R-KEPLER-POLYHEDRAL","relation":"superseded-by","target":"L-KEPLER-3"},{"source":"L-KEPLER-1","relation":"part-of","target":"D-KEPLER-LAWS-1609-1619"},{"source":"L-KEPLER-2","relation":"part-of","target":"D-KEPLER-LAWS-1609-1619"},{"source":"L-KEPLER-3","relation":"part-of","target":"D-KEPLER-LAWS-1609-1619"},{"source":"D-NEWTONIAN-GRAVITY","relation":"generates","target":"L-KEPLER-1"},{"source":"D-NEWTONIAN-GRAVITY","relation":"generates","target":"L-KEPLER-2"},{"source":"D-NEWTONIAN-GRAVITY","relation":"generates","target":"L-KEPLER-3"},{"source":"LIMIT-MANY-BODY","relation":"limits","target":"D-KEPLER-LAWS-1609-1619"},{"source":"D-KEPLER-LAWS-1609-1619","relation":"instantiates","target":"P-02"},{"source":"D-KEPLER-LAWS-1609-1619","relation":"instantiates","target":"P-06"}],"sourceCount":4,"wordCount":1895},{"file":"fundamental_physics_discoveries/05_galilean_kinematics.md","id":"D-GALILEAN-KINEMATICS-1604-1638","title":"Galilean Kinematics","date":"1638 synthesis in Two New Sciences (work developed from c. 1604)","year":1638,"era":"Scientific revolution","category":"Mechanics & astronomy","domain":"Free fall, inclined planes, projectiles, and inertia-related motion","contributors":"Galileo Galilei, working within and transforming medieval and Renaissance traditions of motion","status":"Correct classical kinematics under stated idealizations; incorporated and generalized by Newtonian mechanics","mainline":false,"claim":"Galileo made terrestrial motion mathematically analyzable by treating acceleration, instantaneous speed, and idealized composition of motions as measurable structures. He did not simply perform a single “tower experiment,” and his inertia concept should not be equated without qualification to Newton's rectilinear first law.","pathways":[{"id":"R-SPEED-PROPORTIONAL-WEIGHT","label":"SPEED PROPORTIONAL WEIGHT","what":"An Aristotelian fall law according to which a body's downward speed in a given medium increases in direct proportion to its weight and decreases with the medium's resistance.","period":"fourth century BCE and later Aristotelian tradition.","limitation":"It confounds gravitational acceleration with resistance.","outcome":"Replaced by mass-independent free-fall acceleration in the ideal limit."},{"id":"R-PROJECTILE-TWO-STAGES","label":"PROJECTILE TWO STAGES","what":"A projectile model that divides motion into an initially forced or “violent” forward phase and a later “natural” downward fall, rather than treating both components as simultaneous.","period":"sixth–fourteenth centuries CE.","limitation":"It predicts a sharp transition rather than continuous curvature.","outcome":"Replaced by simultaneous horizontal and vertical components."},{"id":"R-ARISTOTELIAN-NATURAL-VIOLENT-MOTION","label":"ARISTOTELIAN NATURAL VIOLENT MOTION","what":"Aristotle's classification in which natural motion carries elements toward their natural places, while violent motion is imposed externally and normally ceases when the mover no longer acts.","period":"fourth century BCE.","limitation":"","outcome":"Superseded by inertia, force analysis, and medium resistance; the distinction between forced response and free evolution was transformed rather than simply erased."}],"assets":[{"id":"A-IMPETUS","label":"persistence after loss of contact","detail":"persistence after loss of contact."},{"id":"A-INCLINED-PLANE","label":"slower, measurable analogue of free fall","detail":"slower, measurable analogue of free fall."},{"id":"A-PENDULUM","label":"recurring motion and time comparison","detail":"recurring motion and time comparison."},{"id":"A-GEOMETRY","label":"ratios, parabolas, and proof","detail":"ratios, parabolas, and proof."},{"id":"A-IDEALIZATION","label":"frictionless planes and resistance-free motion as controlled abstractions","detail":"frictionless planes and resistance-free motion as controlled abstractions."}],"timeSlices":[{"id":"TS-ARISTOTELIAN","period":"Antiquity–16th century","label":"Speed linked qualitatively to weight, motive power, and resistance","detail":"Speed linked qualitatively to weight, motive power, and resistance — Projectile continuation remained problematic"},{"id":"TS-IMPETUS","period":"Medieval period","label":"Impressed impetus carries motion after release","detail":"Impressed impetus carries motion after release — Persistence located partly in the body"},{"id":"TS-GALILEO-EARLY","period":"c. 1590–1609","label":"Inclined planes, pendulums, fall, and projectiles studied","detail":"Inclined planes, pendulums, fall, and projectiles studied — Time and acceleration quantified"},{"id":"TS-PUBLICATION","period":"1638","label":"Mathematical demonstrations published","detail":"Mathematical demonstrations published — Terrestrial motion becomes a “new science”"},{"id":"TS-NEWTONIAN","period":"1687 onward","label":"Force laws generalize kinematics into dynamics","detail":"Force laws generalize kinematics into dynamics — Ideal Galileo results derived under constant force"}],"patterns":[{"id":"P-01","detail":"Fall, incline, and projectile motion linked by common kinematics"},{"id":"P-02","detail":"Distance–time regularities became generative equations"},{"id":"P-03","detail":"“What nature seeks” replaced by “How position changes with time”"},{"id":"P-04","detail":"Ideal frictionless motion accepted as explanatory"},{"id":"P-05","detail":"Impetus-like persistence retained without its ontology"},{"id":"P-06","detail":"Ratios and trajectories made motion quantitatively testable"}],"explicitEdges":[{"source":"A-INCLINED-PLANE","relation":"enables-measurement-of","target":"D-GALILEAN-KINEMATICS-1604-1638"},{"source":"A-IDEALIZATION","relation":"enables","target":"LAW-FREE-FALL"},{"source":"R-SPEED-PROPORTIONAL-WEIGHT","relation":"superseded-by","target":"LAW-FREE-FALL"},{"source":"R-PROJECTILE-TWO-STAGES","relation":"superseded-by","target":"LAW-COMPOSITION"},{"source":"LAW-COMPOSITION","relation":"generates","target":"EQ-PARABOLA"},{"source":"D-GALILEAN-KINEMATICS-1604-1638","relation":"contributes-to","target":"D-NEWTONIAN-MECHANICS"},{"source":"D-GALILEAN-KINEMATICS-1604-1638","relation":"instantiates","target":"P-03"},{"source":"D-GALILEAN-KINEMATICS-1604-1638","relation":"instantiates","target":"P-06"}],"sourceCount":4,"wordCount":1991},{"file":"fundamental_physics_discoveries/06_atmospheric_pressure_and_vacuum.md","id":"D-PRESSURE-VACUUM-1640-1660","title":"Atmospheric Pressure and the Physical Vacuum","date":"1643–1648 (Torricelli through Pascal)","year":1648,"era":"Scientific revolution","category":"Matter & emergence","domain":"Pneumatics, pressure, gases, and vacuum","contributors":"Evangelista Torricelli, Blaise Pascal, Otto von Guericke, Robert Boyle and collaborators","status":"Atmospheric pressure and producible low-pressure regions are established; perfect vacuum is an ideal limit","mainline":false,"claim":"Barometers, altitude experiments, pumps, and gas compression established that air has weight and exerts pressure, and that spaces can be produced with far less matter than ambient air. This displaced explanations in which suction or “horror of the vacuum” acted as independent causes.","pathways":[{"id":"R-HORROR-VACUI","label":"HORROR VACUI","what":"A qualitative causal principle asserting that nature prevents empty space, so surrounding matter moves into any region that would otherwise become a vacuum.","period":"antiquity through the early seventeenth century.","limitation":"It does not predict the finite height of water or mercury columns or altitude dependence.","outcome":"Replaced by pressure differences."},{"id":"R-SUCTION-AS-PULL","label":"SUCTION AS PULL","what":"A pump model in which “suction” is treated as a positive pulling force exerted by a low-pressure region on a liquid, rather than as motion caused by greater pressure elsewhere.","period":"ancient practical tradition through the early seventeenth century.","limitation":"It obscures that ambient pressure pushes fluid into a lower-pressure region.","outcome":"Retained only as convenient language."},{"id":"R-VAPOR-SUPPORTS-BAROMETER","label":"VAPOR SUPPORTS BAROMETER","what":"The hypothesis that vapor or another material effluvium in the Torricellian space exerts the agency that holds the mercury column up, rather than external atmospheric pressure.","period":"1644–1647 barometer debate.","limitation":"","outcome":"Vapor pressure is real but cannot explain the principal column height and its altitude dependence; atmospheric pressure is the dominant cause."}],"assets":[{"id":"A-PUMP-LIMIT","label":"water pumps fail above a finite lift","detail":"water pumps fail above a finite lift."},{"id":"A-MERCURY","label":"dense liquid permits a compact column","detail":"dense liquid permits a compact column."},{"id":"A-ALTITUDE","label":"mountain elevation changes the overlying air column","detail":"mountain elevation changes the overlying air column."},{"id":"A-AIR-PUMP","label":"controlled removal and compression of gas","detail":"controlled removal and compression of gas."},{"id":"A-MECHANICAL-BALANCE","label":"pressure compared with liquid weight","detail":"pressure compared with liquid weight."}],"timeSlices":[{"id":"TS-PLENUM","period":"Antiquity–early modern","label":"“Nature abhors a vacuum”; pump limits explained qualitatively","detail":"“Nature abhors a vacuum”; pump limits explained qualitatively — No independent pressure variable"},{"id":"TS-TORRICELLI","period":"1643–1644","label":"Mercury column leaves space above it","detail":"Mercury column leaves space above it — Column height interpreted through atmospheric weight"},{"id":"TS-PASCAL","period":"1648","label":"Barometer carried to different altitude","detail":"Barometer carried to different altitude — Pressure shown to decrease with elevation"},{"id":"TS-GUERICKE","period":"1650s","label":"Mechanical pumps evacuate vessels","detail":"Mechanical pumps evacuate vessels — External atmosphere produces large forces"},{"id":"TS-BOYLE","period":"1660s","label":"Gas compression measured","detail":"Gas compression measured — Pressure–volume regularity quantified"},{"id":"TS-KINETIC","period":"19th century onward","label":"Pressure linked to molecular impacts","detail":"Pressure linked to molecular impacts — Macroscopic law gains microscopic explanation"}],"patterns":[{"id":"P-01","detail":"Pumps, barometers, weather, and altitude unified by pressure"},{"id":"P-02","detail":"Column height generated by pressure balance"},{"id":"P-03","detail":"“What pulls the liquid?” reframed as “What pushes it?”"},{"id":"P-04","detail":"Extended low-matter space accepted as physically realizable"},{"id":"P-05","detail":"Hydrostatic balance retained"},{"id":"P-06","detail":"Height, volume, and force supplied quantitative tests"}],"explicitEdges":[{"source":"A-PUMP-LIMIT","relation":"motivates","target":"D-PRESSURE-VACUUM-1640-1660"},{"source":"A-MERCURY","relation":"enables","target":"V-BAROMETER"},{"source":"V-BAROMETER","relation":"tests","target":"R-HORROR-VACUI"},{"source":"A-ALTITUDE","relation":"tests","target":"H-ATMOSPHERIC-WEIGHT"},{"source":"R-HORROR-VACUI","relation":"superseded-by","target":"H-ATMOSPHERIC-WEIGHT"},{"source":"R-SUCTION-AS-PULL","relation":"reframed-by","target":"PRESSURE-DIFFERENCE"},{"source":"EQ-HYDROSTATIC","relation":"generates","target":"EQ-BAROMETER"},{"source":"D-PRESSURE-VACUUM-1640-1660","relation":"precedes","target":"D-KINETIC-THEORY"},{"source":"D-PRESSURE-VACUUM-1640-1660","relation":"instantiates","target":"P-03"},{"source":"D-PRESSURE-VACUUM-1640-1660","relation":"instantiates","target":"P-06"}],"sourceCount":3,"wordCount":1877},{"file":"fundamental_physics_discoveries/55_fermat_principle.md","id":"D-FERMAT-PRINCIPLE-1662","title":"Fermat's Principle of Stationary Optical Time","date":"1662 mature least-time derivation of refraction","year":1662,"era":"Scientific revolution","category":"Quantum & radiation","domain":"Geometrical optics, refraction, variational reasoning, and ray geometry","contributors":"Pierre de Fermat; with antecedents from Hero of Alexandria and the refraction law associated with Harriot, Snell and Descartes","status":"A correct stationary-optical-time principle in geometrical optics; not a universal microscopic mechanism of light propagation","mainline":true,"claim":"Fermat showed that reflection and refraction can be generated by comparing neighboring possible ray paths and selecting a path whose travel time is stationary. In an isotropic medium with refractive index n(\\mathbf r), the modern reconstruction is","pathways":[{"id":"R-SHORTEST-DISTANCE-ALL-RAYS","label":"SHORTEST DISTANCE ALL RAYS","what":"A geometrical rule extending Hero's reflected-path construction to all optical propagation by assuming that a physical ray always follows the shortest spatial distance between endpoints, regardless of changes in propagation speed between media.","period":"antiquity through the early seventeenth century.","limitation":"At refraction, the shortest spatial path is a straight line and therefore cannot generate the observed bending.","outcome":"Replaced as a universal rule by stationary optical time or optical length."},{"id":"R-DESCARTES-MECHANICAL-REFRACTION","label":"DESCARTES MECHANICAL REFRACTION","what":"Descartes's corpuscular-mechanical account in which light behaves analogously to a rapidly transmitted tendency or projectile whose motion is resolved into components at an interface, producing the correct sine law while assuming a mechanical change of motion in the denser medium.","period":"1637 (La Dioptrique).","limitation":"Its speed interpretation conflicted with the later wave result that light travels more slowly in optically denser ordinary media; its mechanism did not unify arbitrary graded media.","outcome":"The mechanical ontology was superseded, although the sine law survived."},{"id":"R-LOCAL-SNELL-LAW-WITHOUT-GENERATOR","label":"LOCAL SNELL LAW WITHOUT GENERATOR","what":"A phenomenological optics in which n_1\\sin\\theta_1=n_2\\sin\\theta_2 is accepted as an independent interface rule, with straight-line motion imposed separately inside each uniform medium.","period":"1621–1662.","limitation":"It did not explain why the same law follows at every interface or how rays propagate in continuously varying media.","outcome":"Retained as the local consequence of a more general variational principle."}],"assets":[{"id":"A-HERO-REFLECTION","label":"equality of reflection angles from a shortest broken path","detail":"equality of reflection angles from a shortest broken path."},{"id":"A-SNELL-LAW","label":"empirical sine relation for refraction","detail":"empirical sine relation for refraction."},{"id":"A-FERMAT-EXTREMA","label":"Fermat's techniques for maxima, minima and tangents","detail":"Fermat's techniques for maxima, minima and tangents."},{"id":"A-MEDIA-SPEED","label":"the proposal that propagation time differs between media","detail":"the proposal that propagation time differs between media."},{"id":"A-CARTESIAN-DIOPTRICS","label":"a rival derivation precise enough to be challenged quantitatively","detail":"a rival derivation precise enough to be challenged quantitatively."},{"id":"A-GEOMETRICAL-RAYS","label":"idealized paths representing propagation direction","detail":"idealized paths representing propagation direction."}],"timeSlices":[{"id":"TS-HERO-REFLECTION","period":"first century CE","label":"Reflection organized by shortest broken path","detail":"Reflection organized by shortest broken path — A geometrical extremum explains equal angles"},{"id":"TS-MEDIEVAL-OPTICS","period":"eleventh–thirteenth centuries","label":"Ibn al-Haytham and successors develop geometrical and experimental optics","detail":"Ibn al-Haytham and successors develop geometrical and experimental optics — Rays, vision, reflection and refraction become systematic"},{"id":"TS-SNELL-DESCARTES","period":"1621–1637","label":"Sine law of refraction identified and published","detail":"Sine law of refraction identified and published — Accurate interface rule lacks an agreed generative principle"},{"id":"TS-FERMAT","period":"1657–1662","label":"Fermat contests Cartesian refraction and formulates least time","detail":"Fermat contests Cartesian refraction and formulates least time — One variational rule yields reflection and refraction"},{"id":"TS-BRACHISTOCHRONE","period":"1696–1697","label":"Fastest-descent curve solved by optical analogy","detail":"Fastest-descent curve solved by optical analogy — Fermat's reasoning migrates from optics into mechanics"},{"id":"TS-WAVE-EIKONAL","period":"nineteenth–twentieth centuries","label":"Wave theory and Maxwell theory underlie rays","detail":"Wave theory and Maxwell theory underlie rays — Stationary optical length retained as a short-wavelength approximation"}],"patterns":[{"id":"P-01","detail":"Straight propagation, reflection, refraction and graded-index bending share one path functional"},{"id":"P-02","detail":"Snell's empirical sine law becomes a generated stationarity condition"},{"id":"P-03","detail":"“What force bends light here?” becomes “Which neighboring path has stationary travel time?”"},{"id":"P-04","detail":"A global functional over possible paths becomes an admissible explanatory object"},{"id":"P-05","detail":"Hero's geometry and Snell's quantitative law survive inside the new framework"},{"id":"P-06","detail":"The principle yields calculable crossing points, angles, delays and ray trajectories"}],"explicitEdges":[{"source":"A-HERO-REFLECTION","relation":"prefigures","target":"D-FERMAT-PRINCIPLE-1662"},{"source":"A-SNELL-LAW","relation":"constrains","target":"D-FERMAT-PRINCIPLE-1662"},{"source":"A-FERMAT-EXTREMA","relation":"enables","target":"D-FERMAT-PRINCIPLE-1662"},{"source":"D-FERMAT-PRINCIPLE-1662","relation":"generates","target":"SNELL-REFRACTION"},{"source":"D-FERMAT-PRINCIPLE-1662","relation":"generates","target":"SPECULAR-REFLECTION"},{"source":"STATIONARY-OPTICAL-LENGTH","relation":"yields","target":"GRADED-INDEX-RAY-EQUATION"},{"source":"WAVE-STATIONARY-PHASE","relation":"recovers","target":"D-FERMAT-PRINCIPLE-1662"},{"source":"D-FERMAT-PRINCIPLE-1662","relation":"prefigures","target":"D-LAGRANGIAN-MECHANICS-1788"},{"source":"D-FERMAT-PRINCIPLE-1662","relation":"instantiates","target":"P-02"},{"source":"D-FERMAT-PRINCIPLE-1662","relation":"instantiates","target":"P-03"}],"sourceCount":5,"wordCount":1977},{"file":"fundamental_physics_discoveries/07_finite_speed_of_light.md","id":"D-ROMER-LIGHT-SPEED-1676","title":"Finite Speed of Light","date":"1676 (Rømer's announcement)","year":1676,"era":"Scientific revolution","category":"Quantum & radiation","domain":"Propagation of light","contributors":"Ole Rømer; later Bradley, Fizeau, Foucault, and Michelson","status":"Light in vacuum propagates at the invariant speed c=299\\,792\\,458\\ \\mathrm{m\\,s^{-1}}, exact by SI definition","mainline":false,"claim":"Rømer inferred from systematic timing shifts in eclipses of Jupiter's moon Io that light takes time to cross changing Earth–Jupiter distances. Later terrestrial measurements quantified the speed. The result transformed light from an instantaneous visual connection into a propagating physical process.","pathways":[{"id":"R-INSTANTANEOUS-LIGHT","label":"INSTANTANEOUS LIGHT","what":"A propagation model in which illumination and visual influence cross any distance with zero travel time, so emission and reception are simultaneous apart from source motion.","period":"antiquity through the seventeenth century.","limitation":"","outcome":"Superseded fundamentally; retained as an approximation when L/c is negligible."},{"id":"R-GALILEAN-LANTERN-NULL","label":"GALILEAN LANTERN NULL","what":"Galileo's proposed and reportedly attempted shuttered-lantern timing method, in which observers at separated terrestrial stations uncover lights in sequence to search for a measurable propagation delay.","period":"1638 publication of the lantern proposal.","limitation":"Human reaction time and the short terrestrial baseline were many orders of magnitude too coarse, so a null delay could not distinguish instantaneous light from a very large finite speed.","outcome":"Inconclusive predecessor; the controlled time-of-flight strategy was retained by later terrestrial experiments."}],"assets":[{"id":"A-IO-CLOCK","label":"regular eclipses of Io","detail":"regular eclipses of Io."},{"id":"A-EPHEMERIDES","label":"predicted eclipse times","detail":"predicted eclipse times."},{"id":"A-ORBITAL-GEOMETRY","label":"changing Earth–Jupiter separation","detail":"changing Earth–Jupiter separation."},{"id":"A-PRECISION-TIME","label":"accumulated residuals rather than direct visual reaction","detail":"accumulated residuals rather than direct visual reaction."}],"timeSlices":[{"id":"TS-INSTANTANEOUS","period":"Antiquity–17th century","label":"Vision or light often treated as instantaneous","detail":"Vision or light often treated as instantaneous — Terrestrial baselines seemed too short"},{"id":"TS-GALILEO-LANTERNS","period":"Early 17th century","label":"Distant shuttered lanterns proposed","detail":"Distant shuttered lanterns proposed — Only a lower bound was feasible"},{"id":"TS-ROMER","period":"1676","label":"Io eclipse timing compared across Earth's orbit","detail":"Io eclipse timing compared across Earth's orbit — Astronomical baseline reveals delay"},{"id":"TS-BRADLEY","period":"1728","label":"Stellar aberration","detail":"Stellar aberration — Independent finite-speed evidence"},{"id":"TS-FIZEAU-FOUCAULT","period":"1849–1862","label":"Toothed wheel and rotating mirror","detail":"Toothed wheel and rotating mirror — Terrestrial numerical measurements"},{"id":"TS-RELATIVITY-SI","period":"1905 onward","label":"c becomes spacetime invariant","detail":"c becomes spacetime invariant — Meter defined from exact c"}],"patterns":[{"id":"P-01","detail":"Astronomy and optical propagation linked through timing"},{"id":"P-02","detail":"Eclipse residuals generated by path-length delay"},{"id":"P-03","detail":"“Why does Io's clock drift?” reframed as signal travel time"},{"id":"P-04","detail":"Light treated as a finite-speed physical process"},{"id":"P-05","detail":"Orbital astronomy retained as the measurement platform"},{"id":"P-06","detail":"Delay proportional to distance supplied a numerical test"}],"explicitEdges":[{"source":"A-IO-CLOCK","relation":"enables","target":"D-ROMER-LIGHT-SPEED-1676"},{"source":"A-ORBITAL-GEOMETRY","relation":"modulates","target":"PROPAGATION-DISTANCE"},{"source":"PROPAGATION-DISTANCE","relation":"generates","target":"V-ECLIPSE-DELAY"},{"source":"V-ECLIPSE-DELAY","relation":"refutes","target":"R-INSTANTANEOUS-LIGHT"},{"source":"D-ROMER-LIGHT-SPEED-1676","relation":"precedes","target":"D-TERRESTRIAL-C"},{"source":"D-TERRESTRIAL-C","relation":"quantifies","target":"CONSTANT-C"},{"source":"CONSTANT-C","relation":"part-of","target":"D-SPECIAL-RELATIVITY"},{"source":"D-ROMER-LIGHT-SPEED-1676","relation":"instantiates","target":"P-03"},{"source":"D-ROMER-LIGHT-SPEED-1676","relation":"instantiates","target":"P-06"}],"sourceCount":3,"wordCount":1751},{"file":"fundamental_physics_discoveries/08_newtonian_mechanics.md","id":"T-NEWTON-1687","title":"Newtonian Mechanics","date":"1684–1687 synthesis; Principia published 5 July 1687","year":1687,"era":"Scientific revolution","category":"Mechanics & astronomy","domain":"Mechanics, astronomy, and the history of scientific explanation","contributors":"","status":"Newtonian mechanics is a correct and highly successful theory within its ordinary domain: macroscopic bodies, speeds much lower than the speed of light, and weak gravitational fields. It is not an ultimate theory of nature.","mainline":true,"claim":"T-NEWTON-1687 unified terrestrial and celestial motion through general laws of motion and universal gravitation. Its achievement lay not merely in fitting known facts, but in deriving, connecting, and extending them within a quantitatively testable framework.","pathways":[{"id":"T-ARISTOTELIAN-MOTION","label":"Aristotelian dynamics","what":"A qualitative dynamics that classifies terrestrial motion as natural or violent, relates natural motion to a body's elemental constitution and natural place, and normally requires an external mover or a mediating account for forced motion.","period":"Fourth century BCE onward; the core Aristotelian texts long predate 1687.","limitation":"Projectile motion after loss of contact with the mover was difficult to account for; the role assigned to the medium could become circular or implausible; the framework did not yield a general, precise mathematics of accelerated and orbital motion.","outcome":"Superseded as the general dynamics of nature by inertial and force-based mechanics."},{"id":"T-IMPETUS","label":"Medieval impetus theories","what":"A family of theories in which a projector impresses an internal motive quality—impetus—into a body, allowing it to continue moving after direct contact with the projector ends.","period":"Sixth–fourteenth centuries CE, with major medieval formulations well before 1687.","limitation":"Impetus was usually qualitative, its persistence was debated, and it was not equivalent to Newtonian momentum or a fully articulated law of inertia. It did not generate Kepler's laws or a universal quantitative dynamics.","outcome":"Superseded as a fundamental ontology of motion, while contributing to a gradual reorientation toward properties carried by moving bodies."},{"id":"T-CARTESIAN-VORTICES","label":"Cartesian vortex cosmology","what":"A plenum cosmology in which circulating subtle matter transports planets and satellites around local centers, replacing gravitational attraction through empty space with contact interactions in nested fluid-like vortices.","period":"Principally 1644–1680s; Descartes's published vortex cosmology predates Newton's 1687 synthesis.","limitation":"A single vortex pattern could not readily satisfy Kepler's area and period relations while also preserving nested satellite systems; fluid resistance threatened orbital stability; highly eccentric and differently oriented comet paths were especially troublesome.","outcome":"Displaced in celestial mechanics by Newtonian gravitation because the latter produced superior mathematical derivations and predictions. Continental acceptance was gradual, not instantaneous."}],"assets":[{"id":"A-GALILEO-FALL","label":"The mathematical study of uniformly accelerated free fall, including distance proportional to elapsed time squared in the idealized case","detail":"The mathematical study of uniformly accelerated free fall, including distance proportional to elapsed time squared in the idealized case."},{"id":"A-GALILEO-PROJECTILE","label":"The composition of horizontal motion with vertical accelerated fall, yielding an ideal parabolic projectile path","detail":"The composition of horizontal motion with vertical accelerated fall, yielding an ideal parabolic projectile path."},{"id":"A-GALILEO-INERTIA","label":"Reasoning that helped detach continued motion from the need for a continuously acting mover","detail":"Reasoning that helped detach continued motion from the need for a continuously acting mover. Galileo's own formulation is often interpreted as involving circular rather than fully Newtonian rectilinear inertia, so the continuity should not be overstated."},{"id":"L-KEPLER-1","label":"Planets move on ellipses with the Sun at one focus","detail":"Planets move on ellipses with the Sun at one focus."},{"id":"L-KEPLER-2","label":"A Sun–planet radius vector sweeps equal areas in equal times","detail":"A Sun–planet radius vector sweeps equal areas in equal times."},{"id":"L-KEPLER-3","label":"For planets orbiting the Sun, the square of orbital period is proportional to the cube of semi-major axis","detail":"For planets orbiting the Sun, the square of orbital period is proportional to the cube of semi-major axis."}],"timeSlices":[{"id":"TS-01-ARISTOTELIAN","period":"4th century BCE onward","label":"Motion classified as natural or violent; terrestrial and celestial regions treated differently","detail":"Motion classified as natural or violent; terrestrial and celestial regions treated differently — A systematic vocabulary for change, place, medium, and causal explanation — Continuous forced motion was difficult to explain once contact with a mover ceased; quantitative prediction remained limited"},{"id":"TS-02-IMPETUS","period":"6th–14th centuries, with important medieval developments","label":"A mover imparts an internal “impetus” that sustains a projectile after release","detail":"A mover imparts an internal “impetus” that sustains a projectile after release — A serious attempt to locate persistence of motion in the moving body rather than in the surrounding medium alone — Impetus was not yet a general mathematical law of inertia, and its decay and relation to weight varied among authors"},{"id":"TS-03-GALILEO-KEPLER","period":"Late 16th–early 17th centuries","label":"Quantitative terrestrial kinematics and mathematical regularities of planetary motion","detail":"Quantitative terrestrial kinematics and mathematical regularities of planetary motion — Galileo: free fall, projectile composition, and inertia-related reasoning; Kepler: three empirical orbital laws based on precise observations — Terrestrial and celestial results were powerful but not yet unified by one general dynamics"},{"id":"TS-04-CARTESIAN","period":"1630s–1680s","label":"A mechanical cosmos filled with matter, using contact action and vortices","detail":"A mechanical cosmos filled with matter, using contact action and vortices — A unified natural-philosophical ambition, strong emphasis on mechanism, and a broad cosmological competitor — Vortex models struggled to reproduce Keplerian relations and the observed behavior of planets and comets quantitatively"},{"id":"TS-05-NEWTON-1684-1687","period":"1684–1687","label":"Which force law and laws of motion can generate observed orbital regularities?","detail":"Which force law and laws of motion can generate observed orbital regularities? — Newton developed the synthesis published as Philosophiæ naturalis principia mathematica in 1687; Halley's 1684 prompt and later editorial and financial support were important to publication — The theory introduced attraction across space without a fully specified physical medium or mechanism, inviting philosophical dispute"},{"id":"TS-06-POST-1687","period":"Late 17th–19th centuries","label":"Can the same mathematical system predict and explain diverse terrestrial and celestial phenomena?","detail":"Can the same mathematical system predict and explain diverse terrestrial and celestial phenomena? — Increasingly precise applications to planetary perturbations, the Moon, tides, cometary paths, Earth shape, projectiles, and engineering — Difficult calculations, imperfect data, and some residual discrepancies demanded refinement; later relativity and quantum theory delimited the theory's scope"}],"patterns":[{"id":"P-01","detail":"Unification of previously separated domains — Terrestrial fall and celestial orbit became cases governed by common laws — Search for one representation that compresses rules currently assigned to separate domains"},{"id":"P-02","detail":"Upgrading empirical regularities into generative mechanisms — Kepler's descriptive laws became consequences of motion under central gravitation — Prefer models that generate observed regularities and counterfactual predictions, not only curve fits"},{"id":"P-03","detail":"Reframing questions — “What keeps a planet moving?” became “What continually changes its inertial motion?” — Alter the problem's variables and default assumptions when the inherited question blocks progress"},{"id":"P-04","detail":"Tolerating new ontology or mechanism forms — Mathematically characterized universal attraction was used despite controversy over its physical mediation — Do not reject a quantitatively fertile representation solely because its ontology is unfamiliar; track the unresolved explanatory debt explicitly"},{"id":"P-05","detail":"Retaining valid structures of predecessor theories — Galilean kinematics and Keplerian regularities were preserved, generalized, and reinterpreted; concerns about resistance remained relevant — Decompose predecessors into reusable laws, constraints, data, and failed ontological commitments"},{"id":"P-06","detail":"Prioritizing quantitative testability — The theory linked force laws to calculable trajectories, accelerations, perturbations, and comparisons with observation — Rank hypotheses by precision, cross-domain testing, and capacity for risky prediction while recording approximation conditions"}],"explicitEdges":[{"source":"T-ARISTOTELIAN-MOTION","relation":"precedes","target":"T-IMPETUS"},{"source":"T-IMPETUS","relation":"precedes","target":"A-GALILEO-INERTIA"},{"source":"T-ARISTOTELIAN-MOTION","relation":"superseded-by","target":"T-NEWTON-1687"},{"source":"T-IMPETUS","relation":"superseded-by","target":"T-NEWTON-1687"},{"source":"T-CARTESIAN-VORTICES","relation":"competes-with","target":"T-NEWTON-1687"},{"source":"T-NEWTON-1687","relation":"supersedes-as-general-celestial-dynamics","target":"T-CARTESIAN-VORTICES"},{"source":"T-NEWTON-1687","relation":"retains-and-reframes","target":"A-GALILEO-FALL"},{"source":"T-NEWTON-1687","relation":"retains-and-reframes","target":"A-GALILEO-PROJECTILE"},{"source":"A-GALILEO-INERTIA","relation":"contributes-to","target":"L-NEWTON-1"},{"source":"A-GALILEO-FALL","relation":"contributes-to","target":"T-NEWTON-1687"},{"source":"A-GALILEO-PROJECTILE","relation":"contributes-to","target":"T-NEWTON-1687"},{"source":"L-KEPLER-1","relation":"empirical-constraint-for","target":"T-NEWTON-1687"},{"source":"L-KEPLER-2","relation":"empirical-constraint-for","target":"T-NEWTON-1687"},{"source":"L-KEPLER-3","relation":"empirical-constraint-for","target":"T-NEWTON-1687"},{"source":"A-GALILEO-FALL","relation":"represented-by","target":"EQ-GALILEO-FALL"},{"source":"A-GALILEO-PROJECTILE","relation":"represented-by","target":"EQ-GALILEO-PROJECTILE"},{"source":"L-KEPLER-1","relation":"represented-by","target":"EQ-KEPLER-ELLIPSE"},{"source":"L-KEPLER-2","relation":"represented-by","target":"EQ-KEPLER-AREA"},{"source":"L-KEPLER-3","relation":"represented-by","target":"EQ-KEPLER-PERIOD"},{"source":"A-OBSERVATION","relation":"supports","target":"A-KEPLER"},{"source":"A-OBSERVATION","relation":"tests","target":"T-NEWTON-1687"},{"source":"A-MATHEMATICS","relation":"enables","target":"T-NEWTON-1687"},{"source":"A-COMPETITORS","relation":"challenges-and-shapes","target":"T-NEWTON-1687"},{"source":"L-NEWTON-1","relation":"part-of","target":"T-NEWTON-1687"},{"source":"L-NEWTON-2","relation":"part-of","target":"T-NEWTON-1687"},{"source":"L-NEWTON-3","relation":"part-of","target":"T-NEWTON-1687"},{"source":"L-UNIVERSAL-GRAVITATION","relation":"part-of","target":"T-NEWTON-1687"},{"source":"L-NEWTON-1","relation":"represented-by","target":"EQ-NEWTON-1"},{"source":"L-NEWTON-2","relation":"represented-by","target":"EQ-NEWTON-2"},{"source":"L-NEWTON-3","relation":"represented-by","target":"EQ-NEWTON-3"},{"source":"L-UNIVERSAL-GRAVITATION","relation":"represented-by","target":"EQ-GRAVITATION"},{"source":"EQ-GRAVITATION","relation":"generates-with-laws-of-motion","target":"EQ-KEPLER-PERIOD"},{"source":"EQ-GRAVITATION","relation":"supports-via-distance-scaling","target":"V-MOON"},{"source":"EQ-GRAVITATION","relation":"supports-via-gradient","target":"V-TIDES"},{"source":"T-NEWTON-1687","relation":"explains","target":"V-PLANETS"},{"source":"T-NEWTON-1687","relation":"explains","target":"V-MOON"},{"source":"T-NEWTON-1687","relation":"partly-explains","target":"V-TIDES"},{"source":"T-NEWTON-1687","relation":"explains","target":"V-COMETS"},{"source":"T-NEWTON-1687","relation":"explains","target":"V-TERRESTRIAL"},{"source":"V-PLANETS","relation":"validates","target":"T-NEWTON-1687"},{"source":"V-MOON","relation":"validates","target":"T-NEWTON-1687"},{"source":"V-TIDES","relation":"supports","target":"T-NEWTON-1687"},{"source":"V-COMETS","relation":"validates","target":"T-NEWTON-1687"},{"source":"V-TERRESTRIAL","relation":"validates","target":"T-NEWTON-1687"},{"source":"SCOPE-ORDINARY","relation":"bounds-validity-of","target":"T-NEWTON-1687"},{"source":"LIMIT-RELATIVITY","relation":"limits","target":"T-NEWTON-1687"},{"source":"LIMIT-QUANTUM","relation":"limits","target":"T-NEWTON-1687"},{"source":"T-NEWTON-1687","relation":"retained-as-approximation-within","target":"SCOPE-ORDINARY"},{"source":"T-NEWTON-1687","relation":"instantiates","target":"P-01"},{"source":"T-NEWTON-1687","relation":"instantiates","target":"P-02"},{"source":"T-NEWTON-1687","relation":"instantiates","target":"P-03"},{"source":"T-NEWTON-1687","relation":"instantiates","target":"P-04"},{"source":"T-NEWTON-1687","relation":"instantiates","target":"P-05"},{"source":"T-NEWTON-1687","relation":"instantiates","target":"P-06"}],"sourceCount":4,"wordCount":4388},{"file":"fundamental_physics_discoveries/56_lagrangian_mechanics.md","id":"D-LAGRANGIAN-MECHANICS-1788","title":"Lagrangian Analytical Mechanics","date":"1788 publication of Méchanique analitique","year":1788,"era":"Scientific revolution","category":"Mechanics & astronomy","domain":"Analytical mechanics, generalized coordinates, constraints, virtual work, and variational dynamics","contributors":"Joseph-Louis Lagrange; building on virtual-work, variational and dynamical work by d'Alembert, Euler, Maupertuis, the Bernoullis and others","status":"An equivalent and highly general classical formulation within its domain; modern action notation is a later reconstruction and extension","mainline":true,"claim":"Lagrange reorganized mechanics so that constrained many-body motion could be derived in generalized coordinates without solving explicitly for every internal constraint force. The central equations,","pathways":[{"id":"R-CARTESIAN-COMPONENT-MECHANICS","label":"CARTESIAN COMPONENT MECHANICS","what":"A Newtonian calculation strategy that writes a separate vector force equation for every body in fixed spatial coordinates and then resolves all unknown reaction forces and accelerations component by component.","period":"late seventeenth–eighteenth centuries.","limitation":"Linkages, rolling constraints, rigid bodies and many-particle systems generate numerous dependent coordinates and unknown internal forces.","outcome":"Retained as an equivalent local formulation, but superseded as the uniquely privileged representation."},{"id":"R-EXPLICIT-CONSTRAINT-REACTIONS","label":"EXPLICIT CONSTRAINT REACTIONS","what":"A constrained-mechanics method in which every tension, normal force, hinge reaction or contact force is introduced as an additional unknown and solved together with Cartesian equations and constraint relations.","period":"seventeenth–eighteenth centuries.","limitation":"The number of unknown reactions grows quickly, while ideal reactions often do no virtual work and are irrelevant to the reduced motion.","outcome":"Retained when reaction forces themselves are needed; otherwise bypassed in reduced dynamics."},{"id":"R-MAUPERTUIS-METAPHYSICAL-ACTION","label":"MAUPERTUIS METAPHYSICAL ACTION","what":"Maupertuis's 1744 program proposing that nature minimizes an “action” related to mass, speed and distance, often defended through economy or perfection and formulated most securely for restricted fixed-energy problems rather than arbitrary time-dependent dynamics.","period":"1744 onward.","limitation":"Early formulations were ambiguous, sometimes teleological, and did not yet supply a general constrained-coordinate dynamics.","outcome":"Metaphysical universality was abandoned; precise stationary-action principles were retained in qualified forms."},{"id":"R-DALEMBERT-WITHOUT-SYSTEMATIC-COORDINATES","label":"DALEMBERT WITHOUT SYSTEMATIC COORDINATES","what":"The d'Alembert virtual-work equation treating dynamics as equilibrium between applied and inertial forces, but applied case by case before a fully systematic generalized-coordinate calculus organizes all degrees of freedom.","period":"1743–1750s.","limitation":"Without systematic generalized coordinates, the method remained cumbersome and problem-specific.","outcome":"Absorbed as a foundational step in Lagrangian mechanics."}],"assets":[{"id":"A-NEWTON-DYNAMICS","label":"empirically successful force–acceleration laws to be reproduced","detail":"empirically successful force–acceleration laws to be reproduced."},{"id":"A-VIRTUAL-WORK","label":"ideal constraint reactions vanish against allowed virtual displacements","detail":"ideal constraint reactions vanish against allowed virtual displacements."},{"id":"A-DALEMBERT","label":"applied and inertial forces form a virtual-work balance","detail":"applied and inertial forces form a virtual-work balance."},{"id":"A-CALCULUS-VARIATIONS","label":"Euler and Lagrange methods for varying functions and functionals","detail":"Euler and Lagrange methods for varying functions and functionals."},{"id":"A-GENERALIZED-COORDINATES","label":"independent variables adapted to constraints and symmetry","detail":"independent variables adapted to constraints and symmetry."},{"id":"A-FERMAT-MAUPERTUIS","label":"earlier examples of global extremal reasoning","detail":"earlier examples of global extremal reasoning."}],"timeSlices":[{"id":"TS-VIRTUAL-WORK","period":"seventeenth–early eighteenth centuries","label":"Equilibrium of constrained systems","detail":"Equilibrium of constrained systems — Virtual displacements suppress ideal constraint reactions"},{"id":"TS-FERMAT-BRACHISTOCHRONE","period":"1662–1697","label":"Extremal paths solve optics and fastest-descent problems","detail":"Extremal paths solve optics and fastest-descent problems — Functionals and variations become productive mathematical objects"},{"id":"TS-MAUPERTUIS-EULER","period":"1744","label":"Least-action proposals enter mechanics","detail":"Least-action proposals enter mechanics — Action requires mathematical clarification and restricted interpretation"},{"id":"TS-DALEMBERT","period":"1743 onward","label":"Dynamics recast as instantaneous virtual equilibrium","detail":"Dynamics recast as instantaneous virtual equilibrium — Applied forces and inertial terms combine"},{"id":"TS-LAGRANGE","period":"1750s–1788","label":"Generalized-coordinate mechanics consolidated","detail":"Generalized-coordinate mechanics consolidated — Geometry-specific force balances become one analytical scheme"},{"id":"TS-HAMILTON-NOETHER","period":"1830s–1918","label":"Action and transformation structure generalized","detail":"Action and transformation structure generalized — Canonical mechanics and symmetry–conservation theory emerge"}],"patterns":[{"id":"P-01","detail":"Particles, rigid bodies, linkages and constrained systems share one coordinate-independent equation form"},{"id":"P-02","detail":"Virtual-work regularities become equations generated from L and generalized forces"},{"id":"P-03","detail":"“What are all constraint forces?” becomes “What are the independent degrees of freedom?”"},{"id":"P-04","detail":"Configuration space, generalized coordinates and scalar generating functions become primary objects"},{"id":"P-05","detail":"Newtonian trajectories and d'Alembert virtual work survive as equivalent or foundational structures"},{"id":"P-06","detail":"Candidate Lagrangians generate explicit equations, conservation checks and measurable trajectories"}],"explicitEdges":[{"source":"A-NEWTON-DYNAMICS","relation":"constrained-target-for","target":"D-LAGRANGIAN-MECHANICS-1788"},{"source":"A-VIRTUAL-WORK","relation":"contributes-to","target":"D-LAGRANGIAN-MECHANICS-1788"},{"source":"A-DALEMBERT","relation":"enables","target":"GENERALIZED-DYNAMICS"},{"source":"A-GENERALIZED-COORDINATES","relation":"eliminate","target":"IDEAL-CONSTRAINT-REACTIONS"},{"source":"D-LAGRANGIAN-MECHANICS-1788","relation":"generates","target":"EULER-LAGRANGE-EQUATIONS"},{"source":"CYCLIC-COORDINATE","relation":"implies","target":"CONSERVED-CANONICAL-MOMENTUM"},{"source":"D-FERMAT-PRINCIPLE-1662","relation":"prefigures","target":"STATIONARY-ACTION"},{"source":"D-LAGRANGIAN-MECHANICS-1788","relation":"precedes","target":"D-HAMILTONIAN-MECHANICS-1834"},{"source":"D-LAGRANGIAN-MECHANICS-1788","relation":"enables","target":"D-NOETHER-THEOREMS-1918"},{"source":"D-LAGRANGIAN-MECHANICS-1788","relation":"instantiates","target":"P-03"}],"sourceCount":5,"wordCount":2028},{"file":"fundamental_physics_discoveries/09_wave_theory_and_interference.md","id":"D-WAVE-INTERFERENCE-1690-1818","title":"Wave Theory and Interference of Light","date":"1801–1818 (Young interference through Fresnel diffraction)","year":1818,"era":"Nineteenth century","category":"Quantum & radiation","domain":"Interference, diffraction, refraction, and polarization","contributors":"Christiaan Huygens, Thomas Young, Augustin-Jean Fresnel","status":"Wave superposition is fundamental; classical waves are the high-occupation limit of quantum electrodynamics","mainline":false,"claim":"Huygens supplied a wavefront construction, Young demonstrated interference, and Fresnel developed quantitative diffraction. Their work showed that intensities cannot always be added as independent rays: amplitudes superpose, creating bright and dark regions. Quantum theory later retained amplitude superposition while replacing a purely classical medium picture.","pathways":[{"id":"R-NEWTONIAN-CORPUSCLES","label":"NEWTONIAN CORPUSCLES","what":"A classical particle theory of light in which luminous bodies emit tiny corpuscles that travel along rays and are reflected, refracted, or color-separated by forces near material surfaces.","period":"1672–1704.","limitation":"","outcome":"Superseded as a complete classical account."},{"id":"R-LONGITUDINAL-LIGHT-WAVES","label":"LONGITUDINAL LIGHT WAVES","what":"An early optical-wave analogy in which light oscillations are longitudinal compressions and rarefactions of an ether, like sound waves in air.","period":"1690–1801.","limitation":"Polarization requires a directional transverse degree of freedom that a simple longitudinal wave cannot supply.","outcome":"Superseded; phase, frequency, and superposition were retained."},{"id":"R-TRANSVERSE-ELASTIC-ETHER","label":"TRANSVERSE ELASTIC ETHER","what":"A refined ether model in which light is a transverse shear vibration of an extremely rigid yet matter-penetrating elastic medium.","period":"1817 (Young's transverse-wave proposal).","limitation":"Its required mechanical properties were mutually difficult to reconcile and no preferred ether motion was established.","outcome":"The material carrier was discarded; transverse electromagnetic polarization was retained."}],"assets":[{"id":"A-WATER-SOUND-WAVES","label":"analogy of superposition and fronts","detail":"analogy of superposition and fronts."},{"id":"A-THIN-FILMS","label":"colored interference phenomena","detail":"colored interference phenomena."},{"id":"A-DIFFRACTION","label":"bending and fringes near edges","detail":"bending and fringes near edges."},{"id":"A-PHASE","label":"periodic wave state","detail":"periodic wave state."},{"id":"A-POLARIZATION","label":"evidence favoring transverse rather than longitudinal light waves","detail":"evidence favoring transverse rather than longitudinal light waves."}],"timeSlices":[{"id":"TS-CORPUSCULAR","period":"17th–18th centuries","label":"Rays or particles explain rectilinear propagation and reflection","detail":"Rays or particles explain rectilinear propagation and reflection — Diffraction and interference remained difficult"},{"id":"TS-HUYGENS","period":"1690","label":"Secondary wavelets advance wavefronts","detail":"Secondary wavelets advance wavefronts — Refraction obtains a wave construction"},{"id":"TS-YOUNG","period":"1801–1804","label":"Two-path interference demonstrated","detail":"Two-path interference demonstrated — Phase differences explain fringes"},{"id":"TS-FRESNEL","period":"1815–1818","label":"Diffraction integrals and transverse waves developed","detail":"Diffraction integrals and transverse waves developed — Wave theory makes risky quantitative predictions"},{"id":"TS-MAXWELL","period":"1860s","label":"Light identified as electromagnetic wave","detail":"Light identified as electromagnetic wave — Mechanical ether becomes less central"},{"id":"TS-QUANTUM","period":"1900 onward","label":"Photons detected individually yet build interference","detail":"Photons detected individually yet build interference — Probability amplitudes replace classical either/or ontology"}],"patterns":[{"id":"P-01","detail":"Refraction, diffraction, interference, and polarization joined"},{"id":"P-02","detail":"Fringe positions generated from phase relations"},{"id":"P-03","detail":"“Which ray path?” reframed as “How do amplitudes combine?”"},{"id":"P-04","detail":"Extended waves and later probability amplitudes accepted"},{"id":"P-05","detail":"Ray optics retained as a short-wavelength limit"},{"id":"P-06","detail":"Bright/dark fringe locations offered precise tests"}],"explicitEdges":[{"source":"A-DIFFRACTION","relation":"challenges","target":"R-NEWTONIAN-CORPUSCLES"},{"source":"A-THIN-FILMS","relation":"contributes-to","target":"D-WAVE-INTERFERENCE-1690-1818"},{"source":"D-HUYGENS-WAVEFRONT","relation":"precedes","target":"D-YOUNG-INTERFERENCE"},{"source":"D-YOUNG-INTERFERENCE","relation":"precedes","target":"D-FRESNEL-DIFFRACTION"},{"source":"EQ-SUPERPOSITION","relation":"generates","target":"V-BRIGHT-DARK-FRINGES"},{"source":"V-ARAGO-SPOT","relation":"validates","target":"D-FRESNEL-DIFFRACTION"},{"source":"D-MAXWELL-FIELD","relation":"reframes","target":"D-WAVE-INTERFERENCE-1690-1818"},{"source":"D-QUANTUM-OPTICS","relation":"retains","target":"EQ-SUPERPOSITION"},{"source":"D-WAVE-INTERFERENCE-1690-1818","relation":"instantiates","target":"P-02"},{"source":"D-WAVE-INTERFERENCE-1690-1818","relation":"instantiates","target":"P-05"}],"sourceCount":3,"wordCount":1820},{"file":"fundamental_physics_discoveries/10_electromagnetism_and_induction.md","id":"D-EM-CONNECTION-1820-1831","title":"Electromagnetism and Induction","date":"1820–1831 (Ørsted/Ampère through Faraday induction)","year":1831,"era":"Nineteenth century","category":"Fields & symmetry","domain":"Electric currents, magnetic fields, and induction","contributors":"Hans Christian Ørsted, André-Marie Ampère, Michael Faraday","status":"Retained within classical electromagnetism and quantum electrodynamics","mainline":false,"claim":"Ørsted showed that electric current produces magnetic effects; Ampère quantified current interactions; Faraday showed that changing magnetic flux induces electric circulation. Previously separate electric and magnetic phenomena became dynamically linked.","pathways":[{"id":"R-ELECTRIC-MAGNETIC-SEPARATION","label":"ELECTRIC MAGNETIC SEPARATION","what":"A two-domain theory that treats electrical attraction/current and magnetism as fundamentally independent agencies rather than different states or effects of a coupled electromagnetic field.","period":"antiquity through 1820.","limitation":"Current-induced deflection and induction cross the boundary.","outcome":"Replaced by a coupled field framework."},{"id":"R-ACTION-AT-DISTANCE-ONLY","label":"ACTION AT DISTANCE ONLY","what":"A force ontology in which separated charges or currents act directly on one another—possibly through instantaneous or retarded pair laws—without an independently physical local field storing and transporting energy.","period":"1785–1820s.","limitation":"Induction and propagation favor local field change as an explanatory intermediary.","outcome":"Field ontology became standard, although action-at-distance formulations can be mathematically equivalent in restricted settings."}],"assets":[{"id":"A-VOLTAIC-PILE","label":"sustained current","detail":"sustained current."},{"id":"A-COMPASS","label":"sensitive magnetic detector","detail":"sensitive magnetic detector."},{"id":"A-GALVANOMETER","label":"detects transient induced current","detail":"detects transient induced current."},{"id":"A-CIRCUITS","label":"reproducible conducting paths","detail":"reproducible conducting paths."},{"id":"A-LINES-OF-FORCE","label":"spatial representation of interaction","detail":"spatial representation of interaction."}],"timeSlices":[{"id":"TS-SEPARATE-FLUIDS","period":"18th century","label":"Electricity and magnetism treated largely separately","detail":"Electricity and magnetism treated largely separately — Voltaic cells enable continuous current"},{"id":"TS-OERSTED","period":"1820","label":"Current deflects compass needle","detail":"Current deflects compass needle — Electricity produces magnetism"},{"id":"TS-AMPERE","period":"1820s","label":"Current–current forces quantified","detail":"Current–current forces quantified — Electrodynamics becomes mathematical"},{"id":"TS-FARADAY","period":"1831","label":"Changing magnetic conditions produce current","detail":"Changing magnetic conditions produce current — Magnetism produces electric effects"},{"id":"TS-FIELD","period":"1840s–1860s","label":"Lines of force acquire mathematical representation","detail":"Lines of force acquire mathematical representation — Maxwell unifies fields and light"}],"patterns":[{"id":"P-01","detail":"Electricity and magnetism linked"},{"id":"P-02","detail":"Flux change generates induced emf"},{"id":"P-03","detail":"Static substances reframed as dynamical fields and currents"},{"id":"P-04","detail":"Lines of force accepted as physically meaningful"},{"id":"P-05","detail":"Electrostatic and magnetic laws retained as limits"},{"id":"P-06","detail":"Direction and magnitude of induced currents quantitatively tested"}],"explicitEdges":[{"source":"A-VOLTAIC-PILE","relation":"enables","target":"D-OERSTED-1820"},{"source":"D-OERSTED-1820","relation":"refutes","target":"R-ELECTRIC-MAGNETIC-SEPARATION"},{"source":"D-AMPERE","relation":"quantifies","target":"D-OERSTED-1820"},{"source":"A-GALVANOMETER","relation":"enables","target":"D-FARADAY-1831"},{"source":"CHANGE-MAGNETIC-FLUX","relation":"generates","target":"INDUCED-EMF"},{"source":"D-FARADAY-1831","relation":"contributes-to","target":"D-MAXWELL-FIELD"},{"source":"D-EM-CONNECTION-1820-1831","relation":"instantiates","target":"P-01"},{"source":"D-EM-CONNECTION-1820-1831","relation":"instantiates","target":"P-06"}],"sourceCount":3,"wordCount":1712},{"file":"fundamental_physics_discoveries/57_hamiltonian_mechanics.md","id":"D-HAMILTONIAN-MECHANICS-1834","title":"Hamiltonian Mechanics, Phase Space, and Canonical Structure","date":"1834–1835 Hamiltonian dynamics synthesis","year":1834.5,"era":"Nineteenth century","category":"Mechanics & astronomy","domain":"Hamiltonian mechanics, phase space, canonical transformations, Hamilton–Jacobi theory, and dynamical generators","contributors":"William Rowan Hamilton; with subsequent development by Jacobi and later canonical and symplectic formulations","status":"An equivalent regular classical formulation with foundational extensions to statistical mechanics and quantization; constrained and dissipative systems require additional structure","mainline":true,"claim":"Hamilton reorganized regular Lagrangian dynamics as first-order flow in coordinates and conjugate momenta and linked dynamics to his earlier characteristic-function methods in optics. With","pathways":[{"id":"R-DIRECT-TRAJECTORY-INTEGRATION","label":"DIRECT TRAJECTORY INTEGRATION","what":"A strategy that treats solving mechanics as direct integration of Newtonian or Lagrangian ordinary differential equations for each trajectory, without seeking a generating function whose derivatives encode whole families of solutions.","period":"seventeenth century–1833.","limitation":"It does not expose transformations between complete families of trajectories or unify optics and dynamics through one partial differential structure.","outcome":"Retained as numerical and direct solution practice; no longer the only architecture of mechanics."},{"id":"R-CONFIGURATION-VELOCITY-ONLY","label":"CONFIGURATION VELOCITY ONLY","what":"The complete Lagrangian description L(q,\\dot q,t) treated as the final natural state representation, with momenta used only as derived bookkeeping rather than independent canonical coordinates.","period":"1788–1833.","limitation":"Canonical transformations, phase-space invariants, ensemble flow and later quantization are less transparent.","outcome":"Retained as an equivalent formulation; bounded as the sole preferred representation."},{"id":"R-OPTICS-DYNAMICS-SEPARATION","label":"OPTICS DYNAMICS SEPARATION","what":"The view that geometrical optics and particle mechanics are mathematically analogous only in isolated examples, with optical characteristic functions and mechanical trajectories belonging to separate calculational theories.","period":"seventeenth century–1833.","limitation":"Fermat-type optical variation and mechanical action displayed increasingly parallel structures.","outcome":"Superseded as a mathematical separation, while the physical domains remain distinct."}],"assets":[{"id":"A-LAGRANGIAN-MECHANICS","label":"generalized-coordinate dynamics and canonical momenta","detail":"generalized-coordinate dynamics and canonical momenta."},{"id":"A-LEGENDRE-TRANSFORM","label":"exchange of velocity variables for conjugate momenta","detail":"exchange of velocity variables for conjugate momenta."},{"id":"A-HAMILTON-OPTICS","label":"characteristic functions generating ray systems","detail":"characteristic functions generating ray systems."},{"id":"A-VARIATIONAL-ACTION","label":"path functionals and endpoint derivatives","detail":"path functionals and endpoint derivatives."},{"id":"A-PARTIAL-DIFFERENTIAL-EQUATIONS","label":"functions whose complete integrals encode solution families","detail":"functions whose complete integrals encode solution families."},{"id":"A-CONSERVATION-ENERGY","label":"a distinguished scalar that often, but not always, coincides with H","detail":"a distinguished scalar that often, but not always, coincides with H."}],"timeSlices":[{"id":"TS-LAGRANGIAN-FOUNDATION","period":"1788 onward","label":"Generalized-coordinate equations organize constrained motion","detail":"Generalized-coordinate equations organize constrained motion — Configuration–velocity dynamics becomes systematic"},{"id":"TS-HAMILTON-OPTICS","period":"1827–1833","label":"Optical systems described by characteristic functions","detail":"Optical systems described by characteristic functions — Rays generated through derivatives of one scalar function"},{"id":"TS-HAMILTON-DYNAMICS","period":"1834–1835","label":"Optical method transferred to mechanics","detail":"Optical method transferred to mechanics — Canonical first-order equations and principal function emerge"},{"id":"TS-JACOBI","period":"1836–1837","label":"Hamilton's partial-differential method systematized","detail":"Hamilton's partial-differential method systematized — Hamilton–Jacobi theory connects dynamics and canonical transformations"},{"id":"TS-STATISTICAL-MECHANICS","period":"late nineteenth century","label":"Ensembles occupy spaces of canonical states","detail":"Ensembles occupy spaces of canonical states — Phase-space volume and Hamiltonian flow organize probability"},{"id":"TS-QUANTIZATION","period":"1920s onward","label":"Classical canonical variables become noncommuting observables","detail":"Classical canonical variables become noncommuting observables — Poisson-bracket structure guides canonical quantization"}],"patterns":[{"id":"P-01","detail":"Optics, particle motion, statistical ensembles and later quantization share canonical generator structure"},{"id":"P-02","detail":"Energy-like regularities become a function that generates the full phase-space flow"},{"id":"P-03","detail":"“Which trajectory solves these equations?” becomes “Which generator or principal function encodes all trajectories?”"},{"id":"P-04","detail":"Phase space, conjugate momentum, Poisson brackets and canonical transformations become primary ontology-like structures"},{"id":"P-05","detail":"All regular Lagrangian and Newtonian trajectories are retained under the Legendre transformation"},{"id":"P-06","detail":"A proposed Hamiltonian generates explicit flows, invariants, perturbations and measurable trajectories"}],"explicitEdges":[{"source":"A-LAGRANGIAN-MECHANICS","relation":"enables","target":"D-HAMILTONIAN-MECHANICS-1834"},{"source":"A-LEGENDRE-TRANSFORM","relation":"maps","target":"CONFIGURATION-VELOCITY-SPACE"},{"source":"A-LEGENDRE-TRANSFORM","relation":"produces","target":"PHASE-SPACE"},{"source":"A-HAMILTON-OPTICS","relation":"transfers-method-to","target":"D-HAMILTONIAN-MECHANICS-1834"},{"source":"HAMILTONIAN","relation":"generates","target":"PHASE-SPACE-FLOW"},{"source":"POISSON-BRACKET","relation":"expresses","target":"CANONICAL-EVOLUTION"},{"source":"HAMILTON-PRINCIPAL-FUNCTION","relation":"satisfies","target":"HAMILTON-JACOBI-EQUATION"},{"source":"D-HAMILTONIAN-MECHANICS-1834","relation":"retains","target":"D-LAGRANGIAN-MECHANICS-1788"},{"source":"D-HAMILTONIAN-MECHANICS-1834","relation":"prefigures","target":"CANONICAL-QUANTIZATION"},{"source":"D-HAMILTONIAN-MECHANICS-1834","relation":"instantiates","target":"P-03"}],"sourceCount":5,"wordCount":1834},{"file":"fundamental_physics_discoveries/11_thermodynamics_and_energy_conservation.md","id":"D-FIRST-LAW-1847-1850","title":"First Law of Thermodynamics","date":"1843–1850 mechanical equivalent of heat and first-law synthesis","year":1847,"era":"Nineteenth century","category":"Matter & emergence","domain":"Heat, work, internal energy and energy conservation","contributors":"Julius Robert Mayer, James Prescott Joule, Hermann von Helmholtz and Rudolf Clausius; with important antecedents from Benjamin Thompson (Count Rumford), Humphry Davy and others","status":"A fundamental conservation and accounting law within thermodynamic system boundaries; it does not determine process direction or efficiency bounds","mainline":true,"claim":"The first law established that heat and work are not separately conserved substances but modes of energy transfer. For a closed system, using the convention that Q is heat supplied to the system and W is work done by the system,","pathways":[{"id":"R-CALORIC-CONSERVATION","label":"CALORIC CONSERVATION","what":"A substance theory in which a weightless material called caloric is stored in bodies and flows between them while its total quantity remains conserved in ordinary thermal processes.","period":"late eighteenth century–1840s.","limitation":"Friction, electrical resistance and compression could generate heat repeatedly in proportion to supplied work.","outcome":"Caloric ontology was superseded."},{"id":"R-HEAT-AS-SIMPLE-MOTION","label":"HEAT AS SIMPLE MOTION","what":"A qualitative kinetic hypothesis identifying heat with microscopic agitation but lacking a conserved energy quantity, a reliable conversion coefficient or a complete account of internal molecular modes.","period":"seventeenth century–early 1840s.","limitation":"A verbal identification did not yield a universal conservation equation or distinguish translational, rotational, vibrational, interaction and phase energies.","outcome":"Absorbed into energy conservation and later statistical mechanics."},{"id":"R-PERPETUAL-MOTION-FIRST-KIND","label":"PERPETUAL MOTION FIRST KIND","what":"A proposed cyclic device that returns to its initial condition while delivering net work without an equivalent decrease of stored energy or an energy input from its surroundings.","period":"medieval proposals through the early nineteenth century.","limitation":"Complete accounting shows depletion, environmental input or measurement error.","outcome":"Excluded by the first law."}],"assets":[{"id":"A-CALORIMETRY","label":"measurement of temperature change, heat capacity and latent heat","detail":"measurement of temperature change, heat capacity and latent heat."},{"id":"A-MECHANICAL-WORK","label":"quantitative work from force through distance, including falling weights","detail":"quantitative work from force through distance, including falling weights."},{"id":"A-ELECTRICAL-HEATING","label":"reproducible conversion of electrical work into thermal change","detail":"reproducible conversion of electrical work into thermal change."},{"id":"A-RUMFORD-FRICTION","label":"sustained heat production by cannon boring","detail":"sustained heat production by cannon boring."},{"id":"A-JOULE-EXPERIMENTS","label":"paddle-wheel, electrical and gas routes to a common equivalent","detail":"paddle-wheel, electrical and gas routes to a common equivalent."},{"id":"A-CONSERVATION-TRADITION","label":"conservation ideas in mechanics and natural philosophy","detail":"conservation ideas in mechanics and natural philosophy."}],"timeSlices":[{"id":"TS-CALORIC","period":"late eighteenth–early nineteenth centuries","label":"Heat represented as a conserved weightless fluid","detail":"Heat represented as a conserved weightless fluid — Quantitative heat bookkeeping succeeds without energy equivalence"},{"id":"TS-RUMFORD-DAVY","period":"1798–1799","label":"Friction and mechanical action generate heat","detail":"Friction and mechanical action generate heat — Unlimited production pressures caloric conservation"},{"id":"TS-MAYER-JOULE","period":"1842–1845","label":"Mechanical, electrical and thermal processes compared quantitatively","detail":"Mechanical, electrical and thermal processes compared quantitatively — A reproducible mechanical equivalent of heat emerges"},{"id":"TS-HELMHOLTZ","period":"1847","label":"Conservation generalized across natural forces","detail":"Conservation generalized across natural forces — Energy conservation becomes a broad physical principle"},{"id":"TS-JOULE-PRECISION","period":"1849–1850","label":"Paddle-wheel and related experiments refined","detail":"Paddle-wheel and related experiments refined — Work–heat equivalence becomes quantitatively defensible"},{"id":"TS-CLAUSIUS-FIRST-LAW","period":"1850 onward","label":"Heat-engine theory reconciled with conversion of heat into work","detail":"Heat-engine theory reconciled with conversion of heat into work — Internal-energy accounting separates the first law from Carnot's directionality principle"}],"patterns":[{"id":"P-01","detail":"Mechanical, thermal, electrical and chemical changes are unified by energy conservation"},{"id":"P-02","detail":"Separate conversion measurements become instances of one balance law"},{"id":"P-03","detail":"“Where did the caloric go?” becomes “What crossed the boundary and how did internal energy change?”"},{"id":"P-04","detail":"Internal energy becomes an abstract state property not reducible to a visible substance"},{"id":"P-05","detail":"Calorimetry and conservation-style bookkeeping survive the rejection of caloric"},{"id":"P-06","detail":"Competing accounts are tested by closed quantitative balances across multiple conversion routes"}],"explicitEdges":[{"source":"A-RUMFORD-FRICTION","relation":"challenges","target":"R-CALORIC-CONSERVATION"},{"source":"A-CALORIMETRY","relation":"measures","target":"THERMAL-CHANGE"},{"source":"A-MECHANICAL-WORK","relation":"compares-with","target":"THERMAL-CHANGE"},{"source":"A-JOULE-EXPERIMENTS","relation":"supports","target":"D-FIRST-LAW-1847-1850"},{"source":"D-FIRST-LAW-1847-1850","relation":"introduces","target":"INTERNAL-ENERGY"},{"source":"D-FIRST-LAW-1847-1850","relation":"forbids","target":"R-PERPETUAL-MOTION-FIRST-KIND"},{"source":"INTERNAL-ENERGY","relation":"is-state-function-with","target":"EXACT-DIFFERENTIAL"},{"source":"HEAT-AND-WORK","relation":"are","target":"PATH-DEPENDENT-TRANSFERS"},{"source":"D-FIRST-LAW-1847-1850","relation":"constrains","target":"D-SECOND-LAW-1850-1865"},{"source":"D-FIRST-LAW-1847-1850","relation":"instantiates","target":"P-01"}],"sourceCount":5,"wordCount":2057},{"file":"fundamental_physics_discoveries/58_second_law_of_thermodynamics.md","id":"D-SECOND-LAW-1850-1865","title":"Second Law of Thermodynamics","date":"1850–1865 Clausius/Kelvin formulations through entropy","year":1850,"era":"Nineteenth century","category":"Matter & emergence","domain":"Heat engines, reversibility, thermodynamic temperature, entropy and irreversibility","contributors":"Sadi Carnot, Émile Clapeyron, William Thomson (Lord Kelvin) and Rudolf Clausius; with later statistical interpretation by Maxwell, Boltzmann, Gibbs and others","status":"A fundamental macroscopic constraint on allowed processes; statistical mechanics explains its typicality and fluctuations without erasing its thermodynamic domain","mainline":true,"claim":"The second law adds a direction and a conversion limit that energy conservation alone cannot provide. Carnot's 1824 ideal-engine argument isolated reversible operation and a universal efficiency bound without requiring detailed steam-engine mechanics. Clausius and Kelvin then reconciled that structure with heat–work equivalence, formulated impossibility principles, and developed entropy. In modern notation,","pathways":[{"id":"R-ENGINE-SPECIFIC-OPTIMIZATION","label":"ENGINE SPECIFIC OPTIMIZATION","what":"An engineering pathway that treats each steam-engine design as a separate problem of valves, pressures, fuels and materials, with no proof that all engines share a universal efficiency limit.","period":"eighteenth century–1823.","limitation":"It could not determine whether a perfect material or clever mechanism might surpass every known engine.","outcome":"Retained as engineering practice but superseded as the foundation for ultimate efficiency bounds."},{"id":"R-CALORIC-HEAT-DROP","label":"CALORIC HEAT DROP","what":"A conserved-fluid account in which caloric falls from a hotter to a colder body analogously to water descending through a waterwheel, producing motive power without being consumed.","period":"late eighteenth century–1824 Carnot formulation.","limitation":"Joule's work showed that heat can be converted to work, so heat rejected need not equal heat absorbed.","outcome":"Caloric ontology was superseded, while Carnot's reversible structure survived."},{"id":"R-FIRST-LAW-SUFFICIENT","label":"FIRST LAW SUFFICIENT","what":"The inference that once energy is conserved, a
