ffective long-wavelength theory, superseded as a microscopic origin."},{"id":"R-BOSONIC-ELECTRON-MOLECULES","label":"BOSONIC ELECTRON MOLECULES","what":"A pre-BCS idea that electrons form tightly bound, spatially compact bosonic molecules which then undergo a Bose-like condensation, analogous to independent composite particles.","period":"1940s–1955.","limitation":"Conventional BCS pairs are large, strongly overlapping momentum-space correlations rather than preformed compact molecules.","outcome":"Superseded for ordinary weak-coupling superconductors; retained in the BCS–BEC crossover."}],"assets":[{"id":"A-FERMI-SEA","label":"exclusion and a sharp low-temperature Fermi surface","detail":"exclusion and a sharp low-temperature Fermi surface."},{"id":"A-PHONONS","label":"quantized lattice vibrations that can mediate effective attraction","detail":"quantized lattice vibrations that can mediate effective attraction."},{"id":"A-ISOTOPE-EFFECT","label":"ionic mass dependence implicating lattice dynamics","detail":"ionic mass dependence implicating lattice dynamics."},{"id":"A-MEISSNER","label":"equilibrium magnetic-field expulsion","detail":"equilibrium magnetic-field expulsion."},{"id":"A-LONDON-GL","label":"penetration depth, coherence, and complex order parameter","detail":"penetration depth, coherence, and complex order parameter."},{"id":"A-COOPER-INSTABILITY","label":"a weak attraction creates a bound correlated pair above the Fermi sea","detail":"a weak attraction creates a bound correlated pair above the Fermi sea."}],"timeSlices":[{"id":"TS-ZERO-RESISTANCE","period":"1911","label":"Mercury loses measurable resistance at low temperature","detail":"Mercury loses measurable resistance at low temperature — A new state of matter is recognized"},{"id":"TS-MEISSNER-LONDON","period":"1933–1935","label":"Perfect conductivity alone cannot explain magnetic-field expulsion","detail":"Perfect conductivity alone cannot explain magnetic-field expulsion — Electrodynamic phase phenomenology develops"},{"id":"TS-ISOTOPE-GL","period":"1950","label":"Ionic mass affects T_c; complex order parameter describes macroscopic behavior","detail":"Ionic mass affects T_c; complex order parameter describes macroscopic behavior — Lattice coupling and collective phase become key clues"},{"id":"TS-COOPER","period":"1956","label":"Test whether a filled Fermi sea is stable to attraction","detail":"Test whether a filled Fermi sea is stable to attraction — Bound pair instability is derived"},{"id":"TS-BCS","period":"1957","label":"Construct a microscopic many-electron wavefunction and spectrum","detail":"Construct a microscopic many-electron wavefunction and spectrum — Gap, thermodynamics, coherence, and electrodynamics are unified"}],"patterns":[{"id":"P-01","detail":"Fermi statistics, lattice dynamics, thermodynamics, and electrodynamics are unified"},{"id":"P-02","detail":"Zero resistance and Meissner response become consequences of a paired coherent state"},{"id":"P-03","detail":"“How are collisions eliminated?” becomes “Why is the Fermi sea unstable, and what quasiparticles result?”"},{"id":"P-04","detail":"Overlapping Cooper pairs, anomalous averages, and electron–hole quasiparticles are accepted"},{"id":"P-05","detail":"London and Ginzburg–Landau equations survive as long-distance limits"},{"id":"P-06","detail":"Gap ratios, tunneling spectra, heat capacity, isotope dependence, and flux quanta test the model"}],"explicitEdges":[{"source":"A-ISOTOPE-EFFECT","relation":"supports","target":"PHONON-PAIRING-CLUE"},{"source":"A-COOPER-INSTABILITY","relation":"enables","target":"D-BCS-1957"},{"source":"A-FERMI-SEA","relation":"is-reorganized-by","target":"BCS-PAIRING"},{"source":"D-BCS-1957","relation":"generates","target":"BOGOLIUBOV-QUASIPARTICLES"},{"source":"D-BCS-1957","relation":"derives-limit","target":"A-LONDON-GL"},{"source":"PAIR-CHARGE-2E","relation":"explains","target":"FLUX-QUANTUM-H-OVER-2E"},{"source":"D-BCS-1957","relation":"generalizes-to","target":"FERMIONIC-SUPERFLUIDITY"},{"source":"D-BCS-1957","relation":"instantiates","target":"P-02"}],"sourceCount":5,"wordCount":2251},{"file":"fundamental_physics_discoveries/34_quarks_and_strong_interaction.md","id":"D-QUARK-MODEL-1964","title":"Quarks and the Strong Interaction","date":"February 1964 quark-model papers","year":1964.15,"era":"Postwar synthesis","category":"Nuclear & particles","domain":"Hadron classification and substructure","contributors":"Murray Gell-Mann, George Zweig, Yuval Ne'eman and many experimentalists","status":"Quarks are fundamental Standard Model fermions; isolated quarks are not observed because of confinement","mainline":false,"claim":"The proliferating hadron spectrum became intelligible when baryons and mesons were modeled as combinations of fractionally charged quarks. Initially a classification and constituent hypothesis, the model gained physical force from missing-state predictions and deep-inelastic scattering.","pathways":[{"id":"R-ELEMENTARY-HADRON-ZOO","label":"ELEMENTARY HADRON ZOO","what":"A particle ontology that treats each observed meson, baryon, and resonance as an independent elementary species rather than as a composite state built from fewer constituents.","period":"1940s–early 1960s.","limitation":"No explanation for multiplets, repeated quantum numbers, or missing-state patterns.","outcome":"Replaced by compositeness."},{"id":"R-SAKATA-HADRON-CONSTITUENTS","label":"SAKATA HADRON CONSTITUENTS","what":"A composite model building other hadrons from the already-known proton, neutron, lambda and their antiparticles.","period":"1956.","limitation":"","outcome":"Superseded by quark representations; constituent classification retained."},{"id":"R-EIGHTFOLD-WAY-AS-CLASSIFICATION-ONLY","label":"EIGHTFOLD WAY AS CLASSIFICATION ONLY","what":"The 1961 SU(3) flavor scheme treated only as a symmetry classification of hadrons, without a smaller set of fractionally charged constituent degrees of freedom.","period":"1961.","limitation":"Classification alone did not explain deep-inelastic constituent structure, charge weights, or jets.","outcome":"The symmetry was retained and reinterpreted through quark flavor."},{"id":"R-HADRONIC-BOOTSTRAP-PRE-QUARK","label":"HADRONIC BOOTSTRAP PRE QUARK","what":"The early-1960s bootstrap or nuclear-democracy program in which no hadron is elementary; hadrons dynamically generate one another through self-consistent strong-interaction S-matrix relations.","period":"late 1950s–1963.","limitation":"It lacked the later pointlike constituent, color, jet, and scaling-violation structure.","outcome":"Superseded as the microscopic account; analyticity and S-matrix consistency remained useful."}],"assets":[{"id":"A-SU3-SYMMETRY","label":"organizes flavor multiplets","detail":"organizes flavor multiplets."},{"id":"A-CHARGE-STRANGENESS","label":"additive quantum numbers","detail":"additive quantum numbers."},{"id":"A-SCATTERING","label":"probes short-distance structure","detail":"probes short-distance structure."},{"id":"A-PAULI-PROBLEM","label":"\\Delta^{++} motivates color","detail":"\\Delta^{++} motivates color."}],"timeSlices":[{"id":"TS-HADRON-ZOO","period":"1940s–1960s","label":"Many strongly interacting particles discovered","detail":"Many strongly interacting particles discovered — Classification needed"},{"id":"TS-EIGHTFOLD-WAY","period":"1961–1962","label":"SU(3) multiplets organize hadrons","detail":"SU(3) multiplets organize hadrons — Missing \\Omega^- predicted"},{"id":"TS-QUARKS","period":"1964","label":"Triplet constituents proposed","detail":"Triplet constituents proposed — Fractional charge introduced"},{"id":"TS-OMEGA","period":"1964","label":"Predicted baryon observed","detail":"Predicted baryon observed — Symmetry classification validated"},{"id":"TS-PARTONS","period":"Late 1960s","label":"Deep-inelastic scattering sees pointlike components","detail":"Deep-inelastic scattering sees pointlike components — Quarks gain dynamical evidence"},{"id":"TS-QCD","period":"1970s","label":"Color gauge theory developed","detail":"Color gauge theory developed — Strong force explained"}],"patterns":[{"id":"P-01","detail":"Hundreds of hadrons unified through few constituents"},{"id":"P-02","detail":"Symmetry generates missing states and charges"},{"id":"P-03","detail":"Particle zoo reframed as composite spectroscopy"},{"id":"P-04","detail":"Fractional charge and confinement accepted"},{"id":"P-05","detail":"Hadron quantum numbers retained as constituent sums"},{"id":"P-06","detail":"Missing-state and scattering predictions tested"}],"explicitEdges":[{"source":"HADRON-ZOO","relation":"motivates","target":"A-SU3-SYMMETRY"},{"source":"A-SU3-SYMMETRY","relation":"organizes","target":"HADRON-MULTIPLETS"},{"source":"HADRON-MULTIPLETS","relation":"predict","target":"OMEGA-MINUS"},{"source":"V-OMEGA-MINUS","relation":"validates","target":"QUARK-CLASSIFICATION"},{"source":"D-QUARK-MODEL-1964","relation":"supersedes","target":"R-ELEMENTARY-HADRON-ZOO"},{"source":"V-DEEP-INELASTIC","relation":"supports","target":"QUARK-SUBSTRUCTURE"},{"source":"A-PAULI-PROBLEM","relation":"motivates","target":"COLOR"},{"source":"COLOR","relation":"contributes-to","target":"D-QCD"},{"source":"D-QUARK-MODEL-1964","relation":"instantiates","target":"P-01"}],"sourceCount":4,"wordCount":1967},{"file":"fundamental_physics_discoveries/35_higgs_mechanism.md","id":"D-BEH-MECHANISM-1964","title":"Higgs Mechanism","date":"1964 BEH-mechanism papers","year":1964.7,"era":"Postwar synthesis","category":"Nuclear & particles","domain":"Spontaneous symmetry breaking in gauge theory","contributors":"Robert Brout, François Englert, Peter Higgs, Gerald Guralnik, Carl Hagen, Tom Kibble; important precursor work by others","status":"Core mechanism of electroweak symmetry breaking; does not explain all mass","mainline":false,"claim":"A gauge theory can preserve its underlying local symmetry while its vacuum state selects a nonzero field value. Gauge bosons then acquire longitudinal modes and mass; matter fields can acquire masses through Yukawa couplings. A physical scalar excitation remains.","pathways":[{"id":"R-EXPLICIT-VECTOR-MASS","label":"EXPLICIT VECTOR MASS","what":"A massive-gauge-boson model that inserts a Proca term m^2A_\\mu A^\\mu/2 directly into the Lagrangian rather than generating the mass through a gauge-compatible vacuum and scalar field.","period":"1936 (Proca).","limitation":"Destroys the gauge structure needed for high-energy consistency in non-Abelian theories.","outcome":"Replaced in electroweak theory by spontaneous symmetry breaking."},{"id":"R-GLOBAL-BREAKING-FOR-WEAK-MASS","label":"GLOBAL BREAKING FOR WEAK MASS","what":"Applying spontaneous breaking of a global continuous symmetry directly to weak-boson mass generation.","period":"1960–1962.","limitation":"","outcome":"Produces unwanted massless Goldstone modes; global theorem retained in its domain."},{"id":"R-STUECKELBERG-MASS","label":"STUECKELBERG MASS","what":"The 1938 Stueckelberg construction that introduces an additional compensating scalar degree of freedom so an Abelian vector field can be massive while retaining a gauge-like redundancy.","period":"1938.","limitation":"Straightforward non-Abelian extensions did not provide the economical electroweak symmetry-breaking structure later supplied by the BEH mechanism.","outcome":"Retained in appropriate Abelian and effective theories; incomplete as the observed weak-interaction mechanism."}],"assets":[{"id":"A-GAUGE-SYMMETRY","label":"organizes interactions","detail":"organizes interactions."},{"id":"A-SPONTANEOUS-BREAKING","label":"symmetric law, asymmetric ground state","detail":"symmetric law, asymmetric ground state."},{"id":"A-GOLDSTONE","label":"broken global continuous symmetry produces massless modes","detail":"broken global continuous symmetry produces massless modes."},{"id":"A-WEAK-RANGE","label":"implies heavy mediators","detail":"implies heavy mediators."}],"timeSlices":[{"id":"TS-GAUGE-MASSLESS","period":"1950s","label":"Explicit gauge-boson mass breaks gauge structure","detail":"Explicit gauge-boson mass breaks gauge structure — Weak force needs massive mediator"},{"id":"TS-GLOBAL-SSB","period":"Early 1960s","label":"Spontaneous breaking yields massless Goldstone bosons","detail":"Spontaneous breaking yields massless Goldstone bosons — Gauge case reexamined"},{"id":"TS-1964-PAPERS","period":"1964","label":"Gauge field absorbs Goldstone mode","detail":"Gauge field absorbs Goldstone mode — Massive vector theory possible"},{"id":"TS-ELECTROWEAK","period":"1967 onward","label":"Mechanism embedded in SU(2)_L\\times U(1)_Y","detail":"Mechanism embedded in SU(2)_L\\times U(1)_Y — Renormalizable theory built"},{"id":"TS-HIGGS-DISCOVERY","period":"2012","label":"Scalar resonance observed","detail":"Scalar resonance observed — Mechanism's particle signature confirmed"}],"patterns":[{"id":"P-01","detail":"Symmetry, vacuum structure, and particle mass unified"},{"id":"P-02","detail":"Vacuum expectation value generates masses and couplings"},{"id":"P-03","detail":"Explicit mass reframed as vacuum-state effect"},{"id":"P-04","detail":"Nonempty symmetry-breaking vacuum accepted"},{"id":"P-05","detail":"Gauge symmetry retained rather than discarded"},{"id":"P-06","detail":"Boson masses and scalar couplings provide tests"}],"explicitEdges":[{"source":"A-WEAK-RANGE","relation":"requires","target":"MASSIVE-WEAK-BOSONS"},{"source":"R-EXPLICIT-VECTOR-MASS","relation":"conflicts-with","target":"A-GAUGE-SYMMETRY"},{"source":"A-SPONTANEOUS-BREAKING","relation":"contributes-to","target":"D-BEH-MECHANISM-1964"},{"source":"A-GOLDSTONE","relation":"reframed-by","target":"GAUGE-FIELD-ABSORPTION"},{"source":"VACUUM-EXPECTATION-VALUE","relation":"generates","target":"W-Z-MASSES"},{"source":"VACUUM-EXPECTATION-VALUE","relation":"with-Yukawa-generates","target":"FERMION-MASSES"},{"source":"D-BEH-MECHANISM-1964","relation":"contributes-to","target":"D-ELECTROWEAK"},{"source":"V-HIGGS-BOSON","relation":"supports","target":"D-BEH-MECHANISM-1964"},{"source":"D-BEH-MECHANISM-1964","relation":"instantiates","target":"P-03"}],"sourceCount":5,"wordCount":1811},{"file":"fundamental_physics_discoveries/37_bells_theorem.md","id":"D-BELL-THEOREM-1964","title":"Bell's Theorem","date":"November 1964 publication","year":1964.9,"era":"Postwar synthesis","category":"Quantum & radiation","domain":"Quantum correlations, locality, and hidden-variable constraints","contributors":"John Bell; experimental development by Clauser, Aspect, Zeilinger and many others","status":"Bell-inequality violations are established; interpretation of quantum ontology remains open","mainline":false,"claim":"Bell showed that correlations satisfying specified local-causal factorization and auxiliary assumptions obey inequalities that quantum mechanics can violate. Experiments agree with quantum violations. The conclusion is not simply “faster-than-light messaging”: quantum correlations do not by themselves permit controllable superluminal signaling.","pathways":[{"id":"R-LOCAL-HIDDEN-VARIABLE-COMPLETION","label":"LOCAL HIDDEN VARIABLE COMPLETION","what":"A completion of quantum mechanics in which an underlying state \\lambda supplies the missing outcome probabilities or values, and joint results at separated detectors factor into local responses to their own settings.","period":"1935–1964.","limitation":"Must satisfy Bell inequalities violated by quantum correlations and experiments.","outcome":"This model class is excluded, not every realist or hidden-variable interpretation."},{"id":"R-BOHMIAN-NONLOCAL-COMPLETION","label":"BOHMIAN NONLOCAL COMPLETION","what":"A deterministic hidden-variable theory with particle configurations guided by a nonlocal wavefunction.","period":"1952.","limitation":"","outcome":"Empirically viable; not part of the excluded local class."}],"assets":[{"id":"A-ENTANGLEMENT","label":"nonfactorizable joint states","detail":"nonfactorizable joint states."},{"id":"A-EPR","label":"locality/completeness dilemma","detail":"locality/completeness dilemma."},{"id":"A-PROBABILITY","label":"conditional factorization","detail":"conditional factorization."},{"id":"A-POLARIZATION-CORRELATION","label":"tunable measurements","detail":"tunable measurements."},{"id":"A-RANDOM-SETTINGS","label":"limits common-cause coordination","detail":"limits common-cause coordination."}],"timeSlices":[{"id":"TS-EPR","period":"1935","label":"Entanglement used to argue quantum incompleteness","detail":"Entanglement used to argue quantum incompleteness — Local hidden values considered"},{"id":"TS-BOHM","period":"1952","label":"Explicit nonlocal hidden-variable theory","detail":"Explicit nonlocal hidden-variable theory — Hidden variables shown possible but nonlocal"},{"id":"TS-BELL","period":"1964","label":"Local-causal models constrained mathematically","detail":"Local-causal models constrained mathematically — Metaphysical debate becomes experimental"},{"id":"TS-CHSH","period":"1969","label":"Experiment-friendly inequality","detail":"Experiment-friendly inequality — Optical tests designed"},{"id":"TS-EXPERIMENTS","period":"1970s–2015","label":"Increasing loophole control","detail":"Increasing loophole control — Violations repeatedly observed"}],"patterns":[{"id":"P-01","detail":"Foundations and laboratory correlations unified"},{"id":"P-02","detail":"Local assumptions generate an inequality"},{"id":"P-03","detail":"Interpretation dispute reframed as a statistical test"},{"id":"P-04","detail":"Nonclassical correlations accepted"},{"id":"P-05","detail":"Relativistic no-signaling retained"},{"id":"P-06","detail":"Inequality violation makes assumptions experimentally vulnerable"}],"explicitEdges":[{"source":"A-EPR","relation":"motivates","target":"R-LOCAL-HIDDEN-VARIABLE-COMPLETION"},{"source":"A-ENTANGLEMENT","relation":"contributes-to","target":"D-BELL-THEOREM-1964"},{"source":"LOCAL-FACTORIZATION","relation":"implies","target":"CHSH-BOUND-TWO"},{"source":"QUANTUM-MECHANICS","relation":"predicts","target":"CHSH-UP-TO-TWO-SQRT-TWO"},{"source":"V-BELL-EXPERIMENTS","relation":"violate","target":"CHSH-BOUND-TWO"},{"source":"V-BELL-EXPERIMENTS","relation":"exclude","target":"R-LOCAL-HIDDEN-VARIABLE-COMPLETION"},{"source":"NO-SIGNALING","relation":"compatible-with","target":"QUANTUM-CORRELATIONS"},{"source":"D-BELL-THEOREM-1964","relation":"instantiates","target":"P-03"}],"sourceCount":3,"wordCount":1592},{"file":"fundamental_physics_discoveries/36_cosmic_microwave_background.md","id":"D-CMB-1964-1965","title":"Cosmic Microwave Background","date":"1964 observation; 1965 publication and interpretation","year":1965.5,"era":"Postwar synthesis","category":"Cosmos & spacetime","domain":"Early-universe relic radiation","contributors":"Arno Penzias, Robert Wilson; theoretical prediction by Alpher, Herman, Gamow and later analysis by Dicke, Peebles, Roll, Wilkinson and others","status":"CMB is a near-perfect black-body relic from the hot early universe with measured anisotropies","mainline":false,"claim":"An approximately isotropic microwave background discovered as excess antenna temperature matched predictions of relic radiation from a hot early universe. Its spectrum and anisotropies turned cosmology into precision inference about cosmic contents, geometry, and initial fluctuations.","pathways":[{"id":"R-RECEIVER-THERMAL-NOISE","label":"RECEIVER THERMAL NOISE","what":"The specific hypothesis that internal electronics and thermal components generate the excess antenna temperature.","period":"1964 pre-publication control hypothesis.","limitation":"","outcome":"Calibration left a stable residual."},{"id":"R-GROUND-ATMOSPHERE-PICKUP","label":"GROUND ATMOSPHERE PICKUP","what":"The hypothesis that sidelobes, ground emission, or atmospheric microwaves create the excess.","period":"1964 pre-publication control hypothesis.","limitation":"","outcome":"Directional, seasonal, and instrumental checks reject it as the monopole."},{"id":"R-GALACTIC-RADIO-FOREGROUND","label":"GALACTIC RADIO FOREGROUND","what":"The hypothesis that unresolved Galactic or extragalactic radio emission accounts for the nearly uniform background.","period":"1964 pre-publication control hypothesis.","limitation":"","outcome":"Frequency and sky dependence cannot reproduce the black-body monopole."},{"id":"R-STEADY-STATE-NO-PRIMORDIAL-RELIC","label":"STEADY STATE NO PRIMORDIAL RELIC","what":"The pre-1965 steady-state cosmology in which the universe has no hot, dense beginning and therefore supplies no primordial thermal relic corresponding to the later CMB interpretation.","period":"1948–1964.","limitation":"A near-isotropic thermal microwave background was naturally predicted by hot-universe calculations but had no comparably specific pre-discovery origin in the steady-state model.","outcome":"The no-primordial-relic pathway was rejected; later post-discovery steady-state thermalization repairs belong to the subsequent-response narrative, not this predecessor section."}],"assets":[{"id":"A-HOT-BIG-BANG","label":"early thermal plasma","detail":"early thermal plasma."},{"id":"A-MICROWAVE-RADIOMETRY","label":"calibrated antenna temperature","detail":"calibrated antenna temperature."},{"id":"A-BLACKBODY","label":"spectral prediction","detail":"spectral prediction."},{"id":"A-RECOMBINATION","label":"photon decoupling","detail":"photon decoupling."},{"id":"A-ANGULAR-SPECTRUM","label":"statistical map analysis","detail":"statistical map analysis."}],"timeSlices":[{"id":"TS-HOT-BIG-BANG-PREDICTION","period":"1940s","label":"Relic radiation estimated","detail":"Relic radiation estimated — Prediction not widely operationalized"},{"id":"TS-RADIO-ANTENNA","period":"1964","label":"Persistent excess noise found","detail":"Persistent excess noise found — Instrumental/environmental causes tested"},{"id":"TS-PRINCETON-CONNECTION","period":"1965","label":"Excess linked to cosmological prediction","detail":"Excess linked to cosmological prediction — Discovery papers published jointly in context"},{"id":"TS-COBE","period":"1989–1992","label":"Black-body spectrum and anisotropy measured","detail":"Black-body spectrum and anisotropy measured — Precision cosmology begins"},{"id":"TS-WMAP-PLANCK","period":"2001 onward","label":"Full-sky spectra measured precisely","detail":"Full-sky spectra measured precisely — Cosmological parameters tightly constrained"}],"patterns":[{"id":"P-01","detail":"Radio noise, thermodynamics, and cosmic history unified"},{"id":"P-02","detail":"Expansion and recombination generate spectrum and anisotropies"},{"id":"P-03","detail":"Instrumental noise reframed as relic signal"},{"id":"P-04","detail":"Observable fossil radiation from early universe accepted"},{"id":"P-05","detail":"Black-body physics retained on cosmological scales"},{"id":"P-06","detail":"Spectrum and angular power provide quantitative tests"}],"explicitEdges":[{"source":"A-HOT-BIG-BANG","relation":"predicts","target":"RELIC-RADIATION"},{"source":"A-MICROWAVE-RADIOMETRY","relation":"detects","target":"EXCESS-ANTENNA-TEMPERATURE"},{"source":"R-LOCAL-NOISE","relation":"tested-against","target":"EXCESS-ANTENNA-TEMPERATURE"},{"source":"EXCESS-ANTENNA-TEMPERATURE","relation":"identified-as","target":"D-CMB-1964-1965"},{"source":"V-COBE-SPECTRUM","relation":"validates","target":"CMB-BLACKBODY"},{"source":"V-CMB-ANISOTROPY","relation":"supports","target":"STRUCTURE-SEEDS"},{"source":"D-CMB-1964-1965","relation":"supports","target":"HOT-EXPANDING-UNIVERSE"},{"source":"D-CMB-1964-1965","relation":"instantiates","target":"P-03"}],"sourceCount":5,"wordCount":1945},{"file":"fundamental_physics_discoveries/52_wilsonian_renormalization_group.md","id":"D-WILSON-RG-1971","title":"Wilsonian Renormalization Group and Universality","date":"November 1971 Wilson renormalization-group papers","year":1971.83,"era":"Postwar synthesis","category":"Quantum & radiation","domain":"Critical phenomena, quantum field theory, scale dependence, universality, and many-body physics","contributors":"Kenneth Wilson; with essential antecedents from Kadanoff, Fisher, Widom, Gell-Mann, Low, Stueckelberg, Petermann and others","status":"Foundational and broadly validated framework; exact flows are rarely solvable and practical calculations require controlled truncations or numerical methods","mainline":false,"claim":"Wilson recast renormalization as the transformation of an entire theory when short-distance degrees of freedom are successively averaged out. Couplings flow through a space of possible theories; fixed points describe scale-invariant behavior; relevant, irrelevant, and marginal directions determine which microscopic details survive at long distances. This explains why microscopically different systems share critical exponents and why coarse-scale laws can be insensitive to most short-scale details.","pathways":[{"id":"R-LANDAU-MEAN-FIELD-EXACT-CRITICALITY","label":"LANDAU MEAN FIELD EXACT CRITICALITY","what":"The treatment of a Landau order parameter as a spatially uniform average whose saddle-point solution gives the exact asymptotic critical exponents, effectively neglecting correlated fluctuations on all length scales.","period":"1937–1960s.","limitation":"Three-dimensional fluids and magnets exhibit non-mean-field exponents, while two-dimensional exact results differ sharply.","outcome":"Retained as a fixed-point/saddle approximation with a known domain, superseded as universal exact critical theory."},{"id":"R-MICROSCOPIC-DETAIL-DETERMINES-CRITICAL-EXPONENT","label":"MICROSCOPIC DETAIL DETERMINES CRITICAL EXPONENT","what":"The expectation that each material's lattice spacing, molecular forces, chemical composition, and short-range potential determine its own independent set of critical exponents.","period":"nineteenth century–1960s.","limitation":"Very different fluids and magnets share the same exponent sets when dimension, symmetry, and interaction range agree.","outcome":"Superseded for universal critical exponents; retained for nonuniversal quantities."},{"id":"R-SCALING-HYPOTHESIS-WITHOUT-FLOW","label":"SCALING HYPOTHESIS WITHOUT FLOW","what":"A phenomenological assumption that the singular free energy is a generalized homogeneous function, yielding power laws and exponent relations without a dynamical transformation explaining the scaling function or calculating exponent values.","period":"1959–1970.","limitation":"It does not explain which systems share a universality class, why scale invariance emerges, or how to compute the exponents.","outcome":"Absorbed as the fixed-point consequence of RG."},{"id":"R-PERTURBATIVE-RENORMALIZATION-AS-SUBTRACTION-ONLY","label":"PERTURBATIVE RENORMALIZATION AS SUBTRACTION ONLY","what":"A view of renormalization primarily as a technical procedure that removes ultraviolet divergences by redefining masses, fields, and couplings, without treating the cutoff and scale transformation as physical information about which operators matter.","period":"late 1940s–1960s.","limitation":"The view does not explain critical universality or why nonrenormalizable interactions can be systematically harmless at low energy.","outcome":"Subsumed as a perturbative implementation of the wider scale-flow framework."}],"assets":[{"id":"A-LANDAU-GINZBURG","label":"symmetry-constrained order-parameter functional","detail":"symmetry-constrained order-parameter functional."},{"id":"A-CRITICAL-EXPONENTS","label":"measured power laws and scaling relations","detail":"measured power laws and scaling relations."},{"id":"A-KADANOFF-BLOCKS","label":"real-space coarse-graining intuition","detail":"real-space coarse-graining intuition."},{"id":"A-QFT-RENORMALIZATION","label":"running parameters and ultraviolet regularization","detail":"running parameters and ultraviolet regularization."},{"id":"A-FOURIER-SCALES","label":"momentum shells separate short and long distances","detail":"momentum shells separate short and long distances."},{"id":"A-UNIVERSALITY-DATA","label":"shared exponent sets across different materials","detail":"shared exponent sets across different materials."}],"timeSlices":[{"id":"TS-QED-RG","period":"1940s–1950s","label":"Renormalized parameters depend on scale","detail":"Renormalized parameters depend on scale — Differential scale equations organize high-energy logarithms"},{"id":"TS-SCALING","period":"1959–1965","label":"Critical data follow power laws and scaling relations","detail":"Critical data follow power laws and scaling relations — Universality becomes an empirical target"},{"id":"TS-KADANOFF","period":"1966","label":"Explain scaling using blocks of spins","detail":"Explain scaling using blocks of spins — Coarse-graining is linked qualitatively to criticality"},{"id":"TS-WILSON","period":"1971","label":"Make coarse-graining quantitative across coupling space","detail":"Make coarse-graining quantitative across coupling space — Fixed points and eigenoperators calculate exponents"},{"id":"TS-EPSILON-NRG","period":"1972 onward","label":"Compute non-mean-field behavior and strong-coupling problems","detail":"Compute non-mean-field behavior and strong-coupling problems — \\epsilon-expansion and numerical RG validate the architecture"}],"patterns":[{"id":"P-01","detail":"Critical phenomena, QFT renormalization, and coarse-graining share one scale-flow language"},{"id":"P-02","detail":"Empirical power laws become consequences of fixed points and eigenvalues"},{"id":"P-03","detail":"“Which microscopic model is exact?” becomes “Which basin of attraction and relevant variables control the regime?”"},{"id":"P-04","detail":"A flowing theory in an infinite-dimensional coupling space is accepted"},{"id":"P-05","detail":"Landau functionals, scaling hypotheses, and beta functions survive as components"},{"id":"P-06","detail":"Critical exponents, crossover functions, and running couplings quantitatively test flows"}],"explicitEdges":[{"source":"A-KADANOFF-BLOCKS","relation":"inspires","target":"D-WILSON-RG-1971"},{"source":"A-QFT-RENORMALIZATION","relation":"contributes-to","target":"D-WILSON-RG-1971"},{"source":"D-WILSON-RG-1971","relation":"integrates-out","target":"SHORT-DISTANCE-MODES"},{"source":"RG-FIXED-POINT","relation":"generates","target":"SCALE-INVARIANCE"},{"source":"IRRELEVANT-OPERATOR","relation":"loses-influence-at","target":"FIXED-POINT"},{"source":"RELEVANT-OPERATOR","relation":"controls","target":"DEPARTURE-FROM-CRITICALITY"},{"source":"D-WILSON-RG-1971","relation":"explains","target":"UNIVERSALITY-CLASSES"},{"source":"D-WILSON-RG-1971","relation":"instantiates","target":"P-03"}],"sourceCount":4,"wordCount":2173},{"file":"fundamental_physics_discoveries/39_quantum_chromodynamics.md","id":"D-QCD-1973","title":"Quantum Chromodynamics","date":"1973 asymptotic-freedom formulation","year":1973.5,"era":"Postwar synthesis","category":"Nuclear & particles","domain":"Strong interaction of quarks and gluons","contributors":"Fritzsch, Gell-Mann, Leutwyler, Gross, Wilczek, Politzer and many others","status":"Fundamental Standard Model gauge theory of the strong interaction","mainline":true,"claim":"QCD is a non-Abelian SU(3)_c gauge theory in which quarks carry color and gluons themselves carry color charge. Its coupling weakens at short distance— asymptotic freedom—while confinement dominates at long distance.","pathways":[{"id":"R-STRONG-COUPLING-AT-ALL-SCALES","label":"STRONG COUPLING AT ALL SCALES","what":"A scale-independent picture in which the quark interaction remains intrinsically large at both long and arbitrarily short distances, with no weakening at high momentum transfer.","period":"1950s–1960s.","limitation":"Deep-inelastic scattering shows near-free short-distance behavior.","outcome":"Replaced by running coupling."},{"id":"R-ABELIAN-COLOR-FORCE","label":"ABELIAN COLOR FORCE","what":"A QED-like color theory whose gauge bosons do not themselves carry color charge and therefore lack the non-Abelian gluon self-interactions of SU(3)_c.","period":"1960s–early 1970s.","limitation":"Does not naturally yield gluon self-interaction and asymptotic freedom needed by data.","outcome":"Replaced by non-Abelian SU(3)."},{"id":"R-HADRONIC-BOOTSTRAP","label":"HADRONIC BOOTSTRAP","what":"“Nuclear democracy” in which no hadron is fundamental and the hadron S-matrix self-consistently generates resonances without quark/gluon constituents.","period":"late 1950s–1960s.","limitation":"","outcome":"S-matrix methods retained, but DIS and jets favor quark/gluon fields."},{"id":"R-PARTON-MODEL-WITHOUT-DYNAMICS","label":"PARTON MODEL WITHOUT DYNAMICS","what":"A kinematic picture of nearly free pointlike constituents inside fast hadrons without a specified gauge interaction governing their radiation and scale dependence.","period":"1969.","limitation":"","outcome":"Retained as leading intuition; completed by QCD evolution."}],"assets":[{"id":"A-QUARKS","label":"fractional-charge constituents","detail":"fractional-charge constituents."},{"id":"A-COLOR","label":"three-valued gauge charge","detail":"three-valued gauge charge."},{"id":"A-YANG-MILLS","label":"non-Abelian gauge fields","detail":"non-Abelian gauge fields."},{"id":"A-SCALING","label":"parton behavior","detail":"parton behavior."},{"id":"A-RENORMALIZATION-GROUP","label":"scale-dependent couplings","detail":"scale-dependent couplings."}],"timeSlices":[{"id":"TS-QUARK-MODEL","period":"1964","label":"Hadron multiplets explained","detail":"Hadron multiplets explained — Dynamics absent"},{"id":"TS-COLOR","period":"1964–1965","label":"Extra quantum number resolves statistics","detail":"Extra quantum number resolves statistics — Three colors proposed"},{"id":"TS-PARTONS","period":"Late 1960s","label":"Deep-inelastic scaling","detail":"Deep-inelastic scaling — Short-distance constituents appear free"},{"id":"TS-NONABELIAN","period":"Early 1970s","label":"Color gauge theory formulated","detail":"Color gauge theory formulated — Gluons mediate force"},{"id":"TS-ASYMPTOTIC-FREEDOM","period":"1973","label":"Negative beta function derived","detail":"Negative beta function derived — Scaling behavior explained"},{"id":"TS-JETS-LATTICE","period":"1970s onward","label":"Gluon jets and numerical QCD","detail":"Gluon jets and numerical QCD — Precision strong-interaction program"}],"patterns":[{"id":"P-01","detail":"Quarks, partons, color, and strong force unified"},{"id":"P-02","detail":"Gauge dynamics generates running coupling and jets"},{"id":"P-03","detail":"Strong confinement reframed as scale-dependent interaction"},{"id":"P-04","detail":"Self-interacting gauge bosons accepted"},{"id":"P-05","detail":"Quark model retained as low-energy structure"},{"id":"P-06","detail":"Scaling violations and jet shapes quantitatively test QCD"}],"explicitEdges":[{"source":"A-QUARKS","relation":"contributes-to","target":"D-QCD-1973"},{"source":"A-COLOR","relation":"defines","target":"SU3C"},{"source":"A-YANG-MILLS","relation":"enables","target":"D-QCD-1973"},{"source":"GLUON-SELF-INTERACTION","relation":"causes","target":"ASYMPTOTIC-FREEDOM"},{"source":"ASYMPTOTIC-FREEDOM","relation":"explains","target":"A-SCALING"},{"source":"D-QCD-1973","relation":"supersedes","target":"R-ABELIAN-COLOR-FORCE"},{"source":"V-THREE-JET","relation":"supports","target":"GLUON"},{"source":"LATTICE-QCD","relation":"tests-nonperturbatively","target":"D-QCD-1973"},{"source":"D-QCD-1973","relation":"instantiates","target":"P-03"}],"sourceCount":4,"wordCount":1721},{"file":"fundamental_physics_discoveries/38_electroweak_theory.md","id":"D-ELECTROWEAK-1961-1973","title":"Electroweak Theory","date":"1961–1973 (gauge proposal through neutral-current discovery)","year":1973.8,"era":"Postwar synthesis","category":"Fields & symmetry","domain":"Unified electromagnetic and weak interactions","contributors":"Sheldon Glashow, Abdus Salam, Steven Weinberg; essential work by 't Hooft, Veltman and many experimentalists","status":"Core, precisely tested sector of the Standard Model","mainline":true,"claim":"Electromagnetism and the weak interaction arise from one SU(2)_L\\times U(1)_Y gauge structure whose vacuum is broken to U(1)_{\\mathrm{em}}. The theory predicted neutral weak currents and massive W^\\pm,Z^0 bosons while leaving the photon massless.","pathways":[{"id":"R-FERMI-FUNDAMENTAL-CONTACT","label":"FERMI FUNDAMENTAL CONTACT","what":"A theory that treats weak beta decay as a fundamental pointlike four-fermion interaction with coupling G_F, rather than as the low-energy effect of exchanging a massive W boson.","period":"1934.","limitation":"Amplitudes grow and violate unitarity at high energy.","outcome":"Reinterpreted as low-energy W-exchange limit."},{"id":"R-EXPLICIT-MASSIVE-YANG-MILLS","label":"EXPLICIT MASSIVE YANG MILLS","what":"A non-Abelian weak gauge theory with W/Z mass terms inserted directly rather than generated by a symmetry-breaking vacuum.","period":"1950s.","limitation":"","outcome":"High-energy consistency fails; massive phenomenology retained effectively."},{"id":"R-CHARGED-INTERMEDIATE-BOSON-ONLY","label":"CHARGED INTERMEDIATE BOSON ONLY","what":"A weak-mediator theory containing charged-current W-like exchange but no neutral weak current or unified photon–Z mixing.","period":"1950s–1960s.","limitation":"","outcome":"Neutral-current discovery superseded it."}],"assets":[{"id":"A-QED-GAUGE","label":"successful Abelian gauge theory","detail":"successful Abelian gauge theory."},{"id":"A-V-A","label":"chiral weak current","detail":"chiral weak current."},{"id":"A-HIGGS-MECHANISM","label":"gauge-compatible vector masses","detail":"gauge-compatible vector masses."},{"id":"A-NONABELIAN-RENORMALIZATION","label":"quantum consistency","detail":"quantum consistency."},{"id":"A-NEUTRINO-BEAMS","label":"weak-process probe","detail":"weak-process probe."}],"timeSlices":[{"id":"TS-FERMI-WEAK","period":"1930s","label":"Contact interaction explains beta decay","detail":"Contact interaction explains beta decay — High-energy inconsistency"},{"id":"TS-PARITY","period":"1957","label":"Weak interaction found chiral","detail":"Weak interaction found chiral — Left-handed structure required"},{"id":"TS-GLASHOW","period":"1961","label":"SU(2)\\times U(1) gauge structure","detail":"SU(2)\\times U(1) gauge structure — Neutral current anticipated"},{"id":"TS-WEINBERG-SALAM","period":"1967–1968","label":"Higgs mechanism added","detail":"Higgs mechanism added — Masses compatible with gauge theory"},{"id":"TS-RENORMALIZABILITY","period":"1971–1972","label":"'t Hooft and Veltman establish consistency","detail":"'t Hooft and Veltman establish consistency — Predictive quantum theory"},{"id":"TS-VALIDATION","period":"1973–1983","label":"Neutral currents, W, Z observed","detail":"Neutral currents, W, Z observed — Unification confirmed"}],"patterns":[{"id":"P-01","detail":"Electromagnetic and weak forces unified"},{"id":"P-02","detail":"Gauge structure generates particles and couplings"},{"id":"P-03","detail":"Contact force reframed as heavy-boson exchange"},{"id":"P-04","detail":"Chiral gauge symmetry and broken vacuum accepted"},{"id":"P-05","detail":"QED and Fermi theory retained as sectors/limits"},{"id":"P-06","detail":"Neutral currents and boson masses were risky predictions"}],"explicitEdges":[{"source":"A-QED-GAUGE","relation":"contributes-to","target":"D-ELECTROWEAK-1961-1973"},{"source":"A-V-A","relation":"constrains","target":"SU2L-STRUCTURE"},{"source":"A-HIGGS-MECHANISM","relation":"generates","target":"W-Z-MASSES"},{"source":"R-FERMI-FUNDAMENTAL-CONTACT","relation":"reframed-as","target":"LOW-ENERGY-W-EXCHANGE"},{"source":"D-ELECTROWEAK-1961-1973","relation":"predicts","target":"NEUTRAL-CURRENT"},{"source":"D-ELECTROWEAK-1961-1973","relation":"predicts","target":"W-Z-BOSONS"},{"source":"V-NEUTRAL-CURRENT","relation":"validates","target":"D-ELECTROWEAK-1961-1973"},{"source":"V-W-Z-DISCOVERY","relation":"validates","target":"D-ELECTROWEAK-1961-1973"},{"source":"D-ELECTROWEAK-1961-1973","relation":"instantiates","target":"P-01"}],"sourceCount":5,"wordCount":1655},{"file":"fundamental_physics_discoveries/53_effective_field_theory.md","id":"D-MODERN-EFT-1979","title":"Effective Field Theory and Scale Separation","date":"1979 Weinberg phenomenological-Lagrangian synthesis","year":1979.25,"era":"Postwar synthesis","category":"Quantum & radiation","domain":"Low-energy quantum field theory, scale separation, power counting, matching, and controlled approximation","contributors":"Kenneth Wilson, Steven Weinberg, Howard Georgi and many precursors and later developers","status":"General framework for predictive domain-bounded theories; success depends on a scale hierarchy, correct low-energy degrees of freedom, symmetries, and systematic power counting","mainline":false,"claim":"Effective field theory states that low-energy predictions need not await an ultimate microscopic theory. One writes the most general local interactions of the degrees of freedom accessible at scale E, constrained by symmetries, and orders them by powers of E/\\Lambda, where \\Lambda is the scale of omitted physics. Wilsonian coarse-graining explains why high-energy details enter through coefficients and suppressed operators; Weinberg's 1979 phenomenological-Lagrangian argument made this a systematic calculational doctrine for low-energy particle physics. EFT turns a theory's limited domain from a defect into quantified predictive structure.","pathways":[{"id":"R-NONRENORMALIZABLE-MEANS-NONPREDICTIVE","label":"NONRENORMALIZABLE MEANS NONPREDICTIVE","what":"The doctrine that a quantum field theory containing couplings of negative mass dimension is unacceptable because loop calculations require infinitely many counterterms, so only power-counting-renormalizable interactions can define any predictive theory.","period":"late 1940s–1960s.","limitation":"Fermi weak theory and pion interactions are predictive at low energy despite nonrenormalizable operators, if one truncates consistently in E/\\Lambda.","outcome":"Superseded as a universal rejection rule; retained as a clue about ultraviolet behavior and operator importance."},{"id":"R-ONE-PHENOMENOLOGICAL-VERTEX","label":"ONE PHENOMENOLOGICAL VERTEX","what":"The use of one contact interaction or fitted vertex chosen to reproduce leading data, without including every operator of the same order allowed by the symmetries or estimating omitted terms.","period":"1934–1970s.","limitation":"Loops generate additional symmetry-allowed operators, and arbitrary omissions prevent systematic uncertainty estimates.","outcome":"Replaced by order-by-order complete EFT, retained as the leading term when justified."},{"id":"R-UV-COMPLETION-FIRST","label":"UV COMPLETION FIRST","what":"A research policy that no trustworthy low-energy prediction should be made until the exact fundamental high-energy constituents and dynamics are known.","period":"reductionist programs through the 1970s.","limitation":"Scale separation often makes low-energy observables insensitive to most UV details, and waiting would discard testable symmetry consequences.","outcome":"Rejected as a prerequisite; UV completion remains valuable but not necessary for low-energy prediction."},{"id":"R-HARD-CUTOFF-AS-LITERAL-MICROPHYSICS","label":"HARD CUTOFF AS LITERAL MICROPHYSICS","what":"The insertion of a momentum cutoff into loop integrals and identification of that regulator itself with a physical particle size or exact new-physics boundary, without ensuring regulator-independent low-energy observables.","period":"1930s–1960s.","limitation":"Predictions can depend on cutoff shape or symmetry violation unless counterterms and matching remove unphysical regulator dependence.","outcome":"Superseded as a universal literal interpretation; retained as one regularization or physical coarse-graining tool."}],"assets":[{"id":"A-FERMI-THEORY","label":"successful low-energy four-fermion weak interaction","detail":"successful low-energy four-fermion weak interaction."},{"id":"A-CHIRAL-SYMMETRY","label":"low-energy constraints on pion interactions","detail":"low-energy constraints on pion interactions."},{"id":"A-WILSONIAN-RG","label":"integrating out modes and classifying operators","detail":"integrating out modes and classifying operators."},{"id":"A-DECOUPLING","label":"heavy particles affect low energies through suppressed local terms under suitable conditions","detail":"heavy particles affect low energies through suppressed local terms under suitable conditions."},{"id":"A-S-MATRIX","label":"observable amplitudes need not depend on field-coordinate choices","detail":"observable amplitudes need not depend on field-coordinate choices."},{"id":"A-DIMENSIONAL-ANALYSIS","label":"operator dimension organizes powers of a high scale","detail":"operator dimension organizes powers of a high scale."}],"timeSlices":[{"id":"TS-PRECURSOR-EFFECTIVE","period":"1930s–1950s","label":"Describe low-energy weak, electromagnetic, and nuclear phenomena without microscopic completion","detail":"Describe low-energy weak, electromagnetic, and nuclear phenomena without microscopic completion — Fermi, Euler–Heisenberg, and pion theories use approximate local interactions"},{"id":"TS-RENORMALIZABILITY-CRITERION","period":"1940s–1960s","label":"Control QFT divergences with finitely many parameters","detail":"Control QFT divergences with finitely many parameters — Nonrenormalizable terms are often treated as fundamental disqualifiers"},{"id":"TS-WILSON-SCALES","period":"1965–1971","label":"Understand how short-distance modes affect long-distance theory","detail":"Understand how short-distance modes affect long-distance theory — Integrating out and operator relevance reorganize renormalization"},{"id":"TS-WEINBERG-EFT","period":"1979","label":"Systematize low-energy strong-interaction amplitudes from symmetry","detail":"Systematize low-energy strong-interaction amplitudes from symmetry — General Lagrangians plus power expansion justify corrections"},{"id":"TS-MODERN-EFT","period":"1980s onward","label":"Apply matching and running across particle, nuclear, gravitational, and condensed-matter scales","detail":"Apply matching and running across particle, nuclear, gravitational, and condensed-matter scales — EFT becomes a standard discovery and uncertainty framework"}],"patterns":[{"id":"P-01","detail":"Low-energy phenomena, QFT, symmetry, and RG scale flow are unified"},{"id":"P-02","detail":"Phenomenological vertices become terms in a generative ordered operator expansion"},{"id":"P-03","detail":"“What is the ultimate theory?” becomes “What degrees of freedom and accuracy are required at this scale?”"},{"id":"P-04","detail":"Nonrenormalizable interactions and explicitly domain-bounded theories are accepted"},{"id":"P-05","detail":"Fermi theory, chiral relations, and renormalizable QFT survive as leading EFT layers"},{"id":"P-06","detail":"Power counting, matching, running, and truncation errors enable quantitative testing"}],"explicitEdges":[{"source":"A-WILSONIAN-RG","relation":"enables","target":"D-MODERN-EFT-1979"},{"source":"A-CHIRAL-SYMMETRY","relation":"constrains","target":"LOW-ENERGY-OPERATOR-BASIS"},{"source":"HEAVY-FIELD","relation":"is-integrated-out-into","target":"WILSON-COEFFICIENTS"},{"source":"POWER-COUNTING","relation":"orders","target":"EFT-PREDICTIONS"},{"source":"D-MODERN-EFT-1979","relation":"retains","target":"A-FERMI-THEORY"},{"source":"D-MODERN-EFT-1979","relation":"quantifies","target":"TRUNCATION-UNCERTAINTY"},{"source":"THRESHOLD","relation":"can-require","target":"NEW-EXPLICIT-DEGREE-OF-FREEDOM"},{"source":"D-MODERN-EFT-1979","relation":"instantiates","target":"P-03"}],"sourceCount":5,"wordCount":2339},{"file":"fundamental_physics_discoveries/40_standard_model.md","id":"D-STANDARD-MODEL-1970S","title":"The Standard Model of Particle Physics","date":"1973–1979 consolidation","year":1979.9,"era":"Postwar synthesis","category":"Cosmos & spacetime","domain":"Known elementary particles and nongravitational interactions","contributors":"Thousands of theorists and experimentalists across electroweak theory, QCD, flavor physics, and collider science","status":"Exceptionally successful effective fundamental theory; incomplete description of nature","mainline":true,"claim":"The Standard Model combines SU(3)_c QCD with SU(2)_L\\times U(1)_Y electroweak theory, matter fermions in three generations, and a Higgs field. It predicts a vast range of processes but excludes gravity and leaves major empirical and conceptual questions unresolved.","pathways":[{"id":"R-INDEPENDENT-PARTICLE-FORCES","label":"INDEPENDENT PARTICLE FORCES","what":"A patchwork description in which particle species and electromagnetic, weak, and strong processes are assigned separate phenomenological forces and conservation rules without a common gauge-field and representation structure.","period":"pre-1961 phenomenological patchwork.","limitation":"Lacks symmetry relations, conservation structures, and predictive cross-process coupling.","outcome":"Replaced by gauge fields and representations."},{"id":"R-ELEMENTARY-HADRON-ZOO-STANDARD-MODEL","label":"ELEMENTARY HADRON ZOO STANDARD MODEL","what":"Treating the many hadrons in the pre-quark catalogue as independent elementary matter fields inside a fundamental particle theory.","period":"1940s–1963.","limitation":"","outcome":"Quark flavor/color representations and QCD superseded it."},{"id":"R-FUNDAMENTAL-MESON-EXCHANGE-STRONG-FORCE","label":"FUNDAMENTAL MESON EXCHANGE STRONG FORCE","what":"Treating exchanged mesons as elementary fundamental carriers of all strong interactions rather than residual hadronic manifestations of QCD.","period":"1935–1960s.","limitation":"","outcome":"Retained for nuclear effective forces; superseded fundamentally by QCD."}],"assets":[{"id":"A-QFT","label":"fields, particles, amplitudes","detail":"fields, particles, amplitudes."},{"id":"A-GAUGE","label":"local symmetry","detail":"local symmetry."},{"id":"A-ELECTROWEAK","label":"SU(2)_L\\times U(1)_Y","detail":"SU(2)_L\\times U(1)_Y."},{"id":"A-QCD","label":"SU(3)_c","detail":"SU(3)_c."},{"id":"A-HIGGS","label":"symmetry breaking and Yukawa masses","detail":"symmetry breaking and Yukawa masses."},{"id":"A-FLAVOR-DATA","label":"generations and mixing","detail":"generations and mixing."}],"timeSlices":[{"id":"TS-QED","period":"1940s","label":"Renormalized gauge theory succeeds","detail":"Renormalized gauge theory succeeds — Gauge methods established"},{"id":"TS-QUARK-LEPTON","period":"1950s–1960s","label":"Particle families classified","detail":"Particle families classified — Matter content organized"},{"id":"TS-ELECTROWEAK","period":"1960s–1970s","label":"Weak and electromagnetic sectors unified","detail":"Weak and electromagnetic sectors unified — Chiral broken gauge theory"},{"id":"TS-QCD","period":"1973","label":"Strong force gauge theory validated","detail":"Strong force gauge theory validated — Color sector joins"},{"id":"TS-FLAVOR","period":"1970s–1990s","label":"Charm, bottom, top, tau discovered","detail":"Charm, bottom, top, tau discovered — Three generations completed"},{"id":"TS-HIGGS","period":"2012","label":"Scalar boson observed","detail":"Scalar boson observed — Minimal predicted content completed"}],"patterns":[{"id":"P-01","detail":"Known nongravitational particles and forces unified"},{"id":"P-02","detail":"Symmetries generate allowed interactions"},{"id":"P-03","detail":"Particle catalog reframed as field representations"},{"id":"P-04","detail":"Gauge fields, broken vacuum, and generations accepted"},{"id":"P-05","detail":"QED, weak theory, and QCD retained as sectors"},{"id":"P-06","detail":"Cross-section and precision fits enable overconstrained tests"}],"explicitEdges":[{"source":"A-QFT","relation":"framework-for","target":"D-STANDARD-MODEL-1970S"},{"source":"A-ELECTROWEAK","relation":"part-of","target":"D-STANDARD-MODEL-1970S"},{"source":"A-QCD","relation":"part-of","target":"D-STANDARD-MODEL-1970S"},{"source":"A-HIGGS","relation":"part-of","target":"D-STANDARD-MODEL-1970S"},{"source":"A-FLAVOR-DATA","relation":"constrains","target":"D-STANDARD-MODEL-1970S"},{"source":"D-STANDARD-MODEL-1970S","relation":"predicts","target":"W-Z-GLUON-HIGGS"},{"source":"V-NEUTRINO-OSCILLATION","relation":"limits","target":"R-MINIMAL-SM-WITH-MASSLESS-NEUTRINOS"},{"source":"QUANTUM-GRAVITY","relation":"outside-scope-of","target":"D-STANDARD-MODEL-1970S"},{"source":"D-STANDARD-MODEL-1970S","relation":"instantiates","target":"P-01"}],"sourceCount":4,"wordCount":1772},{"file":"fundamental_physics_discoveries/41_cosmic_inflation.md","id":"D-COSMIC-INFLATION-1980S","title":"Cosmic Inflation","date":"1981–1982 broad slow-roll/new-inflation formulation","year":1982.9,"era":"Contemporary physics","category":"Cosmos & spacetime","domain":"Very early universe and primordial perturbations","contributors":"Alexei Starobinsky, Alan Guth, Andrei Linde, Andreas Albrecht, Paul Steinhardt, Viatcheslav Mukhanov and others","status":"Broad inflationary paradigm is strongly supported indirectly; its field content and detailed mechanism are not established","mainline":false,"claim":"Inflation proposes a period of accelerated early expansion that dynamically enlarges a small causally connected region and converts quantum fluctuations into primordial density perturbations. It addresses horizon, flatness, and relic problems while making statistical predictions tested with the CMB.","pathways":[{"id":"R-OLD-INFLATION","label":"OLD INFLATION","what":"Guth's false-vacuum model in which the early universe remains temporarily trapped in a metastable high-energy state, expands exponentially, and exits through nucleated bubbles of a lower-energy phase.","period":"1980–1981.","limitation":"Bubble nucleation does not end smoothly enough.","outcome":"Replaced by slow-roll and other variants."},{"id":"R-UNEXPLAINED-SPECIAL-INITIAL-CONDITIONS","label":"UNEXPLAINED SPECIAL INITIAL CONDITIONS","what":"A non-dynamical cosmological account that takes the early universe's extreme homogeneity, near-flatness, and absence of unwanted relics as specially chosen initial boundary conditions.","period":"pre-1980 standard cosmological assumption.","limitation":"","outcome":"Not logically impossible, but inflation supplies a dynamical account."},{"id":"R-MIXMASTER-CHAOTIC-COSMOLOGY","label":"MIXMASTER CHAOTIC COSMOLOGY","what":"Misner's late-1960s Mixmaster/chaotic-cosmology program, which sought to erase primordial anisotropy and homogenize the universe through complex pre-expansion gravitational dynamics without an inflationary phase.","period":"1969.","limitation":"Dissipation and causal mixing were insufficient to generate the observed large-scale homogeneity under generic conditions.","outcome":"Superseded as the standard homogenization mechanism; anisotropic cosmological dynamics remains an active technical subject."}],"assets":[{"id":"A-GR-COSMOLOGY","label":"scale-factor dynamics","detail":"scale-factor dynamics."},{"id":"A-QFT-VACUUM","label":"field energy and fluctuations","detail":"field energy and fluctuations."},{"id":"A-CMB","label":"initial-condition probe","detail":"initial-condition probe."},{"id":"A-HORIZON-FLATNESS","label":"explanatory targets","detail":"explanatory targets."},{"id":"A-PHASE-TRANSITIONS","label":"early-universe field dynamics","detail":"early-universe field dynamics."}],"timeSlices":[{"id":"TS-HOT-BIG-BANG","period":"1960s–1970s","label":"Expansion and CMB established","detail":"Expansion and CMB established — Initial-condition puzzles remain"},{"id":"TS-STAROBINSKY","period":"1979–1980","label":"Curvature-driven accelerated solution","detail":"Curvature-driven accelerated solution — Early quasi-de Sitter phase"},{"id":"TS-GUTH","period":"1981","label":"False-vacuum inflation addresses puzzles","detail":"False-vacuum inflation addresses puzzles — Graceful-exit problem"},{"id":"TS-NEW-CHAOTIC","period":"1982–1983","label":"Slow-roll variants proposed","detail":"Slow-roll variants proposed — Exit and perturbations improved"},{"id":"TS-QUANTUM-PERTURBATIONS","period":"1980s","label":"Vacuum fluctuations stretched","detail":"Vacuum fluctuations stretched — Structure seeds predicted"},{"id":"TS-CMB-PRECISION","period":"1990s onward","label":"Spectrum measured","detail":"Spectrum measured — Many models constrained"}],"patterns":[{"id":"P-01","detail":"Particle fields, gravity, and cosmic initial conditions unified"},{"id":"P-02","detail":"Accelerated dynamics generates flatness and perturbations"},{"id":"P-03","detail":"Initial coincidences reframed as dynamical outcomes"},{"id":"P-04","detail":"Vacuum-like negative pressure accepted"},{"id":"P-05","detail":"Hot Big Bang retained after reheating"},{"id":"P-06","detail":"Spectral tilt, Gaussianity, curvature, and tensors test models"}],"explicitEdges":[{"source":"A-HORIZON-FLATNESS","relation":"motivates","target":"D-COSMIC-INFLATION-1980S"},{"source":"A-QFT-VACUUM","relation":"contributes-to","target":"INFLATON-DYNAMICS"},{"source":"NEGATIVE-PRESSURE","relation":"generates","target":"ACCELERATED-EXPANSION"},{"source":"ACCELERATED-EXPANSION","relation":"suppresses","target":"SPATIAL-CURVATURE"},{"source":"QUANTUM-FLUCTUATIONS","relation":"stretched-by","target":"ACCELERATED-EXPANSION"},{"source":"STRETCHED-FLUCTUATIONS","relation":"seed","target":"CMB-ANISOTROPY"},{"source":"R-OLD-INFLATION","relation":"superseded-by","target":"SLOW-ROLL-VARIANTS"},{"source":"D-COSMIC-INFLATION-1980S","relation":"instantiates","target":"P-02"}],"sourceCount":4,"wordCount":1740},{"file":"fundamental_physics_discoveries/42_accelerating_cosmic_expansion.md","id":"D-COSMIC-ACCELERATION-1998","title":"Accelerating Cosmic Expansion","date":"1998 supernova-team announcements","year":1998.8,"era":"Contemporary physics","category":"Cosmos & spacetime","domain":"Late-time cosmological expansion","contributors":"Supernova Cosmology Project, High-Z Supernova Search Team, and subsequent survey collaborations","status":"Acceleration is strongly established; physical nature of dark energy or required gravity modification remains unresolved","mainline":false,"claim":"High-redshift Type Ia supernovae appeared dimmer than expected in a matter-only decelerating universe, implying a larger luminosity distance and late-time accelerated expansion. Independent CMB, baryon-acoustic, clustering, and lensing data support a dark-energy-like component.","pathways":[{"id":"R-MATTER-ONLY-DECELERATION","label":"MATTER ONLY DECELERATION","what":"An FLRW cosmology whose late-time energy budget contains ordinary and dark matter but no dominant negative-pressure component or gravity modification, causing expansion to decelerate.","period":"pre-1998 baseline cosmology.","limitation":"","outcome":"Inconsistent with combined modern data."},{"id":"R-SUPERNOVA-LUMINOSITY-EVOLUTION","label":"SUPERNOVA LUMINOSITY EVOLUTION","what":"The hypothesis that high-redshift Type Ia supernovae have intrinsically different standardized luminosities because progenitor populations evolve.","period":"pre-1998 systematic concern.","limitation":"","outcome":"Remains a modeled systematic but cannot explain the full cross-probe acceleration signal."},{"id":"R-LENSING-SELECTION-DIMMING","label":"LENSING SELECTION DIMMING","what":"The hypothesis that lensing magnification distributions and magnitude-limited sample selection produce the apparent distance residual.","period":"pre-1998 survey-systematics framework.","limitation":"","outcome":"Corrected statistically; insufficient as the general cause."},{"id":"R-DYNAMICAL-DARK-ENERGY-OR-MODIFIED-GRAVITY","label":"DYNAMICAL DARK ENERGY OR MODIFIED GRAVITY","what":"Alternatives to a cosmological constant using a time-varying negative-pressure field or modified gravitational field equations.","period":"1917–1997 antecedent families.","limitation":"","outcome":"Viable families under test, not superseded."}],"assets":[{"id":"A-TYPE-IA","label":"standardizable candles","detail":"standardizable candles."},{"id":"A-REDSHIFT","label":"expansion marker","detail":"expansion marker."},{"id":"A-FLRW","label":"distance–history relation","detail":"distance–history relation."},{"id":"A-CMB-BAO","label":"independent geometry and ruler constraints","detail":"independent geometry and ruler constraints."},{"id":"A-LIGHT-CURVE","label":"luminosity standardization","detail":"luminosity standardization."}],"timeSlices":[{"id":"TS-EXPANDING","period":"1920s onward","label":"Cosmic expansion established","detail":"Cosmic expansion established — Deceleration expected from attractive matter"},{"id":"TS-SN-STANDARDIZATION","period":"1990s","label":"Type Ia light curves calibrated","detail":"Type Ia light curves calibrated — High-redshift distance probe"},{"id":"TS-1998-TEAMS","period":"1998–1999","label":"Distant supernovae found unexpectedly dim","detail":"Distant supernovae found unexpectedly dim — Acceleration inferred"},{"id":"TS-CONCORDANCE","period":"2000s","label":"CMB and large-scale structure combined","detail":"CMB and large-scale structure combined — Flat \\LambdaCDM favored"},{"id":"TS-PRECISION-DE","period":"Present","label":"Equation of state and gravity tested","detail":"Equation of state and gravity tested — Mechanism remains unknown"}],"patterns":[{"id":"P-01","detail":"Stellar explosions and global spacetime dynamics linked"},{"id":"P-02","detail":"Expansion models generate distance–redshift curves"},{"id":"P-03","detail":"Unexpected dimness reframed as acceleration"},{"id":"P-04","detail":"Negative-pressure cosmic component tolerated"},{"id":"P-05","detail":"General relativity and expansion retained with \\Lambda restored"},{"id":"P-06","detail":"Multiple geometric and growth probes cross-test the inference"}],"explicitEdges":[{"source":"A-TYPE-IA","relation":"measures","target":"LUMINOSITY-DISTANCE"},{"source":"A-REDSHIFT","relation":"indexes","target":"COSMIC-TIME"},{"source":"R-MATTER-ONLY-DECELERATION","relation":"predicts","target":"DISTANCE-REDSHIFT-CURVE"},{"source":"V-DIM-HIGH-Z-SUPERNOVAE","relation":"deviate-from","target":"DISTANCE-REDSHIFT-CURVE"},{"source":"V-DIM-HIGH-Z-SUPERNOVAE","relation":"supports","target":"D-COSMIC-ACCELERATION-1998"},{"source":"A-CMB-BAO","relation":"cross-validates","target":"D-COSMIC-ACCELERATION-1998"},{"source":"NEGATIVE-PRESSURE","relation":"can-generate","target":"COSMIC-ACCELERATION"},{"source":"D-COSMIC-ACCELERATION-1998","relation":"instantiates","target":"P-06"}],"sourceCount":4,"wordCount":1642},{"file":"fundamental_physics_discoveries/43_neutrino_oscillations.md","id":"D-NEUTRINO-OSCILLATIONS-1998-2002","title":"Neutrino Oscillations","date":"1998 atmospheric result; 2001–2002 solar flavor resolution","year":2002.5,"era":"Contemporary physics","category":"Nuclear & particles","domain":"Neutrino mass, flavor mixing, and propagation","contributors":"Super-Kamiokande and SNO collaborations; theoretical foundations from Pontecorvo, Maki, Nakagawa, Sakata, Wolfenstein, Mikheyev, Smirnov and others","status":"Oscillations establish nonzero neutrino mass differences and physics beyond the minimal massless-neutrino Standard Model","mainline":false,"claim":"Neutrinos produced in flavor states propagate as coherent superpositions of different mass states. Relative phases change with distance and energy, producing flavor conversion. Atmospheric and solar experiments established this through direction-, energy-, and flavor-sensitive deficits and appearance patterns.","pathways":[{"id":"R-SOLAR-MODEL-ERROR-ONLY","label":"SOLAR MODEL ERROR ONLY","what":"The hypothesis that the solar-neutrino deficit is entirely caused by incorrect solar temperatures, nuclear reaction rates, composition, transport modeling, or detector flux predictions, while neutrinos retain fixed flavor.","period":"1960s–1990s.","limitation":"Neutral-current total flux agrees with solar prediction while electron flavor is depleted.","outcome":"Superseded as full explanation."},{"id":"R-MASSLESS-UNMIXED-NEUTRINOS","label":"MASSLESS UNMIXED NEUTRINOS","what":"The minimal electroweak model in which all neutrinos have zero mass, flavor states coincide with propagation states, and a produced electron, muon, or tau neutrino cannot change flavor in flight.","period":"1970s minimal Standard Model.","limitation":"","outcome":"Rejected by oscillation patterns."},{"id":"R-DETECTOR-CALIBRATION-ONLY-NEUTRINO-DEFICIT","label":"DETECTOR CALIBRATION ONLY NEUTRINO DEFICIT","what":"The claim that cross-section, efficiency, background, or calibration errors common to neutrino detectors create the deficits.","period":"1960s–1990s.","limitation":"","outcome":"Multiple technologies and near/far designs reject a universal form."},{"id":"R-ATMOSPHERIC-FLUX-NORMALIZATION-ONLY","label":"ATMOSPHERIC FLUX NORMALIZATION ONLY","what":"The claim that cosmic-ray neutrino production is misnormalized but neutrino flavor is unchanged.","period":"1980s–1997.","limitation":"","outcome":"Zenith and L/E structure reject it."},{"id":"R-NEUTRINO-DECAY-OR-DECOHERENCE-ONLY","label":"NEUTRINO DECAY OR DECOHERENCE ONLY","what":"Disappearance caused by unstable neutrinos or loss of quantum coherence rather than mass-phase oscillation.","period":"1980s–2001.","limitation":"","outcome":"Simple forms constrained by oscillatory spectral and appearance evidence."},{"id":"R-STERILE-NEUTRINO-EXTENSION","label":"STERILE NEUTRINO EXTENSION","what":"An extension adding weak-singlet neutrino states that mix with active flavors and can cause additional short-baseline oscillations.","period":"1995–2001.","limitation":"","outcome":"Active, experiment-dependent, and globally tensioned—not generally superseded."}],"assets":[{"id":"A-FLAVOR-DETECTORS","label":"charged- and neutral-current sensitivity","detail":"charged- and neutral-current sensitivity."},{"id":"A-BASELINE-ENERGY","label":"phase depends on L/E","detail":"phase depends on L/E."},{"id":"A-ATMOSPHERIC-GEOMETRY","label":"neutrinos cross different Earth distances","detail":"neutrinos cross different Earth distances."},{"id":"A-MATTER-EFFECT","label":"solar density modifies mixing","detail":"solar density modifies mixing."},{"id":"A-PMNS","label":"unitary flavor–mass mixing","detail":"unitary flavor–mass mixing."}],"timeSlices":[{"id":"TS-NEUTRINO-HYPOTHESIS","period":"1930s","label":"Beta-decay energy conserved","detail":"Beta-decay energy conserved — Neutral particle introduced"},{"id":"TS-FLAVORS","period":"1950s–1960s","label":"Electron and muon neutrinos distinguished","detail":"Electron and muon neutrinos distinguished — Flavor quantum numbers"},{"id":"TS-SOLAR-DEFICIT","period":"1960s onward","label":"Too few electron neutrinos detected","detail":"Too few electron neutrinos detected — Solar model or neutrino physics debated"},{"id":"TS-MIXING-THEORY","period":"1957 onward","label":"Oscillation and matter effects developed","detail":"Oscillation and matter effects developed — Quantitative conversion models"},{"id":"TS-SUPER-K","period":"1998","label":"Atmospheric zenith-angle pattern","detail":"Atmospheric zenith-angle pattern — Flavor oscillation established"},{"id":"TS-SNO","period":"2001–2002","label":"Flavor-sensitive solar flux measured","detail":"Flavor-sensitive solar flux measured — Total flux agrees; flavor changes"}],"patterns":[{"id":"P-01","detail":"Solar, atmospheric, reactor, and accelerator anomalies unified"},{"id":"P-02","detail":"Phase evolution generates flavor probabilities"},{"id":"P-03","detail":"Missing neutrinos reframed as changed flavor"},{"id":"P-04","detail":"Mixed flavor/mass ontology accepted"},{"id":"P-05","detail":"Standard weak production and detection retained"},{"id":"P-06","detail":"L/E, appearance, and neutral-current totals cross-test"}],"explicitEdges":[{"source":"A-PMNS","relation":"maps","target":"FLAVOR-STATES"},{"source":"A-PMNS","relation":"maps-from","target":"MASS-STATES"},{"source":"MASS-PHASE-DIFFERENCE","relation":"generates","target":"FLAVOR-OSCILLATION"},{"source":"V-SUPER-K","relation":"supports","target":"D-NEUTRIN :"The null hypothesis that the observed excess events near 125\\ \\mathrm{GeV} are a random upward fluctuation of known backgrounds rather than production and decay of a new particle.","period":"2011–2012 pre-announcement null hypothesis.","limitation":"","outcome":"Strongly rejected for the combined resonance."},{"id":"R-DETECTOR-CALIBRATION-HIGGS-ARTIFACT","label":"DETECTOR CALIBRATION HIGGS ARTIFACT","what":"The hypothesis that energy-scale, reconstruction, or detector effects create a false common resonance.","period":"2011–2012 pre-announcement null hypothesis.","limitation":"","outcome":"Independent detectors/channels reject it."},{"id":"R-SPIN-ONE-125-GEV-RESONANCE","label":"SPIN ONE 125 GEV RESONANCE","what":"A new spin-1 particle rather than a scalar as the source of the 125-GeV signal.","period":"December 2011–3 July 2012 pre-announcement candidate hypothesis.","limitation":"","outcome":"Diphoton decay excludes spin one under standard assumptions."},{"id":"R-PURE-CP-ODD-OR-HIGHER-SPIN-HIGGS-CANDIDATE","label":"PURE CP ODD OR HIGHER SPIN HIGGS CANDIDATE","what":"A resonance with purely pseudoscalar or higher-spin quantum numbers rather than the Standard Model 0^+ assignment.","period":"December 2011–3 July 2012 pre-announcement candidate families; tested further after the discovery.","limitation":"","outcome":"Pure forms strongly disfavored; small CP mixing remains testable."}],"assets":[{"id":"A-BEH-MECHANISM","label":"predicts scalar excitation in minimal realization","detail":"predicts scalar excitation in minimal realization."},{"id":"A-LHC","label":"produces high-energy parton collisions","detail":"produces high-energy parton collisions."},{"id":"A-ATLAS-CMS","label":"independent general-purpose detectors","detail":"independent general-purpose detectors."},{"id":"A-DECAY-CHANNELS","label":"\\gamma\\gamma, ZZ^, WW^, fermions","detail":"\\gamma\\gamma, ZZ^, WW^, fermions."},{"id":"A-STATISTICAL-TESTING","label":"local/global significance and signal stren <script>
(() => {
  "use strict";
  const data = JSON.parse(document.getElementById("graph-data").textContent);
  const canvas = document.getElementById("graph");
  const ctx = canvas.getContext("2d");
  const stage = document.getElementById("stage");

  const legendItems = document.getElementById("legendItems");
  const localLegendItems = document.getElementById("localLegendItems");
  const css = getComputedStyle(document.documentElement);

    timeslice: "--timeslice",

  };
  const color = (key) => css.getPropertyValue(colorMap[key] || "--concept").trim();

  categoryFilter.add(new Option("Core theoretical backbone", "__mainline__"));
  for (const value of categories) categoryFilter.add(new Option(value, value));
  for (const value of eras) eraFilter.add(new Option(value, value));

    .map((value) => '<span class="legend-item"><span class="swatch" style="--c:' + color(value) + '"></span>' + value + '</span>')
    .join("") +
    '<span class="legend-item"><span class="swatch mainline"></span>Core theoretical backbone (larger node)</span>';
  localLegendItems.innerHTML = [
    ["pathway", "Earlier, incomplete, or superseded pathway"],
    ["timeslice", "Historical time slice"],
    ["asset", "Knowledge asset"],
    ["concept", "Concept or evidence"],
    ["pattern", "Discovery pattern (P-01–P-06)"],
  ].map(([key, label]) =>
    '<span class="legend-item"><span class="swatch" style="--c:' + color(key) + '"></span>' + label + '</span>'

  summaryStats.textContent =
