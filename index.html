ny process satisfying \\Delta U=Q-W is physically possible, including complete cyclic conversion of heat drawn from one reservoir into work.","period":"1840s–1849 implicit conservation-only reasoning.","limitation":"It allows processes never observed, such as spontaneous cold-to-hot heat transfer without compensation or a cyclic one-reservoir engine producing net work.","outcome":"Retained as necessary but bounded as insufficient."},{"id":"R-IRREVERSIBILITY-AS-FRICTION-ONLY","label":"IRREVERSIBILITY AS FRICTION ONLY","what":"The view that every departure from perfect performance is caused only by removable mechanical defects such as friction, turbulence or leakage, rather than by a universal restriction on finite-temperature heat transfer and cyclic conversion.","period":"early nineteenth century–1849.","limitation":"Even a frictionless cyclic engine cannot take heat from one equilibrium reservoir and turn it entirely into work without another effect.","outcome":"Narrowed to one class of irreversibility mechanisms."}],"assets":[{"id":"A-STEAM-ENGINE-CYCLES","label":"repeatable cyclic devices converting heat transfer into work","detail":"repeatable cyclic devices converting heat transfer into work."},{"id":"A-TWO-RESERVOIRS","label":"ideal hot and cold bodies held at fixed temperatures","detail":"ideal hot and cold bodies held at fixed temperatures."},{"id":"A-CARNOT-REVERSIBILITY","label":"a cycle that can be reversed while restoring system and surroundings without net residue","detail":"a cycle that can be reversed while restoring system and surroundings without net residue."},{"id":"A-CARNOT-THEOREM","label":"no engine between two reservoirs exceeds a reversible engine, and all reversible engines share one efficiency","detail":"no engine between two reservoirs exceeds a reversible engine, and all reversible engines share one efficiency."},{"id":"A-FIRST-LAW","label":"W=Q_h-Q_c for a cyclic heat engine using positive heat magnitudes","detail":"W=Q_h-Q_c for a cyclic heat engine using positive heat magnitudes."},{"id":"A-CLAPEYRON-DIAGRAM","label":"geometrical cycle representation and mathematical transmission of Carnot's work","detail":"geometrical cycle representation and mathematical transmission of Carnot's work."},{"id":"A-CLAUSIUS-KELVIN-STATEMENTS","label":"independently phrased impossibility constraints","detail":"independently phrased impossibility constraints."}],"timeSlices":[{"id":"TS-STEAM-ENGINE-PRACTICE","period":"eighteenth–early nineteenth centuries","label":"Engine improvement pursued by design-specific trial and error","detail":"Engine improvement pursued by design-specific trial and error — Efficiency lacks a universal theoretical ceiling"},{"id":"TS-CARNOT-1824","period":"1824","label":"Ideal reversible engine compares hot and cold reservoirs","detail":"Ideal reversible engine compares hot and cold reservoirs — Maximum performance becomes independent of working substance"},{"id":"TS-CLAPEYRON-1834","period":"1834","label":"Carnot's reasoning receives a diagrammatic and mathematical presentation","detail":"Carnot's reasoning receives a diagrammatic and mathematical presentation — Cycle methods become more accessible"},{"id":"TS-FIRST-LAW","period":"1840s–1850","label":"Heat–work equivalence rejects strict caloric conservation","detail":"Heat–work equivalence rejects strict caloric conservation — Carnot's valid structure must be reconstructed"},{"id":"TS-CLAUSIUS-KELVIN","period":"1850–1854","label":"Directionality and impossible cyclic devices formulated","detail":"Directionality and impossible cyclic devices formulated — Second-law statements become explicit and mutually connected"},{"id":"TS-ENTROPY-1865","period":"1865","label":"Reversible heat ratios integrated into a state function","detail":"Reversible heat ratios integrated into a state function — Entropy and uncompensated transformations quantify irreversibility"},{"id":"TS-STATISTICAL-INTERPRETATION","period":"late nineteenth century onward","label":"Time-reversible microdynamics confront macroscopic direction","detail":"Time-reversible microdynamics confront macroscopic direction — Entropy increase becomes overwhelmingly typical under stated conditions"}],"patterns":[{"id":"P-01","detail":"All heat engines, refrigerators and spontaneous heat flows are unified by reversible comparison and entropy accounting"},{"id":"P-02","detail":"Empirical engine performance becomes a generator of universal efficiency and process-direction inequalities"},{"id":"P-03","detail":"“How can this engine be improved?” becomes “What transformation is possible between two temperatures at all?”"},{"id":"P-04","detail":"Reversible counterfactual cycles and entropy become legitimate theoretical objects independent of microscopic ontology"},{"id":"P-05","detail":"Carnot's reservoir and cycle structure survives rejection of caloric conservation"},{"id":"P-06","detail":"Efficiency, coefficients of performance and entropy production provide quantitative discriminators"}],"explicitEdges":[{"source":"A-STEAM-ENGINE-CYCLES","relation":"motivates","target":"D-CARNOT-1824"},{"source":"R-ENGINE-SPECIFIC-OPTIMIZATION","relation":"reframed-by","target":"D-CARNOT-1824"},{"source":"D-CARNOT-1824","relation":"introduces","target":"A-CARNOT-REVERSIBILITY"},{"source":"A-CARNOT-REVERSIBILITY","relation":"enables","target":"A-CARNOT-THEOREM"},{"source":"D-FIRST-LAW-1847-1850","relation":"revises-energy-accounting-of","target":"D-CARNOT-1824"},{"source":"KELVIN-PLANCK-STATEMENT","relation":"equivalent-via-device-coupling","target":"CLAUSIUS-STATEMENT"},{"source":"CLAUSIUS-STATEMENT","relation":"enables-contradiction-proof-of","target":"A-CARNOT-THEOREM"},{"source":"A-CARNOT-THEOREM","relation":"implies","target":"REVERSIBLE-ENGINE-UNIVERSALITY"},{"source":"REVERSIBLE-ENGINE-UNIVERSALITY","relation":"implies","target":"HEAT-RATIO-COMPOSITION-LAW"},{"source":"HEAT-RATIO-COMPOSITION-LAW","relation":"defines","target":"THERMODYNAMIC-TEMPERATURE"},{"source":"THERMODYNAMIC-TEMPERATURE","relation":"yields","target":"CARNOT-EFFICIENCY"},{"source":"REVERSIBLE-AUXILIARY-ENGINES","relation":"derive","target":"CLAUSIUS-THEOREM"},{"source":"CLAUSIUS-THEOREM","relation":"defines","target":"ENTROPY-STATE-FUNCTION"},{"source":"REVERSIBLE-AUXILIARY-ENGINES","relation":"derive","target":"CLAUSIUS-INEQUALITY"},{"source":"CLAUSIUS-INEQUALITY","relation":"implies","target":"ENTROPY-GENERATION-NONNEGATIVE"},{"source":"ENTROPY-GENERATION-NONNEGATIVE","relation":"implies-for-isolated-system","target":"ENTROPY-INCREASE"},{"source":"D-SECOND-LAW-1850-1865","relation":"forbids","target":"PERPETUAL-MOTION-SECOND-KIND"},{"source":"D-SECOND-LAW-1850-1865","relation":"precedes","target":"D-STATISTICAL-MECHANICS-1859-1902"},{"source":"D-SECOND-LAW-1850-1865","relation":"instantiates","target":"P-03"}],"sourceCount":8,"wordCount":4332},{"file":"fundamental_physics_discoveries/13_maxwell_electromagnetic_field_theory.md","id":"D-MAXWELL-FIELD-1861-1865","title":"Maxwell's Electromagnetic Field Theory","date":"1861–1865","year":1865,"era":"Nineteenth century","category":"Quantum & radiation","domain":"Classical electromagnetic fields and light","contributors":"James Clerk Maxwell, building on Faraday, Ampère, Gauss, and others","status":"Correct classical field theory; quantum electrodynamics supplies the deeper microscopic framework","mainline":true,"claim":"Maxwell's field equations unified electric charge, current, magnetic induction, and light. The displacement-current term made charge conservation compatible with time-dependent fields and implied self-propagating waves with the measured speed of light.","pathways":[{"id":"R-SEPARATE-ELECTRIC-MAGNETIC-FLUIDS","label":"SEPARATE ELECTRIC MAGNETIC FLUIDS","what":"A family of theories that assigns electricity and magnetism to distinct imponderable fluids or agencies, with separate laws rather than one dynamically coupled field.","period":"eighteenth–early nineteenth centuries.","limitation":"Cannot explain induction and current magnetism as one dynamics.","outcome":"Superseded by coupled fields."},{"id":"R-MECHANICAL-ETHER-MODELS","label":"MECHANICAL ETHER MODELS","what":"Models that interpret electric and magnetic fields as stresses, rotations, or motions of a material ether whose microscopic mechanics is supposed to produce Maxwell-like equations.","period":"seventeenth century–1850s.","limitation":"No unique mechanical model was required by the equations; preferred-rest-frame evidence failed.","outcome":"Ether mechanics discarded; field equations retained."},{"id":"R-INSTANTANEOUS-ELECTROMAGNETIC-ACTION","label":"INSTANTANEOUS ELECTROMAGNETIC ACTION","what":"Direct force laws in which charges or currents influence one another across distance without a propagating local field.","period":"1785–1850s.","limitation":"","outcome":"Superseded as the fundamental interpretation by finite-speed field propagation; useful integral formulations remain."},{"id":"R-AMPERE-WITHOUT-DISPLACEMENT-CURRENT","label":"AMPERE WITHOUT DISPLACEMENT CURRENT","what":"The conduction-current-only form of Ampère's circuital law, applied even when electric flux changes between capacitor plates.","period":"1820s.","limitation":"It gives surface-dependent current and conflicts with charge continuity.","outcome":"Repaired by Maxwell's displacement-current term."}],"assets":[{"id":"A-GAUSS-LAWS","label":"flux relations","detail":"flux relations."},{"id":"A-AMPERE","label":"current-generated magnetism","detail":"current-generated magnetism."},{"id":"A-FARADAY","label":"changing magnetic flux induces electric circulation","detail":"changing magnetic flux induces electric circulation."},{"id":"A-CHARGE-CONSERVATION","label":"local continuity constraint","detail":"local continuity constraint."},{"id":"A-OPTICAL-SPEED","label":"measured c","detail":"measured c."}],"timeSlices":[{"id":"TS-STATIC-LAWS","period":"18th–early 19th century","label":"Coulomb, Gauss, Ampère describe separate sectors","detail":"Coulomb, Gauss, Ampère describe separate sectors — Dynamic closure missing"},{"id":"TS-FARADAY","period":"1830s–1850s","label":"Induction and lines of force","detail":"Induction and lines of force — Local field picture strengthens"},{"id":"TS-MAXWELL","period":"1861–1865","label":"Coupled field equations developed","detail":"Coupled field equations developed — Light identified as electromagnetic disturbance"},{"id":"TS-HERTZ","period":"1887–1888","label":"Radio waves generated and detected","detail":"Radio waves generated and detected — Wave prediction experimentally confirmed"},{"id":"TS-RELATIVITY-QED","period":"20th century","label":"Lorentz symmetry and quantized field","detail":"Lorentz symmetry and quantized field — Classical theory retained as limit"}],"patterns":[{"id":"P-01","detail":"Electricity, magnetism, and light unified"},{"id":"P-02","detail":"Static and induction laws generate wave propagation"},{"id":"P-03","detail":"Forces between bodies reframed as local field evolution"},{"id":"P-04","detail":"Displacement current and autonomous fields accepted"},{"id":"P-05","detail":"Gauss, Ampère, and Faraday structures retained"},{"id":"P-06","detail":"Predicted wave speed and new spectral regime tested"}],"explicitEdges":[{"source":"A-FARADAY","relation":"contributes-to","target":"D-MAXWELL-FIELD-1861-1865"},{"source":"A-CHARGE-CONSERVATION","relation":"requires","target":"DISPLACEMENT-CURRENT"},{"source":"DISPLACEMENT-CURRENT","relation":"completes","target":"MAXWELL-AMPERE-LAW"},{"source":"MAXWELL-EQUATIONS","relation":"generate","target":"EM-WAVE-EQUATION"},{"source":"EM-WAVE-EQUATION","relation":"predicts","target":"SPEED-ONE-OVER-SQRT-MUEPS"},{"source":"SPEED-ONE-OVER-SQRT-MUEPS","relation":"matches","target":"A-OPTICAL-SPEED"},{"source":"V-HERTZ-WAVES","relation":"validates","target":"D-MAXWELL-FIELD-1861-1865"},{"source":"D-QED","relation":"quantizes","target":"D-MAXWELL-FIELD-1861-1865"},{"source":"D-MAXWELL-FIELD-1861-1865","relation":"instantiates","target":"P-01"}],"sourceCount":4,"wordCount":1749},{"file":"fundamental_physics_discoveries/15_x_rays.md","id":"D-RONTGEN-XRAYS-1895","title":"X-Rays","date":"28 December 1895 public report (observations began 8 November)","year":1895.99,"era":"Nineteenth century","category":"Quantum & radiation","domain":"Short-wavelength electromagnetic radiation","contributors":"Wilhelm Conrad Röntgen; later Max von Laue and the Braggs","status":"X-rays are photons in the high-frequency electromagnetic spectrum","mainline":false,"claim":"Röntgen discovered penetrating radiation produced when cathode rays interact with matter. Its photographic, fluorescent, and absorption behavior revealed phenomena beyond visible optics. Diffraction by crystals later established its wave character and wavelength scale.","pathways":[{"id":"R-CATHODE-RAY-LEAKAGE","label":"CATHODE RAY LEAKAGE","what":"The hypothesis that the newly observed penetrating effect was the already-known stream of charged cathode-ray particles escaping through the discharge tube's glass wall.","period":"November–December 1895 pre-announcement hypothesis.","limitation":"X-rays were far more penetrating and not deflected like charged particles.","outcome":"Replaced by neutral electromagnetic radiation."},{"id":"R-STRAY-ULTRAVIOLET-FLUORESCENCE","label":"STRAY ULTRAVIOLET FLUORESCENCE","what":"The initial-control hypothesis that ordinary visible or ultraviolet radiation leaking from the covered discharge tube caused the distant fluorescent screen to glow.","period":"November–December 1895 pre-announcement control hypothesis.","limitation":"Opaque shielding blocked ordinary light while the new effect persisted and penetrated materials differently.","outcome":"Rejected during Röntgen's November–December 1895 investigation before the public discovery report."}],"assets":[{"id":"A-DISCHARGE-TUBE","label":"energetic electrons","detail":"energetic electrons."},{"id":"A-FLUORESCENT-SCREEN","label":"radiation detector","detail":"radiation detector."},{"id":"A-PHOTOGRAPHIC-PLATE","label":"persistent spatial record","detail":"persistent spatial record."},{"id":"A-CRYSTAL-LATTICE","label":"wavelength-scale diffraction grating","detail":"wavelength-scale diffraction grating."}],"timeSlices":[{"id":"TS-CATHODE-RAYS","period":"1870s–1890s","label":"Discharges in evacuated tubes studied","detail":"Discharges in evacuated tubes studied — Unknown radiation appears outside the tube"},{"id":"TS-RONTGEN","period":"1895","label":"Fluorescence and radiographs observed","detail":"Fluorescence and radiographs observed — “X” marks unknown nature"},{"id":"TS-ABSORPTION","period":"1896 onward","label":"Material penetration compared","detail":"Material penetration compared — Density and atomic composition matter"},{"id":"TS-LAUE","period":"1912","label":"Crystal diffraction observed","detail":"Crystal diffraction observed — X-rays identified as short waves"},{"id":"TS-BRAGG","period":"1912–1913","label":"Diffraction becomes structural probe","detail":"Diffraction becomes structural probe — Atomic lattice spacings measured"},{"id":"TS-QUANTUM","period":"1920s onward","label":"Photon scattering and spectra understood","detail":"Photon scattering and spectra understood — X-rays embedded in quantum electrodynamics"}],"patterns":[{"id":"P-01","detail":"Discharge physics, optics, and atomic structure linked"},{"id":"P-02","detail":"Diffraction patterns generate lattice information"},{"id":"P-03","detail":"Tube fluorescence reframed as a new penetrating radiation"},{"id":"P-04","detail":"Invisible ionizing radiation accepted"},{"id":"P-05","detail":"Wave optics retained at shorter wavelength"},{"id":"P-06","detail":"Attenuation, angles, and spectra made quantitative"}],"explicitEdges":[{"source":"A-DISCHARGE-TUBE","relation":"produces","target":"D-RONTGEN-XRAYS-1895"},{"source":"A-FLUORESCENT-SCREEN","relation":"detects","target":"D-RONTGEN-XRAYS-1895"},{"source":"R-CATHODE-RAY-LEAKAGE","relation":"superseded-by","target":"XRAY-NEUTRAL-RADIATION"},{"source":"A-CRYSTAL-LATTICE","relation":"diffracts","target":"XRAY-WAVE"},{"source":"V-BRAGG-PEAKS","relation":"validates","target":"XRAY-WAVE"},{"source":"D-QUANTUM-ELECTRODYNAMICS","relation":"explains","target":"XRAY-PHOTON"},{"source":"D-RONTGEN-XRAYS-1895","relation":"instantiates","target":"P-03"}],"sourceCount":4,"wordCount":1614},{"file":"fundamental_physics_discoveries/17_electron.md","id":"D-ELECTRON-1897","title":"The Electron","date":"1897 (Thomson's corpuscle experiments)","year":1897,"era":"Nineteenth century","category":"Matter & emergence","domain":"Subatomic charged matter","contributors":"J. J. Thomson; precursors and validators included George Stoney, Jean Perrin, Robert Millikan and others","status":"The electron is an elementary spin-\\tfrac12 lepton in the Standard Model","mainline":false,"claim":"Cathode-ray deflection showed a universal negatively charged constituent with a charge-to-mass ratio far exceeding that of known ions. Atoms were therefore divisible. Later charge measurements separated the electron's charge and mass.","pathways":[{"id":"R-ETHER-WAVE-CATHODE-RAYS","label":"ETHER WAVE CATHODE RAYS","what":"A wave interpretation in which cathode rays are disturbances or stresses propagating through the ether inside a discharge tube rather than streams of material charged particles.","period":"1870s–1890s.","limitation":"Deflection and momentum transfer fit charged particles with universal e/m.","outcome":"Replaced by electron beams."},{"id":"R-INDIVISIBLE-ATOM","label":"INDIVISIBLE ATOM","what":"The chemical-atom model that treats atoms as the smallest physically structured units of matter, containing no detachable universal subatomic constituents.","period":"ancient origins; strong nineteenth-century chemical form.","limitation":"A constituent much lighter than hydrogen occurs across cathode materials and gases.","outcome":"Superseded; atoms retained as chemically meaningful composite units."},{"id":"R-MATERIAL-SPECIFIC-CATHODE-ION","label":"MATERIAL SPECIFIC CATHODE ION","what":"The hypothesis that cathode rays are ordinary charged atoms or ions whose identity and mass depend on the cathode material or residual gas.","period":"1880s–1890s.","limitation":"","outcome":"Universal e/m across materials rejected it."}],"assets":[{"id":"A-VACUUM-TUBE","label":"accelerates and guides cathode rays","detail":"accelerates and guides cathode rays."},{"id":"A-ELECTRIC-FIELD","label":"deflects charge","detail":"deflects charge."},{"id":"A-MAGNETIC-FIELD","label":"velocity-dependent deflection","detail":"velocity-dependent deflection."},{"id":"A-ELECTROLYSIS","label":"suggests charge quantization","detail":"suggests charge quantization."},{"id":"A-DROPLET-BALANCE","label":"resolves elementary charge","detail":"resolves elementary charge."}],"timeSlices":[{"id":"TS-ELECTROLYSIS","period":"19th century","label":"Charge appears in repeatable units","detail":"Charge appears in repeatable units — “Electron” named as charge unit"},{"id":"TS-CATHODE-RAY","period":"1870s–1890s","label":"Rays interpreted as waves or particles","detail":"Rays interpreted as waves or particles — Electric and magnetic deflection studied"},{"id":"TS-THOMSON","period":"1897","label":"Universal e/m measured","detail":"Universal e/m measured — Corpuscle identified below atomic mass"},{"id":"TS-MILLIKAN","period":"1909–1913","label":"Elementary charge measured","detail":"Elementary charge measured — Electron mass inferred"},{"id":"TS-QUANTUM","period":"1920s onward","label":"Wave behavior, spin, and antiparticle established","detail":"Wave behavior, spin, and antiparticle established — Electron becomes quantum field excitation"}],"patterns":[{"id":"P-01","detail":"Electricity, cathode rays, and atomic constitution linked"},{"id":"P-02","detail":"Deflection trajectories generated by Lorentz force"},{"id":"P-03","detail":"“What kind of ray?” reframed as constituent-property inference"},{"id":"P-04","detail":"Subatomic universal particle accepted"},{"id":"P-05","detail":"Atomic and electrochemical regularities retained"},{"id":"P-06","detail":"Crossed-field e/m supplied quantitative identification"}],"explicitEdges":[{"source":"A-VACUUM-TUBE","relation":"produces","target":"CATHODE-RAYS"},{"source":"A-ELECTRIC-FIELD","relation":"deflects","target":"CATHODE-RAYS"},{"source":"A-MAGNETIC-FIELD","relation":"deflects","target":"CATHODE-RAYS"},{"source":"V-UNIVERSAL-E-OVER-M","relation":"supports","target":"D-ELECTRON-1897"},{"source":"D-ELECTRON-1897","relation":"refutes","target":"R-INDIVISIBLE-ATOM"},{"source":"A-DROPLET-BALANCE","relation":"measures","target":"ELEMENTARY-CHARGE"},{"source":"ELEMENTARY-CHARGE","relation":"with","target":"E-OVER-M"},{"source":"E-OVER-M","relation":"yields","target":"ELECTRON-MASS"},{"source":"D-ELECTRON-1897","relation":"instantiates","target":"P-03"}],"sourceCount":3,"wordCount":1679},{"file":"fundamental_physics_discoveries/18_energy_quantization.md","id":"D-PLANCK-QUANTIZATION-1900","title":"Energy Quantization","date":"14 December 1900 (Planck's energy-element derivation)","year":1900.95,"era":"Quantum revolution","category":"Quantum & radiation","domain":"Black-body radiation and the origin of quantum theory","contributors":"Max Planck","status":"Quantized energy exchange is fundamental; Planck's original oscillator interpretation was transitional","mainline":false,"claim":"Planck obtained the observed black-body spectrum by counting oscillator energies in discrete units proportional to frequency. The step resolved the classical high-frequency failure and introduced h, but its later photon and quantum-state meanings went beyond Planck's initial interpretation.","pathways":[{"id":"R-CLASSICAL-EQUIPARTITION-RADIATION","label":"CLASSICAL EQUIPARTITION RADIATION","what":"The classical statistical model that gives each independent electromagnetic cavity mode an average thermal energy k_BT, producing the Rayleigh–Jeans spectrum.","period":"June 1900 (Rayleigh's classical result).","limitation":"","outcome":"Valid only for h\\nu\\ll k_BT."},{"id":"R-WIEN-ONLY","label":"WIEN ONLY","what":"A black-body model that uses Wien's exponential spectral form as the complete radiation law at every frequency rather than as the high-frequency asymptote.","period":"1896.","limitation":"Fails at low frequency.","outcome":"Retained as a limit of Planck's law."},{"id":"R-AD-HOC-BLACKBODY-INTERPOLATION","label":"AD HOC BLACKBODY INTERPOLATION","what":"A curve-fitting route that joins low- and high-frequency formulas without a microscopic discrete-energy rule.","period":"October 1900, before Planck's statistical derivation.","limitation":"","outcome":"Could match data locally but lacked the universal generative role of h."}],"assets":[{"id":"A-CAVITY-DATA","label":"precision spectral curves","detail":"precision spectral curves."},{"id":"A-THERMODYNAMICS","label":"entropy and equilibrium constraints","detail":"entropy and equilibrium constraints."},{"id":"A-BOLTZMANN-COUNTING","label":"probability from state multiplicity","detail":"probability from state multiplicity."},{"id":"A-OSCILLATORS","label":"matter–radiation exchange model","detail":"matter–radiation exchange model."}],"timeSlices":[{"id":"TS-THERMAL-SPECTRA","period":"19th century","label":"Universal cavity spectrum measured","detail":"Universal cavity spectrum measured — Temperature and frequency dependence constrained"},{"id":"TS-WIEN","period":"1890s","label":"High-frequency law successful","detail":"High-frequency law successful — Low-frequency mismatch remains"},{"id":"TS-RAYLEIGH-JEANS","period":"1900–1905","label":"Classical equipartition gives low-frequency limit","detail":"Classical equipartition gives low-frequency limit — Ultraviolet divergence exposed"},{"id":"TS-PLANCK","period":"1900","label":"Discrete energy elements used","detail":"Discrete energy elements used — Full spectrum matched"},{"id":"TS-EINSTEIN-BOHR","period":"1905–1913","label":"Radiation and atomic states quantized","detail":"Radiation and atomic states quantized — Quantum becomes physical principle"},{"id":"TS-QM","period":"1920s","label":"Operators and states formalize quantization","detail":"Operators and states formalize quantization — Planck law derived from photon statistics"}],"patterns":[{"id":"P-01","detail":"Thermodynamics, statistics, and radiation unified"},{"id":"P-02","detail":"Spectral curves generated from discrete state counting"},{"id":"P-03","detail":"Continuously shared energy reframed as discrete exchange"},{"id":"P-04","detail":"Frequency-dependent energy elements accepted"},{"id":"P-05","detail":"Wien and Rayleigh–Jeans laws retained as limits"},{"id":"P-06","detail":"Full-spectrum fit and universal h supplied tests"}],"explicitEdges":[{"source":"A-CAVITY-DATA","relation":"constrains","target":"D-PLANCK-QUANTIZATION-1900"},{"source":"R-WIEN-ONLY","relation":"fails-at","target":"LOW-FREQUENCY"},{"source":"R-CLASSICAL-EQUIPARTITION-RADIATION","relation":"fails-at","target":"HIGH-FREQUENCY"},{"source":"A-BOLTZMANN-COUNTING","relation":"enables","target":"EQ-PLANCK-MEAN-ENERGY"},{"source":"EQ-PLANCK-MEAN-ENERGY","relation":"generates","target":"EQ-PLANCK-SPECTRUM"},{"source":"EQ-PLANCK-SPECTRUM","relation":"retains-limit","target":"R-WIEN-ONLY"},{"source":"EQ-PLANCK-SPECTRUM","relation":"retains-limit","target":"R-RAYLEIGH-JEANS"},{"source":"D-PLANCK-QUANTIZATION-1900","relation":"precedes","target":"D-QUANTUM-MECHANICS"},{"source":"D-PLANCK-QUANTIZATION-1900","relation":"instantiates","target":"P-05"}],"sourceCount":3,"wordCount":1594},{"file":"fundamental_physics_discoveries/12_statistical_mechanics.md","id":"D-STATISTICAL-MECHANICS-1859-1902","title":"Statistical Mechanics","date":"1859–1902 (Maxwell/Boltzmann through Gibbs)","year":1902,"era":"Quantum revolution","category":"Matter & emergence","domain":"Microscopic foundations of thermodynamics","contributors":"James Clerk Maxwell, Ludwig Boltzmann, J. Willard Gibbs","status":"Fundamental probabilistic framework for equilibrium and nonequilibrium many-body physics","mainline":true,"claim":"Statistical mechanics explains thermodynamic regularities through probability distributions over vast numbers of microscopic states. It reconciles reversible microdynamics with overwhelmingly likely macroscopic irreversibility by adding boundary conditions, coarse descriptions, and typicality or probabilistic reasoning.","pathways":[{"id":"R-PURE-MECHANICAL-DEDUCTION","label":"PURE MECHANICAL DEDUCTION","what":"The program of deriving irreversible thermodynamic evolution as an unconditional theorem of reversible microscopic mechanics, without probabilistic assumptions, coarse graining, or special boundary conditions.","period":"nineteenth-century mechanical program.","limitation":"Time reversal and recurrence objections expose missing assumptions.","outcome":"Deterministic dynamics retained but not sufficient alone."},{"id":"R-ENERGETICS-WITHOUT-ATOMS","label":"ENERGETICS WITHOUT ATOMS","what":"A macroscopic research program that treats energy and thermodynamic relations as fundamental while declining to posit real atoms or molecules behind heat and matter.","period":"1890s.","limitation":"Could not naturally explain fluctuation scales or Brownian motion.","outcome":"Superseded as a complete account; phenomenological thermodynamics retained."},{"id":"R-RECURRENCE-REFUTES-STATISTICS","label":"RECURRENCE REFUTES STATISTICS","what":"The objection elevated into a rival conclusion that microscopic recurrence makes statistical entropy increase invalid rather than probabilistic and timescale-dependent.","period":"1896 (Zermelo's objection).","limitation":"Recurrence does not predict ordinary macroscopic evolution and typically occurs on astronomically large timescales.","outcome":"Rejected as a refutation; retained as a limit on strictly monotonic microscopic claims."},{"id":"R-NAIVE-ERGODICITY","label":"NAIVE ERGODICITY","what":"The unqualified assumption that every isolated system explores its entire energy surface uniformly, so one long time average automatically equals an ensemble average.","period":"1870s.","limitation":"Many systems are nonergodic, finite, integrable, glassy, or otherwise fail the assumption.","outcome":"Replaced by conditional ergodic, mixing, typicality, and ensemble arguments."}],"assets":[{"id":"A-THERMODYNAMICS","label":"U,T,S,p,V and equilibrium laws","detail":"U,T,S,p,V and equilibrium laws."},{"id":"A-KINETIC-GAS","label":"pressure from molecular collision","detail":"pressure from molecular collision."},{"id":"A-PROBABILITY","label":"distributions rather than exact trajectories","detail":"distributions rather than exact trajectories."},{"id":"A-COMBINATORICS","label":"counting microscopic arrangements","detail":"counting microscopic arrangements."},{"id":"A-ENSEMBLES","label":"probability measures over phase space","detail":"probability measures over phase space."}],"timeSlices":[{"id":"TS-KINETIC-PRECURSORS","period":"18th–mid-19th century","label":"Gas pressure associated with molecular motion","detail":"Gas pressure associated with molecular motion — Atomic reality remained disputed"},{"id":"TS-MAXWELL","period":"1859–1867","label":"Velocity distribution and transport theory","detail":"Velocity distribution and transport theory — Probability enters mechanics explicitly"},{"id":"TS-BOLTZMANN","period":"1870s–1890s","label":"Entropy and kinetic evolution tied to microstates","detail":"Entropy and kinetic evolution tied to microstates — Irreversibility becomes statistical"},{"id":"TS-GIBBS","period":"1902","label":"Ensembles systematize equilibrium distributions","detail":"Ensembles systematize equilibrium distributions — Framework generalizes beyond dilute gases"},{"id":"TS-QUANTUM-STATISTICS","period":"1920s onward","label":"Indistinguishability changes state counting","detail":"Indistinguishability changes state counting — Bose–Einstein and Fermi–Dirac distributions"}],"patterns":[{"id":"P-01","detail":"Mechanics, probability, and thermodynamics unified"},{"id":"P-02","detail":"Macroscopic laws generated from distributions of microstates"},{"id":"P-03","detail":"Exact trajectory prediction reframed as typical macrobehavior"},{"id":"P-04","detail":"Probability treated as physically explanatory"},{"id":"P-05","detail":"Thermodynamic state functions retained"},{"id":"P-06","detail":"Fluctuations and transport provide quantitative tests"}],"explicitEdges":[{"source":"A-THERMODYNAMICS","relation":"constrains","target":"D-STATISTICAL-MECHANICS-1859-1902"},{"source":"A-PROBABILITY","relation":"enables","target":"D-MAXWELL-DISTRIBUTION"},{"source":"A-COMBINATORICS","relation":"enables","target":"EQ-BOLTZMANN-ENTROPY"},{"source":"R-PURE-MECHANICAL-DEDUCTION","relation":"repaired-by","target":"PROBABILISTIC-BOUNDARY-CONDITIONS"},{"source":"EQ-CANONICAL-DISTRIBUTION","relation":"generates","target":"THERMODYNAMIC-STATE-FUNCTIONS"},{"source":"D-STATISTICAL-MECHANICS-1859-1902","relation":"explains","target":"LAW-THERMODYNAMICS"},{"source":"D-QUANTUM-STATISTICS","relation":"limits","target":"CLASSICAL-COUNTING"},{"source":"D-STATISTICAL-MECHANICS-1859-1902","relation":"instantiates","target":"P-02"}],"sourceCount":3,"wordCount":1901},{"file":"fundamental_physics_discoveries/16_radioactivity_and_nuclear_transmutation.md","id":"D-RADIOACTIVITY-1896-1903","title":"Radioactivity and Nuclear Transmutation","date":"1896–1903","year":1903,"era":"Quantum revolution","category":"Nuclear & particles","domain":"Spontaneous nuclear transformation","contributors":"Henri Becquerel, Marie and Pierre Curie, Ernest Rutherford, Frederick Soddy","status":"Radioactive decay is a quantum nuclear process with probabilistic lifetimes","mainline":false,"claim":"Radioactivity showed that atoms are not immutable units: unstable nuclei transform spontaneously while emitting characteristic radiation. Classification into alpha, beta, and gamma radiation and decay-chain analysis converted an accidental observation into a theory of nuclear transmutation.","pathways":[{"id":"R-PHOSPHORESCENT-STORAGE","label":"PHOSPHORESCENT STORAGE","what":"The hypothesis that uranium radiation is delayed phosphorescence: energy first absorbed from sunlight is stored in the material and later re-emitted.","period":"February 1896 initial hypothesis.","limitation":"Covered samples remained active without prior illumination.","outcome":"Replaced by spontaneous intrinsic decay."},{"id":"R-IMMUTABLE-CHEMICAL-ELEMENTS","label":"IMMUTABLE CHEMICAL ELEMENTS","what":"The doctrine that an element's atomic identity cannot change in any natural physical process, so apparent radioactive daughters must be impurities, mixtures, or temporary states of the same element.","period":"ancient doctrine through nineteenth-century chemistry.","limitation":"Decay products exhibit new chemical and radiation signatures.","outcome":"Superseded at the nuclear level; chemical stability retained for ordinary reactions."},{"id":"R-ENVIRONMENTAL-RADIOACTIVITY","label":"ENVIRONMENTAL RADIOACTIVITY","what":"The hypothesis that radioactivity is activated or substantially controlled by ordinary temperature, pressure, illumination, or chemical state.","period":"1896–1898.","limitation":"","outcome":"Rejected as the general cause; limited environmental effects on particular decay channels remain."},{"id":"R-UNDIFFERENTIATED-RADIATION","label":"UNDIFFERENTIATED RADIATION","what":"A one-ray model treating all radioactive emissions as the same radiation with variable penetration.","period":"1896–1898.","limitation":"","outcome":"Deflection and absorption separated alpha, beta, and gamma components."}],"assets":[{"id":"A-PHOTOGRAPHIC-PLATE","label":"integrates invisible radiation exposure","detail":"integrates invisible radiation exposure."},{"id":"A-ELECTROMETER","label":"measures ionization and activity","detail":"measures ionization and activity."},{"id":"A-CHEMICAL-SEPARATION","label":"traces activity through fractions","detail":"traces activity through fractions."},{"id":"A-MAGNETIC-DEFLECTION","label":"distinguishes charge and mass behavior","detail":"distinguishes charge and mass behavior."}],"timeSlices":[{"id":"TS-URANIUM-RAYS","period":"1896","label":"Uranium salts expose covered plates without sunlight","detail":"Uranium salts expose covered plates without sunlight — Emission is intrinsic, not stored fluorescence"},{"id":"TS-CURIES","period":"1898","label":"Polonium and radium isolated through activity","detail":"Polonium and radium isolated through activity — Activity tracks material composition"},{"id":"TS-RADIATION-TYPES","period":"1899–1903","label":"Deflection and penetration classify emissions","detail":"Deflection and penetration classify emissions — Alpha, beta, gamma distinguished"},{"id":"TS-TRANSMUTATION","period":"1902–1903","label":"Rutherford and Soddy analyze decay chains","detail":"Rutherford and Soddy analyze decay chains — Elements transform into other elements"},{"id":"TS-NUCLEAR","period":"1911 onward","label":"Nucleus identified; decay located there","detail":"Nucleus identified; decay located there — Quantum nuclear models develop"}],"patterns":[{"id":"P-01","detail":"Chemistry, radiation, and atomic transformation joined"},{"id":"P-02","detail":"Activity curves generated by probabilistic decay law"},{"id":"P-03","detail":"“Stored light?” reframed as spontaneous atomic transformation"},{"id":"P-04","detail":"Mutable elements and stochastic lifetimes accepted"},{"id":"P-05","detail":"Elemental bookkeeping retained with nuclear identity"},{"id":"P-06","detail":"Half-lives and deflection distinguish hypotheses"}],"explicitEdges":[{"source":"A-PHOTOGRAPHIC-PLATE","relation":"detects","target":"D-BECQUEREL-1896"},{"source":"D-BECQUEREL-1896","relation":"refutes","target":"R-PHOSPHORESCENT-STORAGE"},{"source":"A-ELECTROMETER","relation":"enables","target":"D-CURIE-ACTIVITY"},{"source":"A-CHEMICAL-SEPARATION","relation":"enables","target":"D-RADIUM-POLONIUM"},{"source":"V-DAUGHTER-GROWTH","relation":"supports","target":"D-TRANSMUTATION"},{"source":"D-TRANSMUTATION","relation":"refutes","target":"R-IMMUTABLE-CHEMICAL-ELEMENTS"},{"source":"EQ-EXPONENTIAL-DECAY","relation":"explains","target":"V-HALF-LIFE"},{"source":"D-RADIOACTIVITY-1896-1903","relation":"instantiates","target":"P-04"}],"sourceCount":4,"wordCount":1760},{"file":"fundamental_physics_discoveries/14_electromagnetic_waves_and_relativity_crisis.md","id":"D-EM-WAVES-LORENTZ-CRISIS-1887-1904","title":"Electromagnetic Waves and the Relativity Crisis","date":"1887–1904 (Hertz through Lorentz's mature electron theory)","year":1904,"era":"Quantum revolution","category":"Cosmos & spacetime","domain":"Wave propagation, ether tests, and electrodynamics of moving bodies","contributors":"Heinrich Hertz, Albert A. Michelson, Edward Morley, Hendrik Lorentz, Henri Poincaré and others","status":"Electromagnetic waves validated; preferred luminiferous-ether kinematics superseded by special relativity","mainline":false,"claim":"Hertz confirmed Maxwellian waves, while precision experiments and electrodynamics exposed a conflict: Maxwell's equations single out speed c, whereas Galilean transformations change velocities by addition. Ether-drift searches did not reveal the expected preferred-frame motion. Lorentzian mathematical repairs prepared, but did not by themselves complete, Einstein's kinematic reframing.","pathways":[{"id":"R-GALILEAN-ELECTRODYNAMICS","label":"GALILEAN ELECTRODYNAMICS","what":"The attempt to combine Maxwellian electromagnetism with Galilean space and absolute time, transforming velocities by simple subtraction between inertial frames.","period":"pre-1887 classical kinematic extrapolation.","limitation":"A light wave with speed c would have frame-dependent speed, conflicting with Maxwellian form and experiment.","outcome":"Replaced by Lorentz transformations."},{"id":"R-RIGID-STATIONARY-ETHER","label":"RIGID STATIONARY ETHER","what":"A theory in which electromagnetic waves propagate through a rigid or effectively stationary luminiferous ether that defines an absolute rest frame relative to which Earth moves.","period":"nineteenth century.","limitation":"","outcome":"Preferred mechanical ether became unnecessary."},{"id":"R-FULLY-DRAGGED-ETHER","label":"FULLY DRAGGED ETHER","what":"An ether model in which matter carries the nearby optical medium with it, suppressing a local ether wind.","period":"1845 (Stokes-type dragging).","limitation":"","outcome":"Conflicted with stellar aberration and moving-medium results; rejected."},{"id":"R-LORENTZ-ETHER-THEORY","label":"LORENTZ ETHER THEORY","what":"A stationary-ether theory in which motion physically contracts bodies and alters clock readings so experiments obey Lorentz transformations while an unobservable preferred frame remains.","period":"1892–1904.","limitation":"","outcome":"Empirically sophisticated but explanatorily superseded by special relativity; Lorentz mathematics retained."}],"assets":[{"id":"A-MAXWELL-EQUATIONS","label":"invariant wave speed","detail":"invariant wave speed."},{"id":"A-HERTZ-WAVES","label":"experimental electromagnetic radiation","detail":"experimental electromagnetic radiation."},{"id":"A-INTERFEROMETRY","label":"sensitive phase comparison","detail":"sensitive phase comparison."},{"id":"A-CHARGE-DYNAMICS","label":"moving-charge phenomena","detail":"moving-charge phenomena."},{"id":"A-LORENTZ-TRANSFORM","label":"mathematical covariance","detail":"mathematical covariance."}],"timeSlices":[{"id":"TS-MAXWELL-PREDICTION","period":"1860s","label":"Electromagnetic waves implied","detail":"Electromagnetic waves implied — New radiation beyond visible light expected"},{"id":"TS-HERTZ","period":"1887–1888","label":"Sparks generate and detect radio-frequency waves","detail":"Sparks generate and detect radio-frequency waves — Prediction confirmed"},{"id":"TS-ETHER-DRIFT","period":"1881–1887","label":"Interferometers seek Earth's ether motion","detail":"Interferometers seek Earth's ether motion — Expected fringe shift absent"},{"id":"TS-LORENTZ-FITZGERALD","period":"1890s","label":"Length contraction and local time introduced","detail":"Length contraction and local time introduced — Empirical invariance accommodated"},{"id":"TS-POINCARE","period":"1900–1905","label":"Relativity principle and transformations clarified","detail":"Relativity principle and transformations clarified — Group structure approaches new kinematics"},{"id":"TS-EINSTEIN","period":"1905","label":"Ether-independent postulates adopted","detail":"Ether-independent postulates adopted — Space and time transformed"}],"patterns":[{"id":"P-01","detail":"Optics, radio, and moving-body electrodynamics connected"},{"id":"P-02","detail":"Maxwell theory generated new waves before detection"},{"id":"P-03","detail":"Ether motion problem reframed as spacetime symmetry"},{"id":"P-04","detail":"Frame-dependent time accepted"},{"id":"P-05","detail":"Maxwell equations and relativity principle retained"},{"id":"P-06","detail":"Null fringe shifts imposed quantitative bounds"}],"explicitEdges":[{"source":"A-MAXWELL-EQUATIONS","relation":"predicts","target":"D-HERTZ-WAVES"},{"source":"D-HERTZ-WAVES","relation":"validates","target":"A-MAXWELL-EQUATIONS"},{"source":"R-GALILEAN-ELECTRODYNAMICS","relation":"conflicts-with","target":"CONSTANT-C"},{"source":"R-RIGID-STATIONARY-ETHER","relation":"predicts","target":"ETHER-DRIFT"},{"source":"V-MICHELSON-MORLEY","relation":"fails-to-detect","target":"ETHER-DRIFT"},{"source":"A-LORENTZ-TRANSFORM","relation":"repairs","target":"ELECTRODYNAMIC-COVARIANCE"},{"source":"D-SPECIAL-RELATIVITY","relation":"reframes","target":"A-LORENTZ-TRANSFORM"},{"source":"D-EM-WAVES-LORENTZ-CRISIS-1887-1904","relation":"precedes","target":"D-SPECIAL-RELATIVITY"},{"source":"D-EM-WAVES-LORENTZ-CRISIS-1887-1904","relation":"instantiates","target":"P-03"}],"sourceCount":3,"wordCount":1840},{"file":"fundamental_physics_discoveries/20_light_quanta_and_photoelectric_effect.md","id":"D-LIGHT-QUANTUM-1905","title":"Light Quanta and the Photoelectric Effect","date":"17 March 1905 submission","year":1905.21,"era":"Quantum revolution","category":"Matter & emergence","domain":"Quantized radiation–matter interaction","contributors":"Albert Einstein; experimental foundations from Hertz, Hallwachs, Lenard, Millikan and others","status":"Photons are excitations of the quantized electromagnetic field","mainline":false,"claim":"Einstein proposed that radiation energy can behave as localized quanta h\\nu. This explained why photoelectron energy depends on light frequency, why emission has a threshold, and why intensity mainly changes electron number rather than maximum energy.","pathways":[{"id":"R-CLASSICAL-ENERGY-ACCUMULATION","label":"CLASSICAL ENERGY ACCUMULATION","what":"A classical photoemission model in which a continuous electromagnetic wave distributes energy over a material and an electron accumulates that energy over time until it escapes.","period":"nineteenth century–1904.","limitation":"","outcome":"Superseded for microscopic absorption."}],"assets":[{"id":"A-PLANCK-H","label":"quantized energy scale","detail":"quantized energy scale."},{"id":"A-STOPPING-POTENTIAL","label":"measures maximum electron kinetic energy","detail":"measures maximum electron kinetic energy."},{"id":"A-FREQUENCY-CONTROL","label":"separates color from intensity","detail":"separates color from intensity."},{"id":"A-WORK-FUNCTION","label":"material-dependent binding energy","detail":"material-dependent binding energy."}],"timeSlices":[{"id":"TS-PHOTOELECTRIC","period":"1887–1902","label":"Light ejects charge from materials","detail":"Light ejects charge from materials — Classical accumulation models strained"},{"id":"TS-PLANCK","period":"1900","label":"Matter oscillators exchange h\\nu elements","detail":"Matter oscillators exchange h\\nu elements — Quantization enters radiation theory"},{"id":"TS-EINSTEIN","period":"1905","label":"Light quanta proposed","detail":"Light quanta proposed — Radiation itself gains particle-like events"},{"id":"TS-MILLIKAN","period":"1910s","label":"Stopping potentials measured","detail":"Stopping potentials measured — Linear frequency law confirmed"},{"id":"TS-COMPTON","period":"1923","label":"Photon momentum observed","detail":"Photon momentum observed — Quantum radiation broadly accepted"},{"id":"TS-QED","period":"1940s onward","label":"Photon as gauge-field quantum","detail":"Photon as gauge-field quantum — Wave and particle phenomena unified"}],"patterns":[{"id":"P-01","detail":"Radiation thermodynamics and electron emission linked"},{"id":"P-02","detail":"Frequency generates electron energy via h\\nu"},{"id":"P-03","detail":"Intensity accumulation reframed as discrete absorption"},{"id":"P-04","detail":"Localized light quanta accepted"},{"id":"P-05","detail":"Wave interference retained in quantum amplitudes"},{"id":"P-06","detail":"Linear stopping-potential law gives a precise test"}],"explicitEdges":[{"source":"A-PLANCK-H","relation":"contributes-to","target":"D-LIGHT-QUANTUM-1905"},{"source":"R-CLASSICAL-ENERGY-ACCUMULATION","relation":"fails-to-explain","target":"FREQUENCY-THRESHOLD"},{"source":"D-LIGHT-QUANTUM-1905","relation":"explains","target":"FREQUENCY-THRESHOLD"},{"source":"PHOTON-ENERGY","relation":"minus","target":"WORK-FUNCTION"},{"source":"WORK-FUNCTION","relation":"yields","target":"PHOTOELECTRON-KINETIC-ENERGY"},{"source":"A-STOPPING-POTENTIAL","relation":"tests","target":"EQ-EINSTEIN-PHOTOELECTRIC"},{"source":"D-COMPTON","relation":"supports","target":"PHOTON-MOMENTUM"},{"source":"D-QED","relation":"reframes","target":"D-LIGHT-QUANTUM-1905"},{"source":"D-LIGHT-QUANTUM-1905","relation":"instantiates","target":"P-06"}],"sourceCount":3,"wordCount":1550},{"file":"fundamental_physics_discoveries/19_special_relativity.md","id":"D-SPECIAL-RELATIVITY-1905","title":"Special Relativity","date":"30 June 1905 submission","year":1905.5,"era":"Quantum revolution","category":"Cosmos & spacetime","domain":"Spacetime, inertial motion, electrodynamics","contributors":"Albert Einstein, with essential prior work by Lorentz, Poincaré, Maxwell and experimentalists","status":"Fundamental local spacetime theory without gravitation; recovered locally within general relativity","mainline":true,"claim":"Special relativity makes the laws of physics identical in inertial frames and assigns the same vacuum light speed c to all inertial observers. Space and time measurements become frame-dependent while spacetime intervals and causal structure remain invariant.","pathways":[{"id":"R-ABSOLUTE-SIMULTANEITY","label":"ABSOLUTE SIMULTANEITY","what":"A kinematic model with one universal time ordering and simultaneity relation shared by all inertial observers, independent of how clocks are synchronized by physical signals.","period":"antiquity through 1905.","limitation":"Light-based synchronization gives frame-dependent simultaneity.","outcome":"Replaced by spacetime-relative simultaneity."},{"id":"R-GALILEAN-TRANSFORMATION","label":"GALILEAN TRANSFORMATION","what":"The transformation x'=x-vt,\\ t'=t between inertial frames, which preserves absolute time and adds or subtracts velocities linearly.","period":"1632–1638 origins; standard nineteenth-century form.","limitation":"Does not preserve Maxwell equations or c.","outcome":"Retained as low-speed limit of Lorentz transformations."},{"id":"R-LORENTZ-ETHER-KINEMATICS","label":"LORENTZ ETHER KINEMATICS","what":"A preferred-frame theory using real length contraction and local-time effects to make matter and fields obey Lorentz-form equations.","period":"1892–1904.","limitation":"","outcome":"Superseded as ontology; equations retained."}],"assets":[{"id":"A-MAXWELL","label":"invariant electromagnetic wave speed","detail":"invariant electromagnetic wave speed."},{"id":"A-RELATIVITY-PRINCIPLE","label":"no preferred inertial frame in mechanics","detail":"no preferred inertial frame in mechanics."},{"id":"A-LORENTZ-TRANSFORM","label":"covariance structure","detail":"covariance structure."},{"id":"A-CLOCK-SYNCHRONIZATION","label":"operational definition of simultaneity","detail":"operational definition of simultaneity."},{"id":"A-ETHER-NULLS","label":"constraints on simple preferred-frame models","detail":"constraints on simple preferred-frame models."}],"timeSlices":[{"id":"TS-MAXWELL","period":"1860s","label":"Field equations contain fixed wave speed","detail":"Field equations contain fixed wave speed — Galilean transformations do not preserve form"},{"id":"TS-ETHER-TESTS","period":"1880s–1900s","label":"Preferred-frame motion sought","detail":"Preferred-frame motion sought — Expected drift not robustly found"},{"id":"TS-LORENTZ-POINCARE","period":"1890s–1905","label":"Transformations and relativity principle developed","detail":"Transformations and relativity principle developed — Mathematical covariance clarified"},{"id":"TS-EINSTEIN","period":"1905","label":"Operational synchronization and two postulates","detail":"Operational synchronization and two postulates — Ether-independent kinematics"},{"id":"TS-MINKOWSKI","period":"1908","label":"Four-dimensional geometry","detail":"Four-dimensional geometry — Spacetime structure made explicit"}],"patterns":[{"id":"P-01","detail":"Mechanics and electrodynamics unified by Lorentz symmetry"},{"id":"P-02","detail":"Postulates generate time, length, and energy relations"},{"id":"P-03","detail":"Ether dynamics reframed as spacetime kinematics"},{"id":"P-04","detail":"Relative simultaneity accepted"},{"id":"P-05","detail":"Galilean mechanics retained as low-speed limit"},{"id":"P-06","detail":"Clock, particle, and spectral tests quantify corrections"}],"explicitEdges":[{"source":"A-MAXWELL","relation":"conflicts-with","target":"R-GALILEAN-TRANSFORMATION"},{"source":"A-LORENTZ-TRANSFORM","relation":"contributes-to","target":"D-SPECIAL-RELATIVITY-1905"},{"source":"A-CLOCK-SYNCHRONIZATION","relation":"enables","target":"RELATIVITY-SIMULTANEITY"},{"source":"D-SPECIAL-RELATIVITY-1905","relation":"supersedes","target":"R-ABSOLUTE-SIMULTANEITY"},{"source":"D-SPECIAL-RELATIVITY-1905","relation":"retains-limit","target":"R-GALILEAN-TRANSFORMATION"},{"source":"LORENTZ-SYMMETRY","relation":"preserves","target":"SPACETIME-INTERVAL"},{"source":"D-SPECIAL-RELATIVITY-1905","relation":"precedes","target":"D-GENERAL-RELATIVITY"},{"source":"D-SPECIAL-RELATIVITY-1905","relation":"instantiates","target":"P-03"}],"sourceCount":3,"wordCount":1593},{"file":"fundamental_physics_discoveries/21_physical_reality_of_atoms.md","id":"D-BROWNIAN-ATOMS-1905-1908","title":"Physical Reality of Atoms and Molecules","date":"1905 theory; 1908–1909 Perrin validation","year":1909,"era":"Quantum revolution","category":"Mechanics & astronomy","domain":"Atomic-scale quantity inferred","contributors":"Albert Einstein and Jean Perrin, with foundations from Dalton, Avogadro, kinetic theory, and others","status":"Matter's atomic and molecular constitution is experimentally established; classical particles are not the final quantum description","mainline":false,"claim":"Einstein showed that visible Brownian motion should arise from molecular fluctuations and derived quantitative relations connecting diffusion to temperature, viscosity, particle size, and Avogadro's number. Perrin's experiments verified these relations and helped settle disputes over atoms' physical reality.","pathways":[{"id":"R-ATOMS-AS-CALCULATIONAL-FICTIONS","label":"ATOMS AS CALCULATIONAL FICTIONS","what":"An instrumentalist position in which atoms and molecules are useful symbols for organizing chemical and thermodynamic calculations but are not asserted to be real physical entities.","period":"1860s–1900s.","limitation":"Independent atomic-number estimates converged quantitatively.","outcome":"Superseded as a general stance."},{"id":"R-BROWNIAN-LIVING-MOTILITY","label":"BROWNIAN LIVING MOTILITY","what":"The claim that Brownian grains move because they are alive or contain a vital agency.","period":"1827–late nineteenth century.","limitation":"","outcome":"Inorganic particles display the same statistics."},{"id":"R-BROWNIAN-CONVECTION-EVAPORATION","label":"BROWNIAN CONVECTION EVAPORATION","what":"The claim that bulk currents from temperature gradients or evaporation drive the irregular motion.","period":"nineteenth-century control hypothesis.","limitation":"","outcome":"Sealed, stabilized experiments retain the predicted microscopic jitter."},{"id":"R-BROWNIAN-MECHANICAL-VIBRATION","label":"BROWNIAN MECHANICAL VIBRATION","what":"The claim that apparatus or environmental shaking produces the observed random displacement.","period":"nineteenth-century control hypothesis.","limitation":"","outcome":"Isolation and size/temperature/viscosity scaling reject it as the general cause."}],"assets":[{"id":"A-DIFFUSION","label":"measurable spreading","detail":"measurable spreading."},{"id":"A-OSMOTIC-PRESSURE","label":"dilute suspension analogy","detail":"dilute suspension analogy."},{"id":"A-VISCOSITY","label":"Stokes drag","detail":"Stokes drag."},{"id":"A-MICROSCOPY","label":"particle trajectories","detail":"particle trajectories."},{"id":"A-STATISTICAL-MECHANICS","label":"fluctuations as expected behavior","detail":"fluctuations as expected behavior."}],"timeSlices":[{"id":"TS-CHEMICAL-ATOMISM","period":"1800s","label":"Combining ratios modeled with atoms","detail":"Combining ratios modeled with atoms — Ontological status disputed"},{"id":"TS-KINETIC-THEORY","period":"1850s–1890s","label":"Gas laws derived from molecules","detail":"Gas laws derived from molecules — Energeticists resist unseen entities"},{"id":"TS-BROWNIAN-OBSERVATION","period":"1827 onward","label":"Suspended grains move irregularly","detail":"Suspended grains move irregularly — Causes debated"},{"id":"TS-EINSTEIN","period":"1905","label":"Molecular fluctuations yield diffusion law","detail":"Molecular fluctuations yield diffusion law — Atomic scale becomes measurable"},{"id":"TS-PERRIN","period":"1908 onward","label":"Multiple measurements converge on N_A","detail":"Multiple measurements converge on N_A — Atomism gains decisive support"},{"id":"TS-MODERN","period":"20th century onward","label":"Scattering and imaging resolve structure","detail":"Scattering and imaging resolve structure — Quantum constituents replace classical hard atoms"}],"patterns":[{"id":"P-01","detail":"Thermodynamics, hydrodynamics, and microscopic matter unified"},{"id":"P-02","detail":"Random trajectories generated a molecular-scale law"},{"id":"P-03","detail":"Noise reframed as signal about unseen constituents"},{"id":"P-04","detail":"Statistical fluctuations accepted as explanatory"},{"id":"P-05","detail":"Chemical atoms retained and given physical measurement"},{"id":"P-06","detail":"Independent estimates of N_A converged"}],"explicitEdges":[{"source":"A-STATISTICAL-MECHANICS","relation":"enables","target":"D-BROWNIAN-ATOMS-1905-1908"},{"source":"A-VISCOSITY","relation":"constrains","target":"EQ-DIFFUSION"},{"source":"A-MICROSCOPY","relation":"measures","target":"MEAN-SQUARE-DISPLACEMENT"},{"source":"EQ-DIFFUSION","relation":"infers","target":"BOLTZMANN-CONSTANT"},{"source":"BOLTZMANN-CONSTANT","relation":"infers","target":"AVOGADRO-CONSTANT"},{"source":"V-PERRIN","relation":"validates","target":"D-BROWNIAN-ATOMS-1905-1908"},{"source":"D-BROWNIAN-ATOMS-1905-1908","relation":"supersedes","target":"R-ATOMS-AS-CALCULATIONAL-FICTIONS"},{"source":"D-BROWNIAN-ATOMS-1905-1908","relation":"instantiates","target":"P-03"}],"sourceCount":3,"wordCount":1768},{"file":"fundamental_physics_discoveries/22_atomic_nucleus.md","id":"D-RUTHERFORD-NUCLEUS-1911","title":"Atomic Nucleus","date":"May 1911 (Rutherford nuclear-atom paper)","year":1911.4,"era":"Quantum revolution","category":"Mechanics & astronomy","domain":"Atomic structure and scattering","contributors":"Ernest Rutherford, Hans Geiger, Ernest Marsden","status":"Atoms contain compact nuclei; nuclear structure is described by quantum chromodynamics and effective nuclear theories","mainline":false,"claim":"Rare large-angle alpha-particle scattering showed that an atom's positive charge and most of its mass are concentrated in a region far smaller than the atom. This replaced diffuse-positive-charge models with the nuclear atom.","pathways":[{"id":"R-DIFFUSE-POSITIVE-ATOM","label":"DIFFUSE POSITIVE ATOM","what":"Thomson's “plum-pudding” class of atomic models, in which negative electrons are embedded within a broadly distributed positive charge occupying most of the atomic volume.","period":"1904 (Thomson model).","limitation":"","outcome":"Superseded by concentrated nuclear charge."},{"id":"R-NAGAOKA-SATURNIAN-ATOM","label":"NAGAOKA SATURNIAN ATOM","what":"Nagaoka's 1904 atomic model with electrons arranged in a ring around a massive, positively charged center, by analogy with Saturn and its rings.","period":"1904.","limitation":"Classical stability and spectral behavior were inadequate, and it was not derived from the quantitative large-angle scattering distribution.","outcome":"Superseded as an atomic model; retained as an important but nonidentical precursor to concentrated-center reasoning."}],"assets":[{"id":"A-ALPHA-BEAM","label":"energetic, massive, positively charged probe","detail":"energetic, massive, positively charged probe."},{"id":"A-THIN-FOIL","label":"approximates single scattering","detail":"approximates single scattering."},{"id":"A-SCINTILLATION","label":"counts individual impacts","detail":"counts individual impacts."},{"id":"A-COULOMB-FORCE","label":"connects angle to impact parameter","detail":"connects angle to impact parameter."}],"timeSlices":[{"id":"TS-ELECTRON","period":"1897 onward","label":"Negative constituents known","detail":"Negative constituents known — Positive atomic structure unresolved"},{"id":"TS-THOMSON-ATOM","period":"c. 1904","label":"Electrons embedded in diffuse positive charge","detail":"Electrons embedded in diffuse positive charge — Predicts mostly small deflections"},{"id":"TS-GEIGER-MARSDEN","period":"1909","label":"Thin-foil alpha scattering measured","detail":"Thin-foil alpha scattering measured — Rare backward events found"},{"id":"TS-RUTHERFORD","period":"1911","label":"Central charge model derives angular law","detail":"Central charge model derives angular law — Nucleus introduced"},{"id":"TS-BOHR","period":"1913","label":"Quantized electrons around nucleus","detail":"Quantized electrons around nucleus — Spectra connected to nuclear charge"},{"id":"TS-PROTON-NEUTRON","period":"1919–1932","label":"Nuclear constituents identified","detail":"Nuclear constituents identified — Nuclear models deepen"}],"patterns":[{"id":"P-01","detail":"Scattering and atomic constitution linked"},{"id":"P-02","detail":"Angular distribution generated by a central potential"},{"id":"P-03","detail":"Rare outliers reframed as decisive structural evidence"},{"id":"P-04","detail":"Mostly empty atom with tiny massive center accepted"},{"id":"P-05","detail":"Thomson's electron retained"},{"id":"P-06","detail":"Full angular distribution discriminated models"}],"explicitEdges":[{"source":"A-ALPHA-BEAM","relation":"probes","target":"ATOM"},{"source":"R-DIFFUSE-POSITIVE-ATOM","relation":"predicts","target":"SMALL-ANGLE-SCATTERING"},{"source":"V-BACKSCATTERING","relation":"contradicts","target":"R-DIFFUSE-POSITIVE-ATOM"},{"source":"D-RUTHERFORD-NUCLEUS-1911","relation":"explains","target":"V-BACKSCATTERING"},{"source":"A-COULOMB-FORCE","relation":"generates","target":"RUTHERFORD-CROSS-SECTION"},{"source":"D-RUTHERFORD-NUCLEUS-1911","relation":"precedes","target":"D-BOHR-ATOM"},{"source":"D-RUTHERFORD-NUCLEUS-1911","relation":"instantiates","target":"P-03"}],"sourceCount":4,"wordCount":1674},{"file":"fundamental_physics_discoveries/23_quantized_atomic_structure.md","id":"D-BOHR-ATOM-1913","title":"Quantized Atomic Structure","date":"July 1913 (Bohr trilogy begins)","year":1913.55,"era":"Quantum revolution","category":"Mechanics & astronomy","domain":"Atomic energy levels and spectra","contributors":"Niels Bohr, building on Rutherford, Planck, Einstein, Balmer and spectroscopy","status":"Discrete atomic energy levels are fundamental; Bohr's definite circular electron orbits are superseded","mainline":false,"claim":"Bohr combined Rutherford's nucleus with quantum postulates to explain hydrogen's spectral regularities and atomic stability. The model's successful energy spectrum was retained by quantum mechanics, while its classical orbits with imposed rules were replaced by wavefunctions and operators.","pathways":[{"id":"R-CLASSICAL-PLANETARY-ATOM","label":"CLASSICAL PLANETARY ATOM","what":"A Rutherford-style classical atom in which electrons follow continuously allowed mechanical orbits around a compact positive nucleus under the Coulomb force.","period":"1911–1912.","limitation":"","outcome":"Replaced by stationary quantum states."},{"id":"R-THOMSON-DIFFUSE-ATOM","label":"THOMSON DIFFUSE ATOM","what":"Thomson's pre-nuclear atom, with electrons embedded in extended positive charge and small oscillations used to model spectral behavior.","period":"1904.","limitation":"Rutherford scattering required concentrated positive charge, and the model did not generate the hydrogen spectrum.","outcome":"Superseded; atomic compositeness and electron degrees of freedom were retained."},{"id":"R-NICHOLSON-PROTOQUANTIZED-ATOM","label":"NICHOLSON PROTOQUANTIZED ATOM","what":"Nicholson's 1911–1912 celestial and atomic models using discrete angular-momentum conditions to calculate selected spectral lines before Bohr's hydrogen theory.","period":"1911–1912.","limitation":"The hypothetical substances and spectral assignments did not provide a general stable-atom theory.","outcome":"Superseded, while quantized angular momentum became an important precursor resource."}],"assets":[{"id":"A-RUTHERFORD-NUCLEUS","label":"Coulomb central potential","detail":"Coulomb central potential."},{"id":"A-PLANCK-EINSTEIN","label":"E=h\\nu","detail":"E=h\\nu."},{"id":"A-BALMER-RYDBERG","label":"numerical spectral law","detail":"numerical spectral law."},{"id":"A-ATOMIC-STABILITY","label":"constraint on acceptable dynamics","detail":"constraint on acceptable dynamics."}],"timeSlices":[{"id":"TS-SPECTRAL-LINES","period":"19th century","label":"Atoms emit discrete line series","detail":"Atoms emit discrete line series — Empirical formulas lack mechanism"},{"id":"TS-RUTHERFORD","period":"1911","label":"Compact nucleus established","detail":"Compact nucleus established — Classical electron orbit unstable"},{"id":"TS-BOHR","period":"1913","label":"Stationary states and quantum jumps postulated","detail":"Stationary states and quantum jumps postulated — Hydrogen spectrum derived"},{"id":"TS-SOMMERFELD","period":"1916","label":"Elliptical orbits and relativistic corrections","detail":"Elliptical orbits and relativistic corrections — Partial fine-structure fit"},{"id":"TS-QUANTUM-MECHANICS","period":"1925 onward","label":"Orbit postulates replaced","detail":"Orbit postulates replaced — Energy eigenstates generalized"}],"patterns":[{"id":"P-01","detail":"Nuclear atom, spectra, and energy quanta unified"},{"id":"P-02","detail":"Rydberg regularity generated from quantized states"},{"id":"P-03","detail":"Radiation failure reframed by stationary states"},{"id":"P-04","detail":"Quantum jumps and nonradiating states accepted"},{"id":"P-05","detail":"Rutherford nucleus and classical Coulomb force retained"},{"id":"P-06","detail":"Line wavelengths and ionization energies tested"}],"explicitEdges":[{"source":"A-RUTHERFORD-NUCLEUS","relation":"contributes-to","target":"D-BOHR-ATOM-1913"},{"source":"A-PLANCK-EINSTEIN","relation":"enables","target":"QUANTUM-TRANSITION"},{"source":"A-BALMER-RYDBERG","relation":"constrains","target":"D-BOHR-ATOM-1913"},{"source":"R-CLASSICAL-PLANETARY-ATOM","relation":"superseded-by","target":"D-BOHR-ATOM-1913"},{"source":"D-BOHR-ATOM-1913","relation":"generates","target":"HYDROGEN-SPECTRUM"},{"source":"D-QUANTUM-MECHANICS","relation":"supersedes","target":"R-BOHR-SOMMERFELD-ORBITS"},{"source":"D-QUANTUM-MECHANICS","relation":"retains","target":"DISCRETE-ENERGY-LEVELS"},{"source":"D-BOHR-ATOM-1913","relation":"instantiates","target":"P-05"}],"sourceCount":3,"wordCount":1635},{"file":"fundamental_physics_discoveries/24_general_relativity.md","id":"D-GENERAL-RELATIVITY-1915","title":"General Relativity","date":"25 November 1915 field equations","year":1915.9,"era":"Quantum revolution","category":"Cosmos & spacetime","domain":"Gravitation and dynamical spacetime","contributors":"Albert Einstein, with major mathematical and scientific contributions from Grossmann, Hilbert, Levi-Civita, Ricci and others","status":"Best-tested classical theory of gravitation; quantum completion unresolved","mainline":true,"claim":"General relativity replaces gravitational force in fixed Euclidean space with dynamical spacetime geometry sourced by stress–energy. Freely falling bodies follow spacetime geodesics, while curvature governs relative acceleration.","pathways":[{"id":"R-SCALAR-GRAVITY","label":"SCALAR GRAVITY","what":"A relativistic gravity theory in which gravitation is represented by a single scalar field or potential on a fixed spacetime background, rather than by a dynamical tensor metric.","period":"1912–1914.","limitation":"Fails to capture observed light bending and full equivalence structure.","outcome":"Superseded as fundamental gravity."},{"id":"R-NEWTONIAN-ABSOLUTE-GRAVITY","label":"NEWTONIAN ABSOLUTE GRAVITY","what":"Newton's gravitational model of instantaneous attraction F=Gm_1m_2/r^2 acting within absolute Euclidean space and universal time.","period":"1687.","limitation":"Cannot explain relativistic precession, gravitational time dilation, horizons, or gravitational waves.","outcome":"Retained as weak-field, slow-motion limit."},{"id":"R-FLAT-SPACETIME-RELATIVISTIC-FORCE-GRAVITY","label":"FLAT SPACETIME RELATIVISTIC FORCE GRAVITY","what":"Relativistic force models that retain a fixed spacetime background while modifying propagation speed or force laws to mimic redshift and orbital corrections.","period":"1905–1914.","limitation":"","outcome":"Superseded by the unified dynamical-metric account; weak approximations can be reformulated effectively."}],"assets":[{"id":"A-EQUIVALENCE-PRINCIPLE","label":"inertial and gravitational mass equality","detail":"inertial and gravitational mass equality."},{"id":"A-SPECIAL-RELATIVITY","label":"local Lorentz symmetry","detail":"local Lorentz symmetry."},{"id":"A-RIEMANN-GEOMETRY","label":"curvature tensors","detail":"curvature tensors."},{"id":"A-MERCURY-RESIDUAL","label":"unexplained perihelion advance","detail":"unexplained perihelion advance."},{"id":"A-CONSERVATION","label":"stress–energy consistency","detail":"stress–energy consistency."}],"timeSlices":[{"id":"TS-NEWTONIAN-GRAVITY","period":"1687 onward","label":"Highly successful inverse-square force","detail":"Highly successful inverse-square force — Instantaneous action and absolute space remain"},{"id":"TS-SPECIAL-RELATIVITY","period":"1905","label":"No faster-than-light causal influence","detail":"No faster-than-light causal influence — Newtonian gravity incompatible"},{"id":"TS-EQUIVALENCE","period":"1907–1911","label":"Free fall locally removes gravity","detail":"Free fall locally removes gravity — Gravity linked to frames and geometry"},{"id":"TS-TENSOR-DEVELOPMENT","period":"1912–1915","label":"Seek generally covariant field equations","detail":"Seek generally covariant field equations — Curved differential geometry adopted"},{"id":"TS-FIELD-EQUATIONS","period":"1915","label":"Final equations and Mercury result","detail":"Final equations and Mercury result — New gravitational dynamics"},{"id":"TS-OBSERVATIONAL","period":"1919 onward","label":"Lensing, redshift, timing, waves tested","detail":"Lensing, redshift, timing, waves tested — Relativistic astrophysics and cosmology"}],"patterns":[{"id":"P-01","detail":"Gravitation, inertia, geometry, and time unified"},{"id":"P-02","detail":"Geometry generates trajectories, lensing, and waves"},{"id":"P-03","detail":"Force in space reframed as curved spacetime"},{"id":"P-04","detail":"Dynamical geometry accepted"},{"id":"P-05","detail":"Newtonian gravity retained as weak-field limit"},{"id":"P-06","detail":"Mercury, clocks, light, pulsars, and waves test one theory"}],"explicitEdges":[{"source":"A-EQUIVALENCE-PRINCIPLE","relation":"motivates","target":"D-GENERAL-RELATIVITY-1915"},{"source":"A-SPECIAL-RELATIVITY","relation":"constrains","target":"D-GENERAL-RELATIVITY-1915"},{"source":"A-RIEMANN-GEOMETRY","relation":"enables","target":"D-GENERAL-RELATIVITY-1915"},{"source":"R-SCALAR-GRAVITY","relation":"superseded-by","target":"D-GENERAL-RELATIVITY-1915"},{"source":"D-GENERAL-RELATIVITY-1915","relation":"retains-limit","target":"R-NEWTONIAN-ABSOLUTE-GRAVITY"},{"source":"FIELD-EQUATIONS","relation":"generate","target":"SPACETIME-CURVATURE"},{"source":"SPACETIME-CURVATURE","relation":"governs","target":"GEODESIC-MOTION"},{"source":"D-GENERAL-RELATIVITY-1915","relation":"enables","target":"D-EXPANDING-UNIVERSE"},{"source":"D-GENERAL-RELATIVITY-1915","relation":"instantiates","target":"P-03"}],"sourceCount":3,"wordCount":1661},{"file":"fundamental_physics_discoveries/46_noethers_theorem_and_symmetry.md","id":"D-NOETHER-THEOREMS-1918","title":"Noether's Theorems and Symmetry Principles","date":"July 1918 presentation and 1918 publication","year":1918.57,"era":"Quantum revolution","category":"Quantum & radiation","domain":"Variational mechanics, classical and quantum field theory, conservation laws, and gauge symmetry","contributors":"Emmy Noether; with motivating problems posed in work by Hilbert, Klein, Einstein and others","status":"Mathematically established structural theorems; their physical use depends on an action, its symmetries, boundary conditions, and whether the equations of motion hold","mainline":false,"claim":"Noether showed that continuous symmetries of a variational problem imply identities and conservation laws. Her first theorem associates finite-dimensional continuous global symmetries with conserved currents on solutions; her second theorem associates local symmetries depending on arbitrary functions with differential identities among the field equations. This replaced a collection of separately noticed conservation rules with a generative method, but it does not imply that every conservation law is globally well-defined in every spacetime or that every symmetry is a physical transformation rather than a descriptive redundancy.","pathways":[{"id":"R-CASE-BY-CASE-CONSERVATION","label":"CASE BY CASE CONSERVATION","what":"A practice in which energy, linear momentum, angular momentum, electric charge, and other conserved quantities are derived separately from the particular forces or equations of each model, without one theorem relating them to transformations of the action.","period":"seventeenth century–1917.","limitation":"It obscured why the same conservation structures recur across very different theories and offered little guidance for inventing new field theories.","outcome":"Superseded as the most general organizing account, while remaining valid for direct calculations."},{"id":"R-COORDINATE-CYCLICITY-AS-ULTIMATE-CAUSE","label":"COORDINATE CYCLICITY AS ULTIMATE CAUSE","what":"The identification of a conserved canonical momentum p_i with the absence of a coordinate q_i from a chosen Lagrangian, treated as a coordinate-specific trick rather than an expression of an underlying continuous transformation group.","period":"late eighteenth century–1917.","limitation":"Symmetries may mix coordinates and fields, act only up to a boundary term, or be difficult to expose through an ignorable coordinate.","outcome":"Absorbed as a special case of Noether's first theorem."},{"id":"R-ORDINARY-DIVERGENCE-GR-ENERGY","label":"ORDINARY DIVERGENCE GR ENERGY","what":"The attempt to represent gravitational energy in general relativity by an ordinary, unique local tensor density whose coordinate divergence vanishes in the same straightforward manner as the energy current of matter in a fixed background.","period":"1915–1917.","limitation":"General covariance creates differential identities, while gravitational energy cannot generally be represented by a unique covariant local stress-energy tensor.","outcome":"The universal local-tensor expectation was abandoned; quasi-local and asymptotic energy remain active, context-dependent constructions."}],"assets":[{"id":"A-STATIONARY-ACTION","label":"dynamics encoded by extremizing an action","detail":"dynamics encoded by extremizing an action."},{"id":"A-EULER-LAGRANGE","label":"equations obtained by varying generalized coordinates or fields","detail":"equations obtained by varying generalized coordinates or fields."},{"id":"A-LIE-GROUPS","label":"continuous transformations described infinitesimally by generators","detail":"continuous transformations described infinitesimally by generators."},{"id":"A-INVARIANT-THEORY","label":"mathematical techniques for quantities unchanged by transformations","detail":"mathematical techniques for quantities unchanged by transformations."},{"id":"A-GENERAL-COVARIANCE","label":"a motivating local symmetry with identities among gravitational field equations","detail":"a motivating local symmetry with identities among gravitational field equations."},{"id":"A-BOUNDARY-TERMS","label":"recognition that an action may be invariant up to a total divergence","detail":"recognition that an action may be invariant up to a total divergence."}],"timeSlices":[{"id":"TS-VARIATIONAL-MECHANICS","period":"1740s–nineteenth century","label":"Euler–Lagrange and Hamiltonian mechanics organize motion through stationary action","detail":"Euler–Lagrange and Hamiltonian mechanics organize motion through stationary action — Cyclic coordinates are linked to constants of motion in particular cases"},{"id":"TS-INVARIANT-THEORY","period":"nineteenth century","label":"Transformation groups and invariants become systematic mathematical objects","detail":"Transformation groups and invariants become systematic mathematical objects — Symmetry can be studied independently of coordinates"},{"id":"TS-GR-ENERGY-PROBLEM","period":"1915–1917","label":"General covariance complicates familiar gravitational-energy conservation statements","detail":"General covariance complicates familiar gravitational-energy conservation statements — Hilbert and Klein seek a general relation between invariance and conservation"},{"id":"TS-NOETHER","period":"1918","label":"Two general theorems classify finite and infinite continuous transformation groups","detail":"Two general theorems classify finite and infinite continuous transformation groups — Currents and differential identities follow from action symmetry"},{"id":"TS-MODERN-SYMMETRY","period":"1920s onward","label":"Quantum fields and gauge theories require organizing principles","detail":"Quantum fields and gauge theories require organizing principles — Charges, selection rules, Ward identities, and gauge constraints inherit Noether structure"}],"patterns":[{"id":"P-01","detail":"Mechanics, field theory, geometry, and conservation are linked by one variational structure"},{"id":"P-02","detail":"Recurrent empirical conservation laws become generated consequences of transformations"},{"id":"P-03","detail":"“Why is this quantity conserved?” becomes “Which action symmetry generates its current?”"},{"id":"P-04","detail":"Transformation groups, currents, and gauge identities become primary explanatory objects"},{"id":"P-05","detail":"Cyclic-coordinate and case-specific conservation results survive as special cases"},{"id":"P-06","detail":"Candidate actions can be tested by explicit variation, current divergence, and selection rules"}],"explicitEdges":[{"source":"A-STATIONARY-ACTION","relation":"enables","target":"D-NOETHER-THEOREMS-1918"},{"source":"A-LIE-GROUPS","relation":"formalizes","target":"CONTINUOUS-SYMMETRY"},{"source":"CONTINUOUS-GLOBAL-SYMMETRY","relation":"generates","target":"NOETHER-CURRENT"},{"source":"LOCAL-GAUGE-SYMMETRY","relation":"implies","target":"DIFFERENTIAL-IDENTITY"},{"source":"D-NOETHER-THEOREMS-1918","relation":"subsumes","target":"R-COORDINATE-CYCLICITY-AS-ULTIMATE-CAUSE"},{"source":"TIME-TRANSLATION","relation":"generates-when-defined","target":"ENERGY-CONSERVATION"},{"source":"ROTATION-SYMMETRY","relation":"generates","target":"ANGULAR-MOMENTUM-CONSERVATION"},{"source":"QUANTUM-ANOMALY","relation":"can-obstruct","target":"CLASSICAL-NOETHER-CURRENT"},{"source":"D-NOETHER-THEOREMS-1918","relation":"instantiates","target":"P-02"}],"sourceCount":4,"wordCount":2286},{"file":"fundamental_physics_discoveries/54_de_broglie_matter_waves.md","id":"D-DE-BROGLIE-MATTER-WAVES-1924","title":"De Broglie Matter Waves and Wave–Particle Duality","date":"1923 notes; 25 November 1924 thesis defense","year":1924.9,"era":"Quantum revolution","category":"Matter & emergence","domain":"Quantum foundations, matter-wave kinematics, electron diffraction, and the transition from old quantum theory to wave mechanics","contributors":"Louis de Broglie; experimentally developed by Clinton Davisson, Lester Germer, George Paget Thomson, Alexander Reid and others","status":"Matter-wave interference and diffraction are experimentally established; “wave–particle duality” is a historically useful but potentially misleading label rather than two alternating classical substances","mainline":false,"claim":"De Broglie proposed that the wave–quantum relation known for radiation should be reciprocal: a material particle with energy E and momentum p is associated with frequency and wavelength satisfying E=\\hbar\\omega and p=\\hbar k, hence \\lambda=h/p. This supplied a phase-based explanation for quantum conditions and directly stimulated Schrödinger's wave mechanics. Electron diffraction later confirmed the predicted wavelength. Modern quantum theory retains the relations while replacing the picture of a localized classical particle accompanied by an ordinary mechanical wave with a quantum state whose amplitudes generate interference and whose localized detections exchange particle-like energy and momentum.","pathways":[{"id":"R-CLASSICAL-MATTER-PARTICLES-ONLY","label":"CLASSICAL MATTER PARTICLES ONLY","what":"A mechanical framework in which matter consists exclusively of localized corpuscles following definite trajectories, with state specified by positions and momenta and with no wavelength, phase, or self-interference associated with a freely moving particle.","period":"seventeenth century–1923.","limitation":"It supplies no mechanism for electron diffraction, single-particle interference, or the appearance of discrete atomic states through phase closure.","outcome":"Retained as the short-wavelength, decohered, or trajectory approximation; superseded as a universal ontology of microscopic matter."},{"id":"R-WAVES-REQUIRE-MATERIAL-MEDIUM","label":"WAVES REQUIRE MATERIAL MEDIUM","what":"The doctrine that every genuine wave must be a deformation or oscillation of a material carrier, analogous to sound in air or elastic waves in a solid, so a matter wave would require a mechanical ether or literal distributed material substance.","period":"seventeenth century–early 1920s.","limitation":"Relativistic experiments undermined a privileged mechanical light ether, while quantum wavefunctions live in configuration space for many particles and need not be material densities in ordinary space.","outcome":"Superseded as a requirement for quantum waves; retained for actual material-wave media."},{"id":"R-BOHR-SOMMERFELD-QUANTIZATION-AS-POSTULATE","label":"BOHR SOMMERFELD QUANTIZATION AS POSTULATE","what":"The old quantum theory in which electrons occupy selected classical orbits and allowed motions satisfy imposed action conditions such as \\oint p_i\\,dq_i=
